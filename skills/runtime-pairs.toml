# Equivalent workflows named for the provider called by each host.
# Rationale: skills/PARITY.md, approved 2026-09-30.
[pairs]
codex-review = "claude-review"
codex-build = "claude-build"
grill-me-codex = "grill-me-claude"
grill-with-docs-codex = "grill-with-docs-claude"

# Codex-host Geminex calls Gemini; the inverse entry points live in Gemini,
# not Claude. Keeping the host pair explicit prevents false missing-skill errors.
[codex_gemini_pairs]
gemini-review = "codex-review"
gemini-build = "codex-build"
grill-me-gemini = "grill-me-codex"
grill-with-docs-gemini = "grill-with-docs-codex"
