<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="universal-desires-t universal-desires-d" xmlns="http://www.w3.org/2000/svg"><title id="universal-desires-t">Not everyone wants the goal</title><desc id="universal-desires-d">A crowd of sixteen people. Fourteen are filled in as wanting the goal and two are outlined with a no-thanks label. The argument counts all sixteen as wanting it.</desc><circle cx="52" cy="44" r="12" class="fg"/><circle cx="88" cy="44" r="12" class="fg"/><circle cx="124" cy="44" r="12" class="fg"/><circle cx="160" cy="44" r="12" class="fg"/><circle cx="196" cy="44" r="12" class="fg"/><circle cx="232" cy="44" r="12" class="fg"/><circle cx="268" cy="44" r="12" class="fg"/><circle cx="304" cy="44" r="12" class="fg"/><circle cx="52" cy="84" r="12" class="fg"/><circle cx="88" cy="84" r="12" class="fg"/><circle cx="124" cy="84" r="12" class="fp lr"/><circle cx="160" cy="84" r="12" class="fg"/><circle cx="196" cy="84" r="12" class="fg"/><circle cx="232" cy="84" r="12" class="fg"/><circle cx="268" cy="84" r="12" class="fp lr"/><circle cx="304" cy="84" r="12" class="fg"/><text class="ts" x="160" y="130" text-anchor="middle">no thanks</text><text class="ts" x="268" y="130" text-anchor="middle">no thanks</text><text class="ts" x="180" y="18" text-anchor="middle">the argument counts everyone as wanting it</text></svg>