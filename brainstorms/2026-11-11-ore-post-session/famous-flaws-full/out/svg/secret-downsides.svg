<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="secret-downsides-t secret-downsides-d" xmlns="http://www.w3.org/2000/svg"><title id="secret-downsides-t">The visible benefit above the waterline and the hidden cost below</title><desc id="secret-downsides-d">A wavy waterline. Above it a small tip labelled benefit shown. Below it a much larger mass labelled cost never mentioned.</desc><path class="fgt lg" d="M150 66L180 20L210 66z"/><text class="ts" x="180" y="44" text-anchor="middle">benefit</text><text class="ts" x="280" y="40" text-anchor="middle">what the argument shows</text><path class="ln" d="M20 66Q50 56 80 66T140 66T200 66T260 66T340 66"/><path class="pinkbox lg" d="M120 70L240 70L226 120L180 140L134 120z" style="opacity:.8"/><text class="tb" x="180" y="100" text-anchor="middle">cost</text><text class="ts" x="180" y="114" text-anchor="middle">never mentioned</text><text class="ts" x="60" y="100" text-anchor="middle">below the line</text><text class="ts" x="298" y="96" text-anchor="middle">the argument</text><text class="ts" x="298" y="110" text-anchor="middle">never looks here</text></svg>