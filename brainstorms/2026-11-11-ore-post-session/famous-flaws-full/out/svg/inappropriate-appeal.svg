<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="inappropriate-appeal-t inappropriate-appeal-d" xmlns="http://www.w3.org/2000/svg"><title id="inappropriate-appeal-t">An authority badge that does not match the topic</title><desc id="inappropriate-appeal-d">A badge with a star labelled famous, popular or pitiable on the left, a card on the right labelled the topic at hand, and a mismatch mark between them.</desc><circle class="fgt lg" cx="70" cy="64" r="34"/><path class="fg" d="M70 40l7 15 16 2-12 11 3.5 16L70 76l-14.5 8L59 68 47 57l16-2z"/><text class="ts" x="70" y="114" text-anchor="middle">famous, popular,</text><text class="ts" x="70" y="127" text-anchor="middle">or pitiable</text><rect class="fp ln" x="214" y="34" width="130" height="62" rx="12"/><text class="tb" x="279" y="62" text-anchor="middle">the topic at hand</text><text class="ts" x="279" y="78" text-anchor="middle">needs expertise on it</text><path class="lr dash" d="M112 64H206"/><path class="lr" d="M150 55L168 73M168 55L150 73"/><text class="ts" x="159" y="100" text-anchor="middle">not an expert here</text></svg>