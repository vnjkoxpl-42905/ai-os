<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="equivocation-t equivocation-d" xmlns="http://www.w3.org/2000/svg"><title id="equivocation-t">One word, two meanings</title><desc id="equivocation-d">The word sanctions in the centre splits into two paths: one meaning, approves, is the sense used in the conclusion and the other meaning, penalizes, is the sense used in the premise.</desc><rect class="fgt lg" x="130" y="14" width="100" height="34" rx="17"/><text class="tb" x="180" y="36" text-anchor="middle">sanctions</text><path class="lg" d="M160 50L80 92"/><path class="lg" d="M85.4 84.8L80 92L89.0 91.7"/><path class="lg" d="M200 50L280 92"/><path class="lg" d="M271.0 91.7L280 92L274.6 84.8"/><rect class="fp ln" x="22" y="94" width="116" height="36" rx="10"/><text class="tb" x="80" y="112" text-anchor="middle">approves</text><text class="ts" x="80" y="124" text-anchor="middle">conclusion's meaning</text><rect class="fp ln" x="222" y="94" width="116" height="36" rx="10"/><text class="tb" x="280" y="112" text-anchor="middle">penalizes</text><text class="ts" x="280" y="124" text-anchor="middle">premise's meaning</text><path class="lr dash" d="M144 112H216"/><text class="ts" x="180" y="108" text-anchor="middle">swapped</text></svg>