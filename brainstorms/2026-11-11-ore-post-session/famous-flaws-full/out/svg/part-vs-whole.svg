<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="part-vs-whole-t part-vs-whole-d" xmlns="http://www.w3.org/2000/svg"><title id="part-vs-whole-t">Parts and the whole they make</title><desc id="part-vs-whole-d">On the left, three star parts. On the right, one large whole made from them. An arrow from the parts to the whole and an arrow from the whole to the parts are both marked with a question mark: a trait of one does not carry over to the other.</desc><g><circle class="fgt lg" cx="46" cy="40" r="17"/><path class="fg" d="M46 31l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/><circle class="fgt lg" cx="96" cy="40" r="17"/><path class="fg" d="M96 31l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/><circle class="fgt lg" cx="71" cy="90" r="17"/><path class="fg" d="M71 81l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/><text class="ts" x="71" y="126" text-anchor="middle">each part</text></g><rect class="fgt lg" x="236" y="28" width="104" height="82" rx="20"/><text class="tb" x="288" y="64" text-anchor="middle">the whole</text><text class="ts" x="288" y="80" text-anchor="middle">(the team)</text><path class="lg" d="M128 50L226 50"/><path class="lg" d="M217.9 53.9L226 50L217.9 46.1"/><text class="ts" x="177" y="42" text-anchor="middle">parts great, so whole great?</text><path class="lg" d="M226 92L128 92"/><path class="lg" d="M136.1 88.1L128 92L136.1 95.9"/><text class="ts" x="177" y="112" text-anchor="middle">whole great, so each part great?</text><path class="lr" d="M169 63L185 79M185 63L169 79"/></svg>