<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="causal-t causal-d" xmlns="http://www.w3.org/2000/svg"><title id="causal-t">Four stories fit the same fact</title><desc id="causal-d">At the top, two things A and B happen together. Below are four possible stories: A causes B, B causes A, a third factor C causes both, or it is coincidence.</desc><circle class="fgt lg" cx="140" cy="26" r="16"/><text class="tb" x="140" y="31" text-anchor="middle">A</text><circle class="fgt lg" cx="220" cy="26" r="16"/><text class="tb" x="220" y="31" text-anchor="middle">B</text><path class="ln dash" d="M158 26H202"/><text class="ts" x="180" y="55" text-anchor="middle">A and B go together</text><g transform="translate(6 78)"><circle class="fg2 lg" cx="18" cy="20" r="12"/><text class="tb" x="18" y="24" text-anchor="middle">A</text><circle class="fg2 lg" cx="62" cy="20" r="12"/><text class="tb" x="62" y="24" text-anchor="middle">B</text><path class="lg" d="M31 20L48 20"/><path class="lg" d="M39.9 23.9L48 20L39.9 16.1"/><text class="ts" x="40" y="52" text-anchor="middle">A causes B</text></g><g transform="translate(96 78)"><circle class="fg2 lg" cx="18" cy="20" r="12"/><text class="tb" x="18" y="24" text-anchor="middle">A</text><circle class="fg2 lg" cx="62" cy="20" r="12"/><text class="tb" x="62" y="24" text-anchor="middle">B</text><path class="lg" d="M49 20L32 20"/><path class="lg" d="M40.1 16.1L32 20L40.1 23.9"/><text class="ts" x="40" y="52" text-anchor="middle">B causes A</text></g><g transform="translate(186 70)"><circle class="fgt lg" cx="40" cy="8" r="12"/><text class="tb" x="40" y="12" text-anchor="middle">C</text><circle class="fg2 lg" cx="12" cy="40" r="12"/><text class="tb" x="12" y="44" text-anchor="middle">A</text><circle class="fg2 lg" cx="68" cy="40" r="12"/><text class="tb" x="68" y="44" text-anchor="middle">B</text><path class="lg" d="M34 18L19 31"/><path class="lg" d="M22.6 22.7L19 31L27.7 28.7"/><path class="lg" d="M46 18L61 31"/><path class="lg" d="M52.3 28.7L61 31L57.4 22.7"/><text class="ts" x="40" y="70" text-anchor="middle">C causes both</text></g><g transform="translate(276 78)"><circle class="fg2 lg" cx="14" cy="20" r="12"/><text class="tb" x="14" y="24" text-anchor="middle">A</text><circle class="fg2 lg" cx="58" cy="20" r="12"/><text class="tb" x="58" y="24" text-anchor="middle">B</text><path class="ln dash" d="M27 20H45"/><text class="ts" x="36" y="52" text-anchor="middle">chance</text></g></svg>