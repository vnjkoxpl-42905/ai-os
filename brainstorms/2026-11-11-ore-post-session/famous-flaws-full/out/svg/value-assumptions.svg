<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="value-assumptions-t value-assumptions-d" xmlns="http://www.w3.org/2000/svg"><title id="value-assumptions-t">A fact jumping across a gap to a loaded word</title><desc id="value-assumptions-d">A fact box on the left, a dashed gap in the middle, and a loaded judgment word on the right in a pink box. An arrow jumps over the gap.</desc><rect class="fgt lg" x="14" y="46" width="108" height="54" rx="12"/><text class="ts" x="68" y="68" text-anchor="middle">the fact</text><text class="tb" x="68" y="86" text-anchor="middle">50 mpg</text><path class="ln dash" d="M148 100V50M212 100V50"/><text class="ts" x="180" y="124" text-anchor="middle">gap the premises never cross</text><path class="lg" d="M122 62Q180 14 240 62"/><path class="lg" d="M229 55L240 62L227 67"/><rect class="pinkbox" x="238" y="46" width="108" height="54" rx="12"/><text class="ts" x="292" y="68" text-anchor="middle">the verdict</text><text class="tb" x="292" y="86" text-anchor="middle">&#8220;best&#8221;</text></svg>