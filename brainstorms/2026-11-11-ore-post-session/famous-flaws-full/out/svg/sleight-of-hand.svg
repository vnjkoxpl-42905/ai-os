<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="sleight-of-hand-t sleight-of-hand-d" xmlns="http://www.w3.org/2000/svg"><title id="sleight-of-hand-t">Two different terms treated as the same</title><desc id="sleight-of-hand-d">A box holding the term used in the evidence and a box holding a different term used in the conclusion with a large not-equal sign between them.</desc><rect class="fgt lg" x="18" y="44" width="124" height="56" rx="12"/><text class="ts" x="80" y="66" text-anchor="middle">term in the</text><text class="tb" x="80" y="84" text-anchor="middle">evidence</text><rect class="fgt lg" x="218" y="44" width="124" height="56" rx="12"/><text class="ts" x="280" y="66" text-anchor="middle">new term in the</text><text class="tb" x="280" y="84" text-anchor="middle">conclusion</text><text x="180" y="86" text-anchor="middle" style="font:700 44px var(--serif);fill:var(--strike)">&#8800;</text><text class="ts" x="180" y="128" text-anchor="middle">nothing is basically the same</text></svg>