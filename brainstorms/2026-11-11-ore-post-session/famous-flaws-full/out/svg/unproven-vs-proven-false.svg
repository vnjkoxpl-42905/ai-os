<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="unproven-vs-proven-false-t unproven-vs-proven-false-d" xmlns="http://www.w3.org/2000/svg"><title id="unproven-vs-proven-false-t">A meter from shown false to shown true</title><desc id="unproven-vs-proven-false-d">A horizontal bar has three zones: shown false, nothing shown, and shown true. A pointer sits in the middle zone, nothing shown. A dashed arrow jumping from nothing shown to shown false is crossed out.</desc><rect class="fp" x="20" y="60" width="106" height="30" rx="8" style="fill:var(--strike);opacity:.22"/><rect class="fp" x="126" y="60" width="108" height="30" rx="0" style="fill:var(--ink-mute);opacity:.2"/><rect class="fp" x="234" y="60" width="106" height="30" rx="8" style="fill:var(--g);opacity:.25"/><text class="ts" x="73" y="80" text-anchor="middle">SHOWN FALSE</text><text class="ts" x="180" y="80" text-anchor="middle">NOTHING SHOWN</text><text class="ts" x="287" y="80" text-anchor="middle">SHOWN TRUE</text><path class="lg" d="M180 52V36"/><path class="fg" d="M172 52h16l-8 9z"/><text class="tb" x="180" y="28" text-anchor="middle">no proof either way</text><path class="ln dash" d="M170 106Q122 128 84 106"/><path class="ln" d="M92 100L83 106L94 111"/><path class="lr" d="M118 113L136 131M136 113L118 131"/><text class="ts" x="180" y="144" text-anchor="middle">failing to prove is not proving the opposite</text></svg>