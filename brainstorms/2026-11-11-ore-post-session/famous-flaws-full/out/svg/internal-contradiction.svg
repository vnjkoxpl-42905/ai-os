<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="internal-contradiction-t internal-contradiction-d" xmlns="http://www.w3.org/2000/svg"><title id="internal-contradiction-t">Two claims that cannot both be true</title><desc id="internal-contradiction-d">Two claim boxes side by side joined by a bar with a not equal sign and the words cannot both be true.</desc><rect class="fgt lg" x="20" y="46" width="116" height="52" rx="12"/><text class="tb" x="78" y="69" text-anchor="middle">Claim 1</text><text class="ts" x="78" y="85" text-anchor="middle">the author says</text><rect class="fgt lg" x="224" y="46" width="116" height="52" rx="12"/><text class="tb" x="302" y="69" text-anchor="middle">Claim 2</text><text class="ts" x="302" y="85" text-anchor="middle">also says</text><path class="lr" d="M144 72H216"/><circle class="fp lr" cx="180" cy="72" r="14"/><path class="lr" d="M173 66h14M173 78h14M175 82l10-20"/><text class="ts" x="180" y="118" text-anchor="middle">CANNOT BOTH BE TRUE</text></svg>