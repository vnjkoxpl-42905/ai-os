<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="sleazy-sales-pitch-t sleazy-sales-pitch-d" xmlns="http://www.w3.org/2000/svg"><title id="sleazy-sales-pitch-t">A one-sided comparison</title><desc id="sleazy-sales-pitch-d">A balance scale. The left pan shows the strengths of option A and the right pan shows the weaknesses of option B. Two dashed pans below are hidden: the weaknesses of A and the strengths of B.</desc><path class="ln" d="M180 20V84M120 84h120"/><path class="ln" d="M70 34H290"/><path class="ln" d="M70 34L46 70M70 34L94 70M290 34L266 70M290 34L314 70"/><path class="fgt lg" d="M36 70h68l-8 18H44z"/><path class="fgt lg" d="M256 70h68l-8 18H264z"/><text class="t" x="70" y="112" text-anchor="middle">A: strengths shown</text><text class="t" x="290" y="112" text-anchor="middle">B: weaknesses shown</text><rect class="ln dash" x="26" y="118" width="108" height="24" rx="8"/><text class="ts" x="80" y="134" text-anchor="middle">A's weaknesses ?</text><rect class="ln dash" x="226" y="118" width="108" height="24" rx="8"/><text class="ts" x="280" y="134" text-anchor="middle">B's strengths ?</text></svg>