<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="ad-hominem-t ad-hominem-d" xmlns="http://www.w3.org/2000/svg"><title id="ad-hominem-t">Aim at the claim, not the speaker</title><desc id="ad-hominem-d">A speaker figure on the left and a speech bubble holding the claim on the right. A red arrow hits the speaker, marked wrong target. A green arrow points at the claim, marked right target.</desc><circle class="fgt lg" cx="62" cy="52" r="18"/><path class="fgt lg" d="M30 120a32 30 0 0 1 64 0z"/><text class="ts" x="62" y="140" text-anchor="middle">the speaker</text><rect class="fp ln" x="196" y="30" width="144" height="64" rx="14"/><path class="fp ln" d="M214 94l-8 16 24-16"/><text class="tb" x="268" y="58" text-anchor="middle">the claim</text><text class="ts" x="268" y="74" text-anchor="middle">and its evidence</text><path class="lr" d="M172 40L100 66"/><path class="lr" d="M106.3 59.6L100 66L109.0 66.9"/><text class="ts" x="140" y="30" text-anchor="middle">WRONG TARGET</text><path class="lg" d="M172 112L214 84"/><path class="lg" d="M209.4 91.8L214 84L205.1 85.2"/><text class="ts" x="190" y="132" text-anchor="middle">RIGHT TARGET</text></svg>