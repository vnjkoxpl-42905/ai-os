<svg class="fx-svg" viewBox="0 0 360 160" role="img" aria-labelledby="cake-t cake-d" xmlns="http://www.w3.org/2000/svg"><title id="cake-t">The Cake-on-Blocks model of a valid argument</title><desc id="cake-d">Four premise blocks hold up a plank and the cake of the conclusion sits on the plank. When the Object button is pressed the right-hand blocks slide away, the plank tips and the cake falls.</desc><path class="ln" d="M20 132H340"/><g id="cake-left"><rect class="blk" x="64" y="104" width="44" height="28" rx="3"/><text class="blkt" x="86" y="123" text-anchor="middle">P1</text><rect class="blk" x="68" y="78" width="36" height="26" rx="3"/><text class="blkt" x="86" y="96" text-anchor="middle">P2</text></g><g id="cake-right"><rect class="blk" x="252" y="104" width="44" height="28" rx="3"/><text class="blkt" x="274" y="123" text-anchor="middle">P3</text><rect class="blk" x="256" y="78" width="36" height="26" rx="3"/><text class="blkt" x="274" y="96" text-anchor="middle">P4</text></g><g id="cake-plank"><rect class="plank" x="52" y="68" width="256" height="10" rx="2"/><g id="cake-top"><path class="cakebody" d="M146 68V46q17-8 34 0t34 0V68z"/><rect class="cakeband" x="146" y="54" width="68" height="14"/><rect class="candle" x="178" y="30" width="4" height="12"/><path class="flame" d="M180 24q-3 4 0 7q3-3 0-7z"/><text class="cktext" x="180" y="65" text-anchor="middle">CONCLUSION</text></g></g><text class="ts" x="180" y="148" text-anchor="middle">FLOOR: where an objection lives</text></svg>