<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="necessary-vs-sufficient-t necessary-vs-sufficient-d" xmlns="http://www.w3.org/2000/svg"><title id="necessary-vs-sufficient-t">Enough sits inside required</title><desc id="necessary-vs-sufficient-d">A small oval labelled enough, sufficient, sits inside a larger oval labelled required, necessary. A solid arrow goes from enough to required. A dashed arrow going back is crossed out.</desc><ellipse class="fgt lg" cx="108" cy="82" rx="100" ry="58"/><ellipse class="fg2 lg" cx="84" cy="84" rx="50" ry="34"/><text class="tb" x="84" y="82" text-anchor="middle">Enough</text><text class="ts" x="84" y="97" text-anchor="middle">SUFFICIENT</text><text class="ts" x="108" y="22" text-anchor="middle">REQUIRED = NECESSARY</text><path class="lg" d="M222 62L330 62"/><path class="lg" d="M321.9 65.9L330 62L321.9 58.1"/><text class="t" x="276" y="50" text-anchor="middle">enough, so required</text><path class="ln dash" d="M330 108H232"/><path class="ln" d="M240 101L231 108L240 115"/><path class="lr" d="M272 99L290 117M290 99L272 117"/><text class="t" x="281" y="132" text-anchor="middle">required, so enough?</text><text class="ts" x="281" y="144" text-anchor="middle">does not follow</text></svg>