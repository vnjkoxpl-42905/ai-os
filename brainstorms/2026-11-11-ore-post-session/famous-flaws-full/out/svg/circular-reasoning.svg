<svg class="fx-svg" viewBox="0 0 360 150" role="img" aria-labelledby="circular-reasoning-t circular-reasoning-d" xmlns="http://www.w3.org/2000/svg"><title id="circular-reasoning-t">The conclusion holds up its own premise</title><desc id="circular-reasoning-d">Two boxes, premise and conclusion, joined by two arrows that form a loop: the premise supports the conclusion and the conclusion supports the premise.</desc><rect class="fgt lg" x="30" y="56" width="110" height="38" rx="10"/><text class="tb" x="85" y="79" text-anchor="middle">premise</text><rect class="fgt lg" x="220" y="56" width="110" height="38" rx="10"/><text class="tb" x="275" y="79" text-anchor="middle">conclusion</text><path class="lg" d="M140 66Q180 36 214 62"/><path class="lg" d="M204 54L215 62L203 68"/><path class="lg" d="M220 88Q180 118 146 90"/><path class="lg" d="M157 82L145 89L158 95"/><text class="ts" x="180" y="26" text-anchor="middle">says the same thing twice</text><text class="ts" x="180" y="138" text-anchor="middle">no new support</text></svg>