<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conditional logic · Drill collection</title><style>
:root{--ink:#183340;--muted:#526773;--paper:#f5f2eb;--line:#ccd4cd;--teal:#176454;--gold:#bf704b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}a{color:inherit}button,input,textarea,select{font:inherit}button,a.button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#fffdf7;color:var(--ink);padding:11px 17px;text-decoration:none;display:inline-block}button:hover,a.button:hover{border-color:var(--teal);background:#edf4ed}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #bf704b;outline-offset:4px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.14}h1{font-size:clamp(38px,5vw,64px);margin:18px 0 24px;letter-spacing:-1.5px}h2{font-size:30px;margin:10px 0 20px}h3{font-size:25px;margin:12px 0}.top{background:var(--ink);color:#fff9eb;padding:18px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.top a{text-decoration:none;font-family:Georgia,serif;font-size:23px}.top small{font-size:13px;letter-spacing:1px}.shell{max-width:1230px;margin:auto;padding:48px 36px 80px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--teal)}.intro{display:grid;grid-template-columns:1.5fr 1fr;gap:65px;align-items:center;margin-bottom:40px}.lede{font-size:20px;max-width:720px}.summary{border-left:1px solid var(--line);padding:24px 0 24px 35px}.summary strong{font:50px Georgia,serif}.summary p{margin:12px 0}.notice{color:var(--muted);font-size:15px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:26px 28px;display:block;text-decoration:none;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:var(--teal)}.card:first-child{background:var(--ink);color:#fff9eb;grid-column:1/-1;display:grid;grid-template-columns:110px 1fr;gap:20px}.card:first-child .eyebrow,.card:first-child .cardmeta{color:#c3dacf}.number{font:italic 46px Georgia;color:var(--gold)}.cardmeta{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-top:22px}.bar{height:4px;background:#dfe4dc;border-radius:10px;margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:28px 0}.toolbar label{display:flex;align-items:center;gap:8px;font-size:15px}.drillintro{max-width:900px}.track{display:flex;gap:7px;margin:24px 0}.track a{flex:1;height:8px;background:#d3dbd1;border-radius:5px}.track a.active{background:var(--teal)}.questions{display:grid;gap:18px}.question{background:#fffdf8;border:1px solid var(--line);border-radius:10px;overflow:hidden}.question>summary{padding:25px 28px;cursor:pointer;list-style:none;display:grid;grid-template-columns:44px 1fr 22px;gap:16px;align-items:start}.question>summary::-webkit-details-marker{display:none}.question>summary:after{content:'+';font-size:25px;color:var(--teal)}.question[open]>summary:after{content:'−'}.qnum{font-size:13px;color:var(--teal);padding-top:5px}.stem{font:23px/1.45 Georgia,serif}.workspace{border-top:1px solid var(--line);margin:0 28px;padding:26px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:block;font-size:14px;font-weight:600}.field.wide{grid-column:1/-1}textarea,input[type=text],select{width:100%;margin-top:9px;background:#fffefb;border:1px solid #b8c7bf;border-radius:6px;color:var(--ink);padding:12px;font-size:17px;font-weight:400;resize:vertical}textarea{min-height:90px}.arrowrow{display:grid;grid-template-columns:1fr 45px 1fr;gap:15px;align-items:center}.arrow{font-size:32px;text-align:center;color:var(--teal);padding-top:28px}.optional{margin-top:22px}.optional>summary{cursor:pointer;font-weight:600}.editorial{border-left:3px solid var(--gold);padding:10px 16px;margin:0 0 22px;background:#fff2e6;font-size:15px}.reviewer-note{display:none}.review-on .reviewer-note{display:block}.bottom{display:flex;justify-content:space-between;gap:20px;margin-top:38px}.badge{font-size:12px;border:1px solid currentColor;border-radius:20px;padding:3px 9px}.source{font-size:13px;color:var(--muted);margin-top:22px}footer{border-top:1px solid var(--line);padding-top:22px;margin-top:45px;color:var(--muted);font-size:14px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal)}@media(max-width:700px){.shell{padding:28px 18px 60px}.intro{grid-template-columns:1fr;gap:10px}.summary{border-left:0;border-top:1px solid var(--line);padding:20px 0}.cards{grid-template-columns:1fr}.card:first-child{grid-template-columns:55px 1fr}.card{padding:22px}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.question>summary{padding:20px 16px;grid-template-columns:26px 1fr 14px;gap:8px}.workspace{margin:0 16px}.stem{font-size:21px}.arrowrow{grid-template-columns:1fr}.arrow{padding:0;transform:rotate(90deg)}.top small{display:none}.bottom{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{.top,.toolbar,.bottom,button,.track{display:none}.shell{padding:0}.question{break-inside:avoid}.reviewer-note{display:none!important}}
</style></head><body><header class="top"><a href="#all">Conditional logic</a><small>GROUP 1 & GROUP 2 · WORKSHEET PROTOTYPE</small></header><main class="shell" id="app"></main><script>
const drills=[{"title": "Find the indicator and both conditions", "short": "Intro training", "stage": "Recognize", "source": "Intro training · Part 1", "items": ["A warranty is valid if the product is registered within 30 days.", "Whenever you see lightning, expect thunder to follow.", "The gate opens only if the correct code is entered.", "All managers must undergo annual training.", "The scholarship applies to any student who maintains a 4.0 GPA.", "You can access the VIP area only when your ID is verified.", "Only after the agreement is signed will the project commence.", "Members who pay their dues can attend the meeting.", "If the alarm sounds, the building should be evacuated immediately.", "Passengers must present a ticket to board the train.", "A refund is issued only if the item is returned unopened.", "The team goes to the finals if they win the semifinals.", "Every applicant who passes the test will receive an interview call.", "You must be over 18 to vote in the election.", "If you plant trees, you will support the environment."], "mode": "identify", "instruction": "Read each statement. Write the indicator expression, then identify the complete sufficient and necessary conditions. Keep words that limit who, when, or what the rule covers.", "flags": {"2": "The key strengthens “expect thunder” to “thunder will follow.” Preserve the expectation.", "4": "Preserve the training requirement; a duty does not prove actual compliance.", "5": "Keep “student who maintains a 4.0 GPA.”", "8": "Keep membership and “can attend.”", "9": "“Should be evacuated” is an obligation, not proof of evacuation.", "13": "Keep the applicant restriction."}}, {"title": "Recognize Group 1 and Group 2", "short": "Indicator identification", "stage": "Recognize", "source": "Indicator ID · Part 1", "items": ["Only if employees complete training do they qualify for promotion.", "Any student who misses a lesson receives notes.", "Houseguests can enter the backyard only when the gate is unlocked.", "The only foods that spoil quickly are those without preservatives.", "Servers restart where maintenance is complete.", "Drivers must wear seatbelts to avoid fines.", "Workers evacuate if the alarm sounds.", "Borrowing requires collateral to secure a loan.", "All applications submitted on time will be reviewed.", "Visitors can enter when they show ID.", "Always document errors before troubleshooting.", "The park is accessible only where pathways lead.", "Every author who publishes gains recognition."], "mode": "group", "instruction": "Find the indicator expression in each statement. Identify its group and explain which condition it helps you locate. If you identify more than one expression, label each separately.", "flags": {"4": "The source key conflicts over the classification of “the only.”", "8": "The borrowing/collateral wording needs clarification before grading.", "11": "This is an instruction. Do not treat it as proof of actual compliance."}}, {"title": "Put the conditions beside the arrow", "short": "Intro training revisited", "stage": "Diagram", "source": "Intro training · Part 2", "items": ["A warranty is valid if the product is registered within 30 days.", "Whenever you see lightning, expect thunder to follow.", "The gate opens only if the correct code is entered.", "All managers must undergo annual training.", "The scholarship applies to any student who maintains a 4.0 GPA.", "You can access the VIP area only when your ID is verified.", "Only after the agreement is signed will the project commence.", "Members who pay their dues can attend the meeting.", "If the alarm sounds, the building should be evacuated immediately.", "Passengers must present a ticket to board the train.", "A refund is issued only if the item is returned unopened.", "The team goes to the finals if they win the semifinals.", "Every applicant who passes the test will receive an interview call.", "You must be over 18 to vote in the election.", "If you plant trees, you will support the environment."], "mode": "diagram", "instruction": "Return to the 15 intro statements. Put the sufficient condition on the left and the necessary condition on the right. After learning contraposition, expand the optional second step.", "flags": {"2": "The key strengthens “expect thunder” to “thunder will follow.” Preserve the expectation.", "4": "Preserve the training requirement; a duty does not prove actual compliance.", "5": "Keep “student who maintains a 4.0 GPA.”", "8": "Keep membership and “can attend.”", "9": "“Should be evacuated” is an obligation, not proof of evacuation.", "13": "Keep the applicant restriction."}}, {"title": "Identify each side of the rule", "short": "Diagramming and roles", "stage": "Diagram", "source": "Indicator ID · Part 2", "items": ["Only if employees complete training do they qualify for promotion.", "Any student who misses a lesson receives notes.", "Houseguests can enter the backyard only when the gate is unlocked.", "Drivers must wear seatbelts to avoid fines.", "All applications submitted on time will be reviewed.", "Borrowing requires collateral to secure a loan.", "Workers evacuate if the alarm sounds.", "Visitors can enter when they show ID.", "Every author who publishes gains recognition.", "Always document errors before troubleshooting."], "mode": "roles", "instruction": "Identify the full sufficient condition and the full necessary condition. Write them beside the arrow, even when the sentence gives them in a different order.", "flags": {"6": "The key incorrectly turns a collateral requirement into a guaranteed loan.", "10": "Keep “before” and distinguish an instruction from actual compliance."}}, {"title": "Rewrite the rule as if / then", "short": "Conditional rephrasing", "stage": "Translate", "source": "If-Then rephrase · Questions 1–25", "items": ["All runners must hydrate before a marathon.", "Whenever sunlight hits the solar panels, they generate electricity.", "Only those who conserve water will receive the rebate.", "The only key to unlocking that door is the blue key.", "Success in chess requires strategic thinking.", "Any artist who uses oil paints must clean their brushes thoroughly.", "All successful projects require effective teamwork.", "Only those with a degree in architecture can apply for this position.", "Whenever the sun sets, the streetlights turn on.", "The only path to wisdom is through experience.", "Every agreement must be in writing to be legally binding.", "You achieve your goals only if you remain committed.", "Anyone studying physics will encounter complex mathematical concepts.", "When artists are inspired, they create their most celebrated pieces.", "A plant thrives only when sunlight that reaches its leaves is adequate.", "Only those submissions whose applicant identity has been confirmed by the registrar are reviewed.", "A license is renewed only where a payment record that matches the license identifier exists.", "Certification occurs only when an evaluator whose authorization is currently active signs the form.", "Requests are processed only if the request file that the portal assigns to the requester is present.", "Every device that bears a failed seal requires recalibration.", "If a person’s registration is verified by the registrar, admission is granted.", "The only entries accepted are those the clerk records in the registry.", "Where verification that the training requirement is met appears in the file, access is granted.", "Whenever a complaint that meets the policy threshold is filed with the office, an investigation begins.", "All permits that the agency issues always include an audit trail that matches the transaction record."], "mode": "rephrase", "instruction": "Rewrite each statement as “If …, then …” without changing its meaning. Name the indicators you used. Keep permission, requirements, deadlines, and restrictions in your wording.", "flags": {"1": "Mixed indicators and obligation: do not force one group label.", "4": "“Only key” does not exclude non-key ways of opening the door.", "6": "Mixed indicators and obligation: preserve the duty.", "7": "Allow a separate group label for each indicator.", "8": "Preserve “can apply.”", "11": "Keep the legally-binding restriction; classify each expression separately.", "18": "Keep “currently active”; negate the whole qualified signing condition.", "19": "Keep the file assigned to this requester.", "20": "Allow both indicators; preserve requirement status.", "25": "Keep the matching transaction record and classify expressions separately."}}, {"title": "Translate, contrapose, and read back", "short": "Four ways to express the rule", "stage": "After contraposition", "source": "Indicator ID · Part 3", "items": ["All interns who complete the program are offered full-time positions.", "Your grade will be finalized if you submit your report by Friday.", "Students exit the building when the final bell rings.", "Every participant who finishes the marathon receives a medal.", "Any device left unattended will power down automatically.", "Minutes are recorded whenever the committee meets.", "To qualify for bonuses, employees must exceed sales targets.", "Expenditures can occur only if managers approve budgets first.", "Halting operations temporarily requires system maintenance.", "Access is granted only when user credentials are verified.", "Servers reboot only where network security protocols permit.", "Always conduct security checks before entry.", "Alarms won’t deactivate on their own if the emergency protocol fails to initiate within one minute.", "The cluster performs backups only if it detects low storage for two cycles.", "Reports are published whenever three reviewers call for revision.", "Passengers are allowed to board only when documents are verified by both authorities.", "Any exposure to extreme temperatures compromises sample integrity.", "Reimbursement requests can be processed only if employees submit detailed online reports.", "When safety standards are unmet, inspections occur immediately.", "Critical software patches are always applied before servers restart."], "mode": "full", "instruction": "Write the original arrow, its contrapositive, and both in ordinary if/then language. Negate the whole condition, including any restriction. Complete this set after the contrapositive lesson.", "flags": {"8": "Keep “can occur” and “first.”", "9": "The key changes a requirement into completed maintenance.", "12": "Keep “before”; this instruction needs a compliance-rule frame.", "15": "Negate the whole three-reviewer condition.", "16": "Not both does not mean neither.", "18": "Keep “can be processed.”"}}, {"title": "Practice independent translation", "short": "The complete translation set", "stage": "After contraposition", "source": "Translation set (burrito) · Statements 1–35", "items": ["Your burrito will thaw if you leave it on the counter.", "Each and every member of the Q continuum is omnipotent.", "You will run like Tash... Narrado if there is a bear behind you.", "Your disposable income will increase whenever you reduce your expenses.", "If you study, you will beat the LSAT.", "Where there's beer, there's fun.", "The sun will rise, if you pay your taxes.", "Whenever it rains, it pours.", "All the King's men swore an oath of allegiance.", "The only monkeys are the ones that live in trees.", "You will become a magician if you drink coffee.", "Every lawyer can read.", "Any computer can do addition.", "All beavers love to eat maple trees.", "We must eat to live.", "Only a GPS will reveal where you are.", "A good party requires alcohol.", "Expertise requires practice.", "Only fish swim.", "It's always sunny in Philadelphia.", "Food is in the fridge only when Rufus is not around.", "Only the good die young.", "I would not be able to see Arun if he were in the next room.", "Amar would not want to learn to ski if he were over 40.", "When things cost more, people buy and use less of them.", "Where the judges are independent there will be a good legal system.", "All trees are perennial plants with an elongated stem.", "Cyrenaic hedonism believes pleasure is the only good.", "Every mating ritual can be conceptualized as a game to illuminate the underlying strategies.", "All Martian gullies are poleward of 30° latitude.", "When a mix of fresh and dried grass clippings is mixed into garden soil, plant soil decreases.", "When the sky is clear, the atmospheric pressure is high.", "The body of anyone infected by virus X will, after a week, produce antibodies to fight the virus.", "Economic conditions improved only when the policy of free trade had been implemented.", "Where a moral duty exists, it supersedes any legal duty and any other kind of duty."], "mode": "translation", "instruction": "Treat each statement as the supplied rule. Diagram its conditional relationship, then write its contrapositive. Keep every qualifier and define any abbreviation you use. Later items include negative and compound conditions.", "flags": {"3": "Named comparison is unclear in the source.", "10": "The key explanation conflicts with its correctly directed arrow.", "20": "The key incorrectly uses “Always” as a condition. This needs an explicit domain.", "25": "Negate the whole conjunction: not both does not mean neither.", "27": "Keep the whole compound condition.", "28": "The key misses the exclusivity direction. Adjudicate the natural-language claim.", "29": "Preserve “can be conceptualized.”", "31": "“Plant soil decreases” is unclear. Preserve this source for review; do not grade it.", "33": "The key misidentifies “will” and drops the timing.", "35": "Negate the whole qualified duty claim."}}];
const app=document.getElementById('app');let saved={},saveAvailable=true,review=false;
try{saved=JSON.parse(localStorage.getItem('conditional-drill-prototype-v1')||'{}')}catch(e){saveAvailable=false}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const done=(i)=>drills[i].items.filter((s,j)=>Object.keys(saved).some(k=>k.startsWith(i+'-'+j+'-')&&String(saved[k]).trim())).length;
function field(i,j,key,label,wide=false){const id=i+'-'+j+'-'+key;return `<label class="field ${wide?'wide':''}" for="${id}">${label}<textarea id="${id}" data-key="${id}" rows="2">${esc(saved[id]||'')}</textarea></label>`}
function diagram(i,j,prefix=''){return `<div class="arrowrow">${field(i,j,prefix+'left','Left · Sufficient condition')}<span class="arrow" aria-hidden="true">→</span>${field(i,j,prefix+'right','Right · Necessary condition')}</div>`}
function work(d,i,j){let content='';if(d.mode==='identify'){content=`<div class="fields">${field(i,j,'indicator','Indicator expression',true)}${field(i,j,'sufficient','Complete sufficient condition')}${field(i,j,'necessary','Complete necessary condition')}</div>`}else if(d.mode==='group'){content=`<div class="fields">${field(i,j,'indicator','Indicator expression')}${field(i,j,'group','Group and condition it identifies')}</div>`}else if(d.mode==='diagram'||d.mode==='roles'){content=diagram(i,j);if(d.mode==='diagram')content+=`<details class="optional"><summary>After contraposition: write the contrapositive</summary>${field(i,j,'contra','Contrapositive',true)}</details>`}else if(d.mode==='rephrase'){content=`<div class="fields">${field(i,j,'ifthen','If …, then …',true)}${field(i,j,'indicator','Indicator expression(s)')}${field(i,j,'groups','Group for each expression')}</div><details class="optional"><summary>After contraposition: rewrite the contrapositive</summary>${field(i,j,'contra','Contrapositive in ordinary language',true)}</details>`}else if(d.mode==='full'){content=`<div class="fields">${field(i,j,'original','Original diagram')}${field(i,j,'contra','Contrapositive diagram')}${field(i,j,'ifthen','Original in if/then form')}${field(i,j,'contrawords','Contrapositive in if/then form')}</div>`}else content=`<div class="fields">${field(i,j,'original','Conditional relationship')}${field(i,j,'contra','Contrapositive')}</div>`;return content}
function render(){let match=location.hash.match(/^#drill-(\d+)$/),i=match?Number(match[1])-1:-1;if(i<0||i>=drills.length){app.innerHTML=`<section class="intro"><div><span class="eyebrow">A progression to review together</span><h1>Seven drills.<br>One connected path.</h1><p class="lede">Start with the intro training. Find the conditions, place them beside the arrow, then translate the whole rule.</p></div><aside class="summary"><strong>133</strong><p>worksheet tasks across seven separate drill pages.</p><p class="notice">All original statements are included. Some return for a new task. This is a writing prototype, not an automatically graded quiz.</p></aside></section><div class="cards">${drills.map((d,n)=>`<a class="card" href="#drill-${n+1}"><div class="number">${String(n+1).padStart(2,'0')}</div><div><span class="eyebrow">${esc(d.stage)} · Drill ${n+1}</span><h2>${esc(d.title)}</h2><p>${esc(d.short)}</p><div class="cardmeta"><span>${d.items.length} questions · ${done(n)} started</span><span>Open drill →</span></div><div class="bar"><i style="width:${done(n)/d.items.length*100}%"></i></div></div></a>`).join('')}</div><footer>Original statements from your Group 1 and 2 teaching materials. The sequence and response spaces are adapted for review. Answer keys have not been imported because the source audit identified corrections.<br><span id="save-status">${saveAvailable?'Responses stay in this browser on this device.':'Browser saving is unavailable; responses last for this open page.'}</span></footer>`;return}let d=drills[i];app.innerHTML=`<a class="button" href="#all">← All seven drills</a><div class="track" aria-label="Drill sequence">${drills.map((x,n)=>`<a href="#drill-${n+1}" class="${i===n?'active':''}" aria-label="Drill ${n+1}: ${esc(x.title)}" ${i===n?'aria-current="page"':''}></a>`).join('')}</div><section class="drillintro"><span class="eyebrow">Drill ${i+1} / 7 · ${esc(d.stage)}</span><h1>${esc(d.title)}</h1><p class="lede">${esc(d.instruction)}</p></section><div class="toolbar"><span id="progress">${done(i)} of ${d.items.length} responses started</span><div><button id="expand">Open all questions</button> <button id="collapse">Close all questions</button></div><label><input id="review" type="checkbox" ${review?'checked':''}> Source review notes</label></div><div class="questions ${review?'review-on':''}">${d.items.map((s,j)=>`<details class="question" ${j===0?'open':''}><summary><span class="qnum">${String(j+1).padStart(2,'0')}</span><span class="stem">${esc(s)}</span></summary><div class="workspace">${d.flags[j+1]?`<aside class="editorial reviewer-note"><strong>Source review · Item ${j+1}</strong><br>${esc(d.flags[j+1])}</aside>`:''}${work(d,i,j)}<p class="source">${esc(d.source)} · Original item ${j+1}</p></div></details>`).join('')}</div><nav class="bottom" aria-label="Between drills">${i>0?`<a class="button" href="#drill-${i}">← Drill ${i}</a>`:'<a class="button" href="#all">All drills</a>'}${i<6?`<a class="button" href="#drill-${i+2}">Drill ${i+2} →</a>`:'<a class="button" href="#all">Back to the collection →</a>'}</nav><footer>Draft responses, not graded. Source wording is preserved for comparison. Open “Source review notes” to see items needing correction before student use.<br><span id="save-status">${saveAvailable?'Responses stay in this browser on this device.':'Browser saving is unavailable; responses last for this open page.'}</span></footer>`;document.getElementById('expand').onclick=()=>document.querySelectorAll('.question').forEach(q=>q.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('.question').forEach(q=>q.open=false);document.getElementById('review').onchange=e=>{review=e.target.checked;document.querySelector('.questions').classList.toggle('review-on',review)};app.querySelectorAll('textarea').forEach(el=>el.addEventListener('input',()=>{saved[el.dataset.key]=el.value;try{localStorage.setItem('conditional-drill-prototype-v1',JSON.stringify(saved))}catch(e){saveAvailable=false;document.getElementById('save-status').textContent='Browser saving is unavailable; responses last for this open page.'}document.getElementById('progress').textContent=done(i)+' of '+d.items.length+' responses started'}))}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
