  &lt;style&gt;.classroom-root {
  --classroom-line: #f3e3d6;
  /* The boundary of a control, not of a surface. --classroom-line is a hairline

  --classroom-line-strong: #9c8f85;
  /* --classroom-line-strong is measured against the page and the panel. A control
     that sits on a tinted ground instead (the toggle knob, on --classroom-hover)
     reads under 3:1 there, so it takes this one. Same role, darker ground. */
  --classroom-line-on-tint: #8a7d72;
  /* The switch&#x27;s on-track. Light is --classroom-active unchanged; dark is a
     lighter sibling of it, because --classroom-active over the dark panel left
     off-vs-on at 1.51:1 and knob position was carrying the state alone. Scoped
     to the switch so the other 17 --classroom-active rules keep their colour. */
  --classroom-toggle-on-track: #43403c;
  --classroom-ink: #43403c;
  --classroom-ink-body: #43403c;
  --classroom-meta: 166, 162, 158;
  --classroom-hover: rgba(246, 235, 225, 0.4);
  --classroom-dash: rgba(0, 0, 0, 0.15);
  --classroom-link: #ff8906;
  /* Text-safe pair. --classroom-link and --classroom-meta are tuned for fills,
     rules and decorative use, where WCAG 1.4.11&#x27;s 3:1 does not apply. Against
     white they measure 2.38:1 and 2.54:1, so they fail 1.4.3 as TEXT.
     Use these two instead whenever the colour carries words or notation.
     Same hue (32deg / 30deg), darkened only in value: 5.39:1 and 5.38:1 on
     white, and &gt;=4.5:1 on every 10% tint used in the classroom. */
  --classroom-link-text: #a25704;
  --classroom-meta-text: #6d6a67;
  /* The unread badge carries a number, so it is text and owes 4.5:1. The
     orange that works as a fill does not survive white on top of it: white on
     --classroom-link measures 2.38:1. Each theme therefore picks the pairing
     its own ground allows rather than sharing one. Light darkens the fill and
     keeps white on it (5.39:1); dark keeps the bright fill and puts the page&#x27;s
     near-black on it (8.06:1). */
  --classroom-accent: #a25704;
  --classroom-accent-ink: #ffffff;
  /* Kept as aliases so the badge rule reads in its own terms. */
  --classroom-badge-fill: var(--classroom-accent);

  /* The panel/card ground, so a token that names a surface actually resolves. */
  --classroom-surface: #ffffff;
  --classroom-active: #43403c;

  --classroom-transition: 300ms;
  align-items: flex-start;

.classroom-root *,

/* Split for the same reason the colour reset below is written with :where().
   `font: inherit` at (0,1,1) outranks every Tailwind font utility (0,1,0), so
   a button carrying `text-[13px] font-black` inside this frame rendered at the
   inherited 16px/500 instead — which is what the Messages stage is full of.
   Family and style stay at reset strength (that is the part a reset is for:
   form controls otherwise default to Arial); the metrics a component may
   legitimately state for itself drop to (0,0,1), so a bare control still
   inherits and a stated size, weight, or leading now wins. */
.classroom-root button,
.classroom-root input,
.classroom-root textarea {
  font-family: inherit;
  font-style: inherit;
  font-variant: inherit;
}

:where(.classroom-root) :is(button, input, textarea) {
  font-size: inherit;
  font-weight: inherit;
  line-height: inherit;
}

/* A reset, so it must carry a reset&#x27;s specificity. Written plainly as
   `.classroom-root button` it scores (0,1,1) and outranks every Tailwind text
   utility (0,1,0), which silently swallowed the colour of any button that set
   its own: `text-white` on the hero&#x27;s PrepTest trigger rendered near-black on
   the near-black console (~1:1 contrast), and `text-primary-foreground` on the
   launchers&#x27; filled CTAs rendered white on white. `:where()` contributes zero
   specificity, dropping this to (0,0,1): bare buttons still inherit, and any
   button that states a colour now keeps it. */
:where(.classroom-root) button {
  color: inherit;
}

}

.classroom-root .classroom-panel-item-active time {

}

.classroom-root .classroom-panel-item-active time {

}

.classroom-root .classroom-list-state {

}

.classroom-root .classroom-list-state span,
.classroom-root .classroom-skeleton {

  display: block;

.classroom-root .classroom-list-state span:nth-child(2) {

}

.classroom-root .classroom-list-state span:nth-child(3) {

.classroom-root .classroom-list-error {

.classroom-root .classroom-stage {

  display: flex;
  flex: 1 1 auto;
  justify-content: center;
  min-width: 0;
  min-height: 100dvh;
  padding: 0 24px;
}

.classroom-root .classroom-column {
  max-width: 720px;
  padding: 80px 0 120px;
  width: 100%;
}

/* Schedule is an operational workspace, not a reading surface. Its calendar
   needs enough room for seven honest columns plus a selected-day agenda. */
.classroom-root.classroom-root-schedule .classroom-column {
  max-width: 1240px;
  padding: 48px 0 96px;
}

/* Reserves the stage while a code-split route resolves, so the rail never sits
   beside a collapsed column. See StageFallback in ClassroomLayout.tsx. */
.classroom-root .classroom-stage-pending {
  min-height: 100dvh;
  width: 100%;
}

/* Route changes move the stage&#x27;s geometry: Home is a 1260px dashboard with no
   stage padding, Drill is full-bleed at 8px, everything else is a 720px reading
   column. Untransitioned, that swap lands as a jump the moment the new route
   paints. --classroom-transition is the same 300ms the rail and panel wash
   already use, so this reads as one motion rather than a new one. */
@media (prefers-reduced-motion: no-preference) {
  .classroom-root .classroom-stage {
    transition:
      background var(--classroom-transition) ease,
      padding var(--classroom-transition) ease;
  }

  .classroom-root .classroom-column {
    transition:
      max-width var(--classroom-transition) ease,
      padding var(--classroom-transition) ease;
  }

  /* Content arrives on top of that geometry settling. A short opacity/transform
     lift (compositor-only, no layout) turns the pop into a crossfade. 160ms
     matches the observatory&#x27;s own --observatory-motion. */
  .classroom-root .classroom-stage &gt; .classroom-column &gt; *,
  .classroom-root .classroom-messages-stage &gt; *,
  .classroom-root .classroom-workspace-stage &gt; * {
    animation: classroom-stage-enter 160ms cubic-bezier(0.25, 1, 0.5, 1) both;
  }
}

@keyframes classroom-stage-enter {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* Home is the student dashboard: a full-width grid rather than a reading
   column, and the rail&#x27;s warm paper carried across the whole page instead of
   stopping at the rail&#x27;s own edge. */
.classroom-root.classroom-root-home .classroom-stage {
  background: linear-gradient(180deg, #fffdfb, #fbf6f0);
  justify-content: flex-start;
  padding: 0;
}

html.dark .classroom-root.classroom-root-home .classroom-stage {
  background: linear-gradient(180deg, #131219, #0f0e17);
}

.classroom-root.classroom-root-home .classroom-column {
  max-width: 1260px;
  padding: 30px 44px 56px;
}

@media (max-width: 720px) {
  .classroom-root.classroom-root-home .classroom-column {
    padding: 24px 18px 48px;
  }
}

.classroom-root.classroom-root-drill .classroom-stage {
  background: var(--classroom-drill-page);
  padding: 8px 8px 8px 0;
}

.classroom-root.classroom-root-drill .classroom-column {
  max-width: none;
  padding: 8px;
}

/* Drill landing workspace: The Reasoning Observatory.
   Scoped here so the official /drill question surface cannot inherit it.

   2026-08-01 reskin (&quot;hyper-real imagery&quot;): the page is now ivory-on-black with
   two photographic surfaces (a planet horizon behind the hero, an eclipse behind
   Today) doing all the accent work. There is no accent colour on this page — no
   blue, no amber, no gold. Every grid texture, radial wash and gradient tone map
   the old observatory carried has been removed; what is left is flat tinted
   black, hairline rings, glass, and the two images. */
/* .rc-page is the Reading Comprehension hub, which is its own route rather than
   a classroom stage but belongs to the same visual system. It hosts the ladder
   here rather than restating the values, so there is still one source. */
.classroom-root.classroom-root-drill,
.rc-page {
  /* Ink. One ivory, stepped by opacity. The ladder is closed — if a value is not
     on it, it does not belong on this page. */
  --observatory-ink: #f4f1ea;
  --observatory-ink-90: rgba(244, 241, 234, 0.9);
  --observatory-ink-85: rgba(244, 241, 234, 0.85);
  --observatory-ink-70: rgba(244, 241, 234, 0.7);
  --observatory-ink-62: rgba(244, 241, 234, 0.62);
  --observatory-ink-60: rgba(244, 241, 234, 0.6);
  --observatory-ink-55: rgba(244, 241, 234, 0.55);
  --observatory-ink-50: rgba(244, 241, 234, 0.5);

  /* Surfaces. Tinted blacks, never #000. */
  --observatory-surface-card: #08080b;
  --observatory-surface-image: #050507;
  --observatory-glass: rgba(6, 6, 9, 0.55);
  --observatory-glass-soft: rgba(6, 6, 9, 0.5);
  --observatory-glass-row: rgba(6, 6, 9, 0.45);
  --observatory-well: rgba(0, 0, 0, 0.35);

  /* Rings and hairlines. The only borders on this page. */
  --observatory-hairline: rgba(244, 241, 234, 0.09);
  --observatory-ring: rgba(244, 241, 234, 0.1);
  --observatory-ring-glass: rgba(244, 241, 234, 0.12);
  --observatory-ring-quiet: rgba(244, 241, 234, 0.08);
  --observatory-ring-strong: rgba(244, 241, 234, 0.2);
  --observatory-ring-chip: rgba(244, 241, 234, 0.25);

  --observatory-shadow-card: 0 12px 32px rgba(0, 0, 0, 0.12);
  --observatory-shadow-image: 0 12px 32px rgba(0, 0, 0, 0.16);
  --observatory-shadow-glass: 0 10px 28px rgba(0, 0, 0, 0.22);

  /* Kept for the side rail, which is out of this redesign&#x27;s scope and still
     draws its active dot from them. Nothing in the main column uses them. */
  --observatory-field: #eceae4;
  --observatory-shell: #08080b;
  --observatory-light-ink: #f4f1ea;
  --observatory-muted: rgba(244, 241, 234, 0.55);
  --observatory-line: rgba(244, 241, 234, 0.09);
  --observatory-blue: #79c4ff;
  --observatory-amber: #ff8a3d;

  /* Spacing ladder. Every padding, margin and gap in the observatory resolves to
     one of these. Before it there were sixteen distinct values — 7, 10, 13, 14,
     18, 22, 28, 58px and more — which is not a system, it&#x27;s an accumulation. */
  --observatory-space-1: 4px;
  --observatory-space-2: 8px;
  --observatory-space-3: 12px;
  --observatory-space-4: 16px;
  --observatory-space-5: 20px;
  --observatory-space-6: 28px;
  --observatory-space-7: 30px;

  /* Four radii, by role: a card, a panel sitting on a card, an inner block, a
     control. Pills and circles are categorical, not scale values. */
  --observatory-radius-shell: 20px;
  --observatory-radius-panel: 18px;
  --observatory-radius-inner: 16px;
  --observatory-radius-control: 14px;

  --observatory-text-label: 11px;
  --observatory-text-label-sm: 10px;
  --observatory-text-meta: 12px;
  --observatory-text-body: 13.5px;
  --observatory-text-control: 15px;
  --observatory-text-heading: 20px;
  --observatory-text-display: 44px;

  --observatory-track-label: 0.18em;
  --observatory-track-route: 0.16em;
  --observatory-track-chip: 0.14em;
  --observatory-track-display: -0.01em;

  --observatory-label-font: &quot;JetBrains Mono&quot;, ui-monospace, monospace;
  --observatory-display-font: &quot;Fraunces&quot;, ui-serif, Georgia, serif;

  /* Motion: 150-180ms, ease-out, transform and opacity only.

     Ease-out, not the standard ease-in-out. A curve that eases in spends its
     opening barely moving, which is right for something leaving the screen and
     wrong for a control answering a pointer. Measured on the two curves: at
     10% of the duration the old cubic-bezier(0.4, 0, 0.2, 1) has covered 2.6%
     of the distance and at 25% only 23.7%, so on a 160ms hover nothing visible
     happens for the first 40ms and the control reads as slow. The quart curve
     covers 34.7% and 68.9% at those points: it leaves immediately and settles.
     No bounce or elastic anywhere on this surface. */
  --observatory-ease: cubic-bezier(0.25, 1, 0.5, 1);
  --observatory-motion: 160ms var(--observatory-ease);

  /* The stage the cards sit on is cream. The two controls that ride on it
     directly (the section switch, the jump row) are inked for the stage, not
     for the cards. Measured on #fbf8f3: ink 12.9:1, muted 5.3:1. */
  --observatory-stage-well: #fbf8f3;
  --observatory-stage-ink: #332f2c;
  --observatory-stage-muted: #6b6662;
  --observatory-stage-hair: rgba(68, 64, 61, 0.09);
  --observatory-stage-lit: #f5f1ec;

  /* One focus treatment for every control on the black cards: a solid ivory
     outline offset from the edge, 15:1 against the card. Inset variant for
     full-bleed rows whose outline would be clipped by their container. */
  --observatory-focus: rgba(244, 241, 234, 0.85);
  --observatory-skeleton: rgba(244, 241, 234, 0.12);
}

.classroom-root.classroom-root-drill .classroom-stage {
  padding: 24px 24px 32px 16px;
}

.classroom-root.classroom-root-drill .classroom-column {
  padding: 0;
}

.classroom-root.classroom-root-drill .classroom-sidebar-card {
  background:
    radial-gradient(circle at 100% 0%, rgba(255, 138, 61, 0.045), transparent 32%),
    var(--classroom-panel);
}

.classroom-root.classroom-root-drill .classroom-nav-active {
  position: relative;
}

.classroom-root.classroom-root-drill .classroom-nav-active::after {
  background: linear-gradient(180deg, var(--observatory-amber), var(--observatory-blue));
  border-radius: 999px;
  box-shadow: 0 0 12px rgba(121, 196, 255, 0.35);
  content: &quot;&quot;;
  height: 6px;
  margin-left: auto;
  width: 6px;
}

.drill-observatory-root {
  color: var(--observatory-ink);
  font-family: &quot;Outfit&quot;, ui-sans-serif, system-ui, sans-serif;
}

.drill-observatory-root .drill-observatory-canvas {
  isolation: isolate;
}

/* ── Shared micro-typography ─────────────────────────────────────────────── */

/* Tailwind&#x27;s `font-mono` stack does not include the label face, so anything
   using it landed on ui-monospace — a different face from the labels beside it.
   The Today panel&#x27;s date sat directly next to &quot;TODAY&quot; in two different monos. */
.drill-observatory-root .font-mono {
  font-family: var(--observatory-label-font);
}

/* One treatment for every uppercase micro-label in the observatory. Applied via
   an explicit class rather than a blanket `.uppercase` selector — the
   observatory hosts launcher stages whose labels are not part of this set. */
.drill-observatory-root .drill-observatory-label {
  color: var(--observatory-ink-50);
  font-family: var(--observatory-label-font);
  font-size: var(--observatory-text-label);
  font-weight: 500;
  letter-spacing: var(--observatory-track-label);
  text-transform: uppercase;
}

/* The dateline prints twice and CSS picks one, so the first paint is already
   right. Between 900 and 1099 the greeting column is too narrow for the long
   month and the date wrapped to two lines. */
.drill-observatory-root .drill-observatory-date-short {
  display: none;
}

@media (min-width: 900px) and (max-width: 1099px) {
  .drill-observatory-root .drill-observatory-date-long {
    display: none;
  }

  /* The short month alone was not enough: at 1024 the greeting column is 201px
     and the short dateline measured 197px of glyphs plus 47px of tracking, so
     &quot;2026&quot; still fell to a second line. The tracking is decoration at this
     size, and tightening it buys back 25px. Declared on the span itself: a
     value set on the element beats one inherited from the label, so this wins
     the cascade without any forcing of its own. */
  .drill-observatory-root .drill-observatory-date-short {
    display: inline;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }
}

.drill-observatory-root .drill-observatory-label-sm {
  font-size: var(--observatory-text-label-sm);
}

/* The ink ladder, addressable from JSX. Tailwind arbitrary values would work but
   would scatter rgba(244,241,234,x) literals across three components and detach
   them from the token block above; these keep one source for the scale. */
.drill-observatory-root .drill-observatory-ink-full { color: var(--observatory-ink); }
.drill-observatory-root .drill-observatory-ink-90 { color: var(--observatory-ink-90); }
.drill-observatory-root .drill-observatory-ink-85 { color: var(--observatory-ink-85); }
.drill-observatory-root .drill-observatory-ink-70 { color: var(--observatory-ink-70); }
.drill-observatory-root .drill-observatory-ink-62 { color: var(--observatory-ink-62); }
.drill-observatory-root .drill-observatory-ink-60 { color: var(--observatory-ink-60); }
.drill-observatory-root .drill-observatory-ink-55 { color: var(--observatory-ink-55); }
.drill-observatory-root .drill-observatory-ink-50 { color: var(--observatory-ink-50); }

/* ── Hero ────────────────────────────────────────────────────────────────── */

.drill-observatory-root .drill-observatory-hero {
  background-color: var(--observatory-surface-image);
  background-image: url(&quot;/mainhub/hub-horizon.png&quot;);
  /* WebP is 37KB against the PNG&#x27;s 384KB; the PNG line above stays as the
     fallback for anything that cannot parse image-set. */
  background-image: image-set(
    url(&quot;/mainhub/hub-horizon.webp&quot;) type(&quot;image/webp&quot;),
    url(&quot;/mainhub/hub-horizon.png&quot;) type(&quot;image/png&quot;)
  );
  background-position: center 68%;
  background-repeat: no-repeat;
  background-size: cover;
  border: 0;
  border-radius: var(--observatory-radius-shell);
  box-shadow:
    0 0 0 1px var(--observatory-ring),
    var(--observatory-shadow-image);
  color: var(--observatory-ink);
  min-height: 0;
  overflow: hidden;
  position: relative;
}

/* Scrim. Mandatory, not decorative: the greeting sits over the image&#x27;s bright
   terminator at some crops and is unreadable without it.

   The middle stop was 0.35, and that was measured by eye. Sampling the actual
   webp under each hero text box and compositing scrim, photo and the text&#x27;s own
   alpha, the horizon crop reaches rgb(250, 240, 228): the quiet link came out
   at 1.89:1 and the Next up facts line at 2.76:1, both needing 4.5. The
   contrast scan could not see it, because it reads the scrim&#x27;s declared colour
   rather than the photograph underneath. 0.58 is the measured floor that
   clears every hero line once the text below is full ivory; the gradient still
   opens the middle, so the horizon reads. */
.drill-observatory-root .drill-observatory-hero::before {
  background:
    linear-gradient(
      90deg,
      rgba(4, 4, 6, 0.82) 0%,
      rgba(4, 4, 6, 0.58) 45%,
      rgba(4, 4, 6, 0.7) 100%
    ),
    linear-gradient(
      180deg,
      rgba(4, 4, 6, 0.5),
      transparent 30%,
      transparent 70%,
      rgba(4, 4, 6, 0.55)
    );
  content: &quot;&quot;;
  inset: 0;
  pointer-events: none;
  position: absolute;
  z-index: 0;
}

/* The ink ladder does not hold over a photograph. Its steps were measured
   against the flat card (#08080b), where ink-60 is comfortably legible; over
   the horizon crop the same step composites to 2.76:1. Inside the hero&#x27;s
   greeting column, and only there, text that carries meaning is full ivory and
   the scrim above does the rest. The ladder is untouched everywhere else.

   This names the column, not the lines in it. The first pass listed four
   selectors, which covered the four lines that happened to be on screen while
   it was written and left the rest of the column on the ladder: the assigned
   hint, the two paragraphs the failed and empty heroes render, and the
   explainer. Sampling hub-horizon.webp under the hint&#x27;s own box with both
   scrim stops composited, it reads 3.24:1 at 375, 2.86:1 at 390 and 3.98:1 at
   768, each needing 4.5. It passes only from 1024 up, because `cover` at
   50% 78% drags the bright horizon into the column as the hero narrows — one
   crop never speaks for the others, which is why this is measured at all six
   widths. Full ivory clears every one, worst case 4.90:1 at 390.

   The whole ladder is listed, not just the two steps in use, so a later step
   added to this column cannot reintroduce the same failure. The date spans and
   the Next up label are covered by ink-60 on their own paragraphs and no longer
   need naming. The console card beside this column keeps the ladder: it carries
   its own 0.55 panel and its body text measures 8.81:1 over the same photo. */
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-90,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-85,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-70,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-62,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-60,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-55,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-ink-50,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-explainer summary,
.drill-observatory-root .drill-observatory-hero .drill-observatory-greeting .drill-observatory-explainer p,
.drill-observatory-root .drill-observatory-hero .drill-observatory-quiet-link {
  color: var(--observatory-ink);
}

/* The one explainer on the hub. A disclosure, not a tooltip and not a help
   page: the student who needs it is the one with nothing assigned, and she is
   already reading this column. Closed it costs one quiet line. */
.drill-observatory-root .drill-observatory-explainer {
  margin-top: var(--observatory-space-3);
}

.drill-observatory-root .drill-observatory-explainer summary {
  align-items: center;
  color: var(--observatory-ink-70);
  cursor: pointer;
  display: flex;
  font-size: var(--observatory-text-body);
  font-weight: 500;
  list-style: none;
  min-height: 44px;
  text-decoration: underline;
  text-decoration-color: rgba(244, 241, 234, 0.55);
  text-underline-offset: 4px;
  transition: color var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-explainer summary::-webkit-details-marker {
  display: none;
}

/* The summary sits in the greeting column, where the rule above holds every
   line at full ivory, so hover can no longer say anything in colour. It says it
   in the underline instead: the rule is the affordance, and a dead hover rule
   would just look like one that still worked. */
.drill-observatory-root .drill-observatory-explainer summary:hover {
  text-decoration-color: var(--observatory-ink);
}

.drill-observatory-root .drill-observatory-explainer summary:focus-visible {
  border-radius: 999px;
  outline: 2px solid var(--observatory-focus);
  outline-offset: 3px;
}

.drill-observatory-root .drill-observatory-explainer p {
  color: var(--observatory-ink-70);
  font-size: var(--observatory-text-body);
  line-height: 1.55;
  margin-top: var(--observatory-space-1);
  max-width: 46ch;
}

/* The Question jump&#x27;s band on the Drill landing workspace. Full width, matching
   Classroom Home: three dropdowns right-aligned against the canvas edge left a
   ragged gutter beside the hero&#x27;s left column, and the row is navigation for
   the whole surface rather than a control belonging to its right side. The
   canvas gap supplies the spacing below it, so this row contributes nothing but
   its own height. */
/* The tools row carries two controls now: QuestionJump on the left, the
   LR/RC section switch hard right. It was `display: block` while it held only
   the one. */
.drill-observatory-root .drill-observatory-tools {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  margin-bottom: -4px;
}

/* The address row takes the space that is left; the search trigger and the
   switch keep their intrinsic width and stay together on one line, wrapping as
   a pair rather than one above the other. */
.drill-observatory-root .drill-observatory-tools &gt; .qj {
  flex: 1 1 320px;
  width: auto;
}

.drill-observatory-root .drill-observatory-tools-aside {
  align-items: center;
  display: flex;
  flex: 0 0 auto;
  gap: 12px;
  margin-left: auto;
}

.drill-observatory-root .drill-observatory-tools-aside .drill-observatory-section-toggle {
  margin-left: 0;
}

/* ── Section switch (LR | RC) ────────────────────────────────────────────── */

/* Note the surface it sits on: the observatory is dark CARDS on a light cream
   stage, and the tools row is on the stage, not on a card. So the switch is
   inked dark-on-light and takes its values from the Question finder beside it
   (questionJump.css light tone) — the two are one utility strip and must not
   read as two different systems. An ivory-on-ivory switch, which the first
   pass shipped, was invisible here. */
.drill-observatory-root .drill-observatory-section-toggle {
  align-items: center;
  background: var(--observatory-stage-well);
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--observatory-stage-hair);
  display: inline-flex;
  flex: 0 0 auto;
  gap: 2px;
  margin-left: auto;
  padding: 0 2px;
}

.drill-observatory-root .drill-observatory-section-toggle-option {
  background: none;
  border: 0;
  border-radius: 999px;
  color: var(--observatory-stage-muted);
  cursor: pointer;
  font-family: var(--observatory-label-font);
  font-size: var(--observatory-text-label);
  font-weight: 600;
  letter-spacing: var(--observatory-track-route);
  line-height: 1;
  /* 44px by height: the product&#x27;s touch floor, met by the control itself. */
  min-height: 44px;
  padding: 0 16px;
  position: relative;
  transition: color 200ms cubic-bezier(0.22, 0.68, 0.24, 1);
}

.drill-observatory-root .drill-observatory-section-toggle-option:hover {
  color: var(--observatory-stage-ink);
}

.drill-observatory-root .drill-observatory-section-toggle-option.is-active {
  color: var(--observatory-stage-lit);
}

.drill-observatory-root .drill-observatory-section-toggle-option:focus-visible {
  outline: 2px solid var(--observatory-stage-ink);
  outline-offset: 2px;
}

/* The travelling lit slot. Sits behind the label — the label carries
   `position: relative` and a z-index of its own so it is never covered. */
.drill-observatory-root .drill-observatory-section-toggle-indicator {
  background: var(--observatory-stage-ink);
  border-radius: 999px;
  inset: 4px 0;
  position: absolute;
  z-index: 0;
}

@media (max-width: 719px) {
  /* Narrow: the switch drops under QuestionJump at full width rather than
     shrinking into two unreadable slots. It is never hidden — unlike the route
     label&#x27;s trailing span, which is decoration. */
  .drill-observatory-root .drill-observatory-section-toggle {
    justify-content: center;
    margin-left: 0;
    width: 100%;
  }

  /* Except when it is riding in the aside beside the search trigger, where
     100% is 100% of a box that already holds the trigger — the switch grew
     past its own container and off the right edge of the screen. In the
     cluster it takes its natural width; the trigger has collapsed to its icon
     by here, so the pair fits on one line. */
  .drill-observatory-root .drill-observatory-tools-aside .drill-observatory-section-toggle {
    width: auto;
  }

  .drill-observatory-root .drill-observatory-section-toggle-option {
    flex: 1 1 0;
  }
}

.drill-observatory-root .drill-observatory-hero-grid {
  align-items: stretch;
  display: grid;
  gap: 28px;
  grid-template-columns: minmax(0, 1fr) 392px;
  min-height: 400px;
  padding: var(--observatory-space-2) var(--observatory-space-7) var(--observatory-space-7);
  position: relative;
  z-index: 2;
}

.drill-observatory-root .drill-observatory-greeting {
  align-self: end;
  gap: var(--observatory-space-5);
  max-width: 440px;
  min-height: 0;
  padding: 0 0 6px;
}

.drill-observatory-root .drill-observatory-greeting h1 {
  color: var(--observatory-ink);
  font-family: var(--observatory-display-font);
  font-size: clamp(1.9rem, 3.4vw, var(--observatory-text-display));
  font-variation-settings: &quot;opsz&quot; 60;
  font-weight: 400;
  letter-spacing: var(--observatory-track-display);
  line-height: 1.08;
  /* The scrim under the hero is what makes this text readable. A 24px shadow
     at 60% was doing the scrim&#x27;s job a second time, and on a serif at this
     size it reads as a smudge rather than as contrast. */
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}

.drill-observatory-root .drill-observatory-greeting[data-next=&quot;true&quot;] h1 {
  font-size: clamp(1.5rem, 2.6vw, 2.1rem);
}

.drill-observatory-root .drill-observatory-greeting h1 em {
  font-style: italic;
}

.drill-observatory-root .drill-observatory-greeting p {
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

.drill-observatory-root .drill-observatory-cta {
  background: var(--observatory-ink);
  border: 0;
  border-radius: 999px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  color: #0c0c0e;
  font-family: &quot;Outfit&quot;, ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  font-weight: 600;
  gap: 9px;
  height: 46px;
  padding: 0 26px;
  /* background-color is in this list because :hover changes it. It used to be
     animated only by accident, through the Button utility that outranked this
     rule; now that the rule wins on specificity the list has to be honest or
     the hover would snap. */
  transition: background-color var(--observatory-motion), filter var(--observatory-motion),
    transform var(--observatory-motion);
}

@keyframes drill-observatory-smart-drill-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(244, 241, 234, 0.42);
  }
  50% {
    box-shadow: 0 0 0 9px rgba(244, 241, 234, 0);
  }
}

.drill-observatory-root .drill-observatory-smart-drill-pulse {
  animation: drill-observatory-smart-drill-pulse 2.4s ease-in-out infinite;
}

/* No transform on the primary CTA — it is the one fixed point on the page. */
.drill-observatory-root .drill-observatory-cta:hover {
  background: var(--observatory-ink);
  filter: brightness(1.06);
}

.drill-observatory-root .drill-observatory-cta:active {
  transform: translateY(0.5px);
}

/* The primary CTA had no focus indicator at all: border 0 plus a shadow, and
   the shared Button ring never reached it through the overrides. One rule for
   every pill-shaped control on the cards. */
.drill-observatory-root .drill-observatory-cta:focus-visible,
.drill-observatory-root .drill-observatory-console-start:focus-visible,
.drill-observatory-root .drill-observatory-secondary-link:focus-visible,
.drill-observatory-root .drill-observatory-insight-action:focus-visible,
.drill-observatory-root .drill-observatory-quiet-link:focus-visible,
.drill-observatory-root .drill-observatory-rc-chip:focus-visible,
.drill-observatory-root .drill-observatory-practice-tile:focus-visible {
  box-shadow: none;
  outline: 2px solid var(--observatory-focus);
  outline-offset: 3px;
}

.drill-observatory-root .drill-observatory-focus-inset {
  outline: none;
}

.drill-observatory-root .drill-observatory-focus-inset:focus-visible {
  box-shadow: inset 0 0 0 2px var(--observatory-focus);
}

.drill-observatory-root .drill-observatory-skeleton-bar {
  background: var(--observatory-skeleton);
  border-radius: 999px;
}

/* ── Next up, in the hero ─────────────────────────────────────────────── */

.drill-observatory-root .drill-observatory-next {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 6px;
}

.drill-observatory-root .drill-observatory-next-title {
  color: var(--observatory-ink);
  font-family: &quot;Outfit&quot;, ui-sans-serif, system-ui, sans-serif;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.3;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

.drill-observatory-root .drill-observatory-cta-row {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: 20px;
}

/* The second option, when the first is assigned work. A link, not a second
   button: two buttons of equal weight is the grid the page is trying not to be. */
.drill-observatory-root .drill-observatory-quiet-link {
  background: none;
  border: 0;
  border-radius: 999px;
  color: var(--observatory-ink-70);
  cursor: pointer;
  font-family: &quot;Outfit&quot;, ui-sans-serif, system-ui, sans-serif;
  font-size: 13.5px;
  font-weight: 500;
  min-height: 44px;
  padding: 0 4px;
  text-decoration: underline;
  /* The underline is the only thing marking this as a link, so it carries the
     affordance and 0.35 was too faint against the photograph. */
  text-decoration-color: rgba(244, 241, 234, 0.55);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  text-underline-offset: 4px;
  transition: color var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-quiet-link:hover {
  color: var(--observatory-ink);
}

/* Secondary insight actions: a link, on the card, no text shadow. */
.drill-observatory-root .drill-observatory-insight-link {
  background: none;
  border: 0;
  border-radius: 999px;
  color: var(--observatory-ink-70);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  min-height: 44px;
  padding: 0 4px;
  text-decoration: underline;
  text-decoration-color: rgba(244, 241, 234, 0.3);
  text-underline-offset: 4px;
  transition: color var(--observatory-motion);
  white-space: nowrap;
}

.drill-observatory-root .drill-observatory-insight-link:hover {
  color: var(--observatory-ink);
}

.drill-observatory-root .drill-observatory-deck[data-queue=&quot;true&quot;] {
  align-items: start;
}

.drill-observatory-root .drill-observatory-deck[data-queue=&quot;true&quot;] .drill-observatory-today,
.drill-observatory-root .drill-observatory-deck[data-queue=&quot;true&quot;] .drill-observatory-today-inner {
  height: auto;
}

/* ── Finder console ──────────────────────────────────────────────────────── */

.drill-observatory-root .drill-observatory-console {
  align-self: center;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: var(--observatory-glass);
  border: 0;
  border-radius: var(--observatory-radius-panel);
  box-shadow:
    0 0 0 1px var(--observatory-ring-glass),
    var(--observatory-shadow-glass);
  display: flex;
  flex-direction: column;
  gap: var(--observatory-space-3);
  margin: 0;
  max-width: none;
  padding: var(--observatory-space-5);
  position: relative;
  z-index: 3;
}

.drill-observatory-root .drill-observatory-console input[type=&quot;search&quot;] {
  background: var(--observatory-well);
  border: 0;
  border-radius: 999px;
  box-shadow: 0 0 0 1px var(--observatory-ring-strong);
  color: var(--observatory-ink);
  font-size: var(--observatory-text-body);
  font-weight: 400;
  height: 46px;
}

.drill-observatory-root .drill-observatory-console button[role=&quot;combobox&quot;] {
  background: var(--observatory-well);
  border: 0;
  border-radius: var(--observatory-radius-control);
  box-shadow: 0 0 0 1px var(--observatory-ring-strong);
  color: var(--observatory-ink);
  font-size: var(--observatory-text-body);
  font-weight: 500;
  height: 46px;
  padding: 0 var(--observatory-space-4);
}

/* Radix puts data-placeholder on the TRIGGER, not on the value span — the
   obvious selector (span[data-placeholder]) matches nothing and every select
   renders at full ivory whether or not it holds a value. */
.drill-observatory-root .drill-observatory-console button[role=&quot;combobox&quot;][data-placeholder] {
  color: var(--observatory-ink-70);
}

.drill-observatory-root .drill-observatory-console input[type=&quot;search&quot;]::placeholder {
  color: var(--observatory-ink-70);
}

.drill-observatory-root .drill-observatory-console input[type=&quot;search&quot;]:focus-visible,
.drill-observatory-root .drill-observatory-console button[role=&quot;combobox&quot;]:focus-visible {
  box-shadow:
    0 0 0 1px var(--observatory-ring-strong),
    0 0 0 3px rgba(244, 241, 234, 0.14);
  outline: none;
}

.drill-observatory-root .drill-observatory-console button[role=&quot;combobox&quot;] svg {
  color: var(--observatory-ink-70);
  opacity: 1;
  stroke-width: 1.8;
}

.drill-observatory-root .drill-observatory-console button[role=&quot;combobox&quot;]:disabled {
  color: var(--observatory-ink-50);
  opacity: 1;
}

/* Start. Ghost until a question is actually selected — the design&#x27;s one piece of
   state signalling, and the reason it is not a filled button. */
.drill-observatory-root .drill-observatory-console-start {
  background: transparent;
  border: 0;
  border-radius: 999px;
  box-shadow: 0 0 0 1px var(--observatory-ring-strong);
  color: var(--observatory-ink-60);
  font-size: var(--observatory-text-body);
  font-weight: 600;
  height: 46px;
  transition: color var(--observatory-motion), box-shadow var(--observatory-motion),
    transform var(--observatory-motion);
  width: 100%;
}

.drill-observatory-root .drill-observatory-console-start:not(:disabled) {
  box-shadow: 0 0 0 1px rgba(244, 241, 234, 0.42);
  color: var(--observatory-ink);
}

.drill-observatory-root .drill-observatory-console-start:not(:disabled):hover {
  box-shadow: 0 0 0 1px var(--observatory-ink);
}

.drill-observatory-root .drill-observatory-console-start:not(:disabled):active {
  transform: translateY(0.5px);
}

.drill-observatory-root .drill-observatory-console-start:disabled {
  opacity: 1;
}

/* Advanced filters and search results sit IN FLOW inside the console — the
   console grows rather than dropping an overlay. An overlay over a
   backdrop-filtered surface needs its own stacking and dismiss handling for no
   gain: this panel is only ever open because the student opened it. */
.drill-observatory-root .drill-observatory-advanced,
.drill-observatory-root .drill-observatory-search-results {
  background: rgba(0, 0, 0, 0.28);
  border: 0;
  border-radius: var(--observatory-radius-control);
  box-shadow: 0 0 0 1px var(--observatory-ring-quiet);
  padding: var(--observatory-space-3);
  position: static;
}

.drill-observatory-root .drill-observatory-advanced {
  display: grid;
  gap: var(--observatory-space-2);
  grid-template-columns: minmax(0, 1fr);
}

.drill-observatory-root .drill-observatory-search-results {
  max-height: 208px;
  overflow-y: auto;
}

.drill-observatory-root .drill-observatory-advanced button[role=&quot;combobox&quot;] {
  height: 40px;
}

.drill-observatory-root .drill-observatory-disclosure {
  align-items: center;
  color: var(--observatory-ink-70);
  display: inline-flex;
  gap: var(--observatory-space-2);
  transition: color var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-disclosure:hover {
  color: var(--observatory-ink-85);
}

/* ── Lower deck ──────────────────────────────────────────────────────────── */

/* Two separate cards with a real gap, not one shell split by a divider. The
   practice card is flat black; Today carries the eclipse. */
.drill-observatory-root .drill-observatory-deck {
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  gap: var(--observatory-space-5);
  overflow: visible;
}

.drill-observatory-root .drill-observatory-practice-bay,
.drill-observatory-root .drill-observatory-today-bay {
  min-width: 0;
}

.drill-observatory-root .drill-observatory-practice,
.drill-observatory-root .drill-observatory-launcher {
  background: var(--observatory-surface-card);
  border: 0;
  border-radius: var(--observatory-radius-shell);
  box-shadow:
    0 0 0 1px var(--observatory-hairline),
    var(--observatory-shadow-card);
  height: 100%;
  padding: 26px 28px;
}

.drill-observatory-root .drill-observatory-practice {
  gap: var(--observatory-space-6);
}

/* Tools are a hairline split, not two boxed cards. */
/* One column per tool. This was 1fr 1fr and stayed that way when Reading
   Comprehension made it three, which wrapped the third tile onto its own row
   under a hole. auto-fit keeps it honest as tools are added or removed. */
.drill-observatory-root .drill-observatory-practice-tools {
  border: 0;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
}

.drill-observatory-root .drill-observatory-practice-tile {
  background: transparent;
  border: 0;
  border-radius: var(--observatory-radius-control);
  gap: 10px;
  padding: 2px 24px 2px 2px;
  transition: background-color var(--observatory-motion), opacity var(--observatory-motion),
    transform var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-practice-tile + .drill-observatory-practice-tile {
  border-left: 1px solid var(--observatory-hairline);
  padding: 2px 2px 2px 24px;
}

.drill-observatory-root .drill-observatory-practice-tile:hover {
  background: transparent;
  transform: translateY(-2px);
}

.drill-observatory-root .drill-observatory-practice-tile:active {
  transform: translateY(0.5px);
}

/* Reading Comprehension turns the tool row over instead of navigating away.
   The faces are absolutely stacked and the deck&#x27;s height is set from JS, so
   the container has to be positioned and its height transitioned here. */
.drill-observatory-root .drill-observatory-flip {
  perspective: 1400px;
  position: relative;
  /* Height is set from JS and snaps. It was transitioned, which animates a
     layout property; the faces&#x27; rotation carries the motion on its own. */
}

.drill-observatory-root .drill-observatory-flip-face {
  backface-visibility: hidden;
  left: 0;
  position: absolute;
  top: 0;
  transition: transform 520ms cubic-bezier(0.22, 0.68, 0.24, 1),
    visibility 0s linear 260ms;
  width: 100%;
}

.drill-observatory-root .drill-observatory-flip-front {
  transform: rotateY(0deg);
}

.drill-observatory-root .drill-observatory-flip-back {
  transform: rotateY(-180deg);
}

/* visibility (not opacity) so the hidden face leaves the tab order — a
   backface-hidden element is still focusable. */
.drill-observatory-root .drill-observatory-flip-face[aria-hidden=&quot;true&quot;] {
  visibility: hidden;
}

.drill-observatory-root .drill-observatory-flip.is-flipped .drill-observatory-flip-front {
  transform: rotateY(180deg);
}

.drill-observatory-root .drill-observatory-flip.is-flipped .drill-observatory-flip-back {
  transform: rotateY(0deg);
}

.drill-observatory-root .drill-observatory-rc-build {
  display: grid;
  gap: 16px;
  padding: 2px;
}

.drill-observatory-root .drill-observatory-rc-build-actions {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 2px;
}

/* The Start control is the console&#x27;s, sized down to sit in a row rather than
   span a column. */
.drill-observatory-root .drill-observatory-rc-build-actions .drill-observatory-console-start {
  height: 40px;
  padding: 0 20px;
  width: auto;
}

.drill-observatory-root .drill-observatory-rc-chip {
  background: transparent;
  border: 0;
  border-radius: 999px;
  box-shadow: 0 0 0 1px var(--observatory-ring-glass);
  color: var(--observatory-ink-70);
  font-size: var(--observatory-text-meta);
  font-weight: 500;
  min-height: 32px;
  padding: 7px 14px;
  transition: box-shadow var(--observatory-motion), color var(--observatory-motion),
    background-color var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-rc-chip:hover {
  box-shadow: 0 0 0 1px var(--observatory-ring-strong);
  color: rgba(244, 241, 234, 0.95);
}

.drill-observatory-root .drill-observatory-rc-chip.is-active {
  background: rgba(244, 241, 234, 0.1);
  box-shadow: 0 0 0 1px rgba(244, 241, 234, 0.45);
  color: var(--observatory-ink);
}

.drill-observatory-root .drill-observatory-secondary-link {
  background: transparent;
  border: 1px solid var(--observatory-ring-glass);
  border-radius: 999px;
  color: var(--observatory-ink-70);
  font-size: var(--observatory-text-meta);
  font-weight: 500;
  gap: 7px;
  min-height: 44px;
  padding: 0 16px;
  transition: border-color var(--observatory-motion), color var(--observatory-motion),
    transform var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-secondary-link:hover {
  border-color: var(--observatory-ring-strong);
  color: rgba(244, 241, 234, 0.95);
}

.drill-observatory-root .drill-observatory-secondary-link:active {
  transform: translateY(0.5px);
}

/* Insights are rows under hairlines, not a carousel and not nested cards.
   Every real signal is on the page at once; nothing rotates. */
.drill-observatory-root .drill-observatory-insights {
  display: grid;
  list-style: none;
  margin: 0;
  padding: 0;
}

.drill-observatory-root .drill-observatory-insight {
  align-items: end;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 20px;
  justify-content: space-between;
  padding: 18px 0;
}

.drill-observatory-root .drill-observatory-insight:first-child {
  padding-top: 0;
}

.drill-observatory-root .drill-observatory-insight:last-child {
  padding-bottom: 0;
}

.drill-observatory-root .drill-observatory-insight + .drill-observatory-insight {
  border-top: 1px solid var(--observatory-ring-quiet);
}

/* Analytics and Journal are records, not tools; they sit under their own
   hairline at the foot of the card. */
.drill-observatory-root .drill-observatory-records {
  border-top: 1px solid var(--observatory-ring-quiet);
}

.drill-observatory-root .drill-observatory-insight-value {
  color: var(--observatory-ink-90);
  font-family: var(--observatory-display-font);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
}

.drill-observatory-root .drill-observatory-insight-action {
  background: transparent;
  border: 0;
  border-radius: 999px;
  box-shadow: 0 0 0 1px rgba(244, 241, 234, 0.16);
  color: var(--observatory-ink-90);
  font-size: 12.5px;
  font-weight: 500;
  min-height: 44px;
  padding: 0 18px;
  transition: background-color var(--observatory-motion), box-shadow var(--observatory-motion),
    transform var(--observatory-motion);
  white-space: nowrap;
}

.drill-observatory-root .drill-observatory-insight-action:hover {
  background: transparent;
  box-shadow: 0 0 0 1px rgba(244, 241, 234, 0.3);
}

.drill-observatory-root .drill-observatory-insight-action:active {
  transform: translateY(0.5px);
}

/* ── Today ───────────────────────────────────────────────────────────────── */

.drill-observatory-root .drill-observatory-today {
  background: none;
  border-radius: 0;
  box-shadow: none;
  height: 100%;
  padding: 0;
}

.drill-observatory-root .drill-observatory-today-inner {
  background: var(--observatory-surface-card);
  border-radius: var(--observatory-radius-shell);
  box-shadow:
    0 0 0 1px var(--observatory-ring),
    var(--observatory-shadow-card);
  gap: var(--observatory-space-3);
  height: 100%;
  overflow: hidden;
  padding: var(--observatory-space-6);
  position: relative;
}

.drill-observatory-root .drill-observatory-today-primary {
  background: rgba(244, 241, 234, 0.04);
  border-radius: var(--observatory-radius-inner);
  box-shadow: 0 0 0 1px var(--observatory-ring);
  min-height: 0;
  overflow: hidden;
  padding: 0;
}

.drill-observatory-root .drill-observatory-today-primary &gt; div {
  background: none;
  border-radius: var(--observatory-radius-inner);
  min-height: 0;
}

.drill-observatory-root .drill-observatory-today-title {
  color: var(--observatory-ink);
  font-family: var(--observatory-display-font);
  font-size: var(--observatory-text-heading);
  font-weight: 500;
  line-height: 1.3;
}

.drill-observatory-root .drill-observatory-today-chip {
  border: 1px solid var(--observatory-ring-chip);
  border-radius: 999px;
  color: var(--observatory-ink-85);
  font-family: var(--observatory-label-font);
  font-size: var(--observatory-text-label-sm);
  font-weight: 600;
  letter-spacing: var(--observatory-track-chip);
  padding: 5px 10px;
  text-transform: uppercase;
}

.drill-observatory-root .drill-observatory-today-action {
  border-top: 1px solid var(--observatory-ring);
  transition: background-color var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-today-action:hover:not(:disabled) {
  background-color: rgba(244, 241, 234, 0.05);
}

.drill-observatory-root .drill-observatory-today-rail {
  background: rgba(244, 241, 234, 0.035);
  border-radius: var(--observatory-radius-control);
  box-shadow: 0 0 0 1px var(--observatory-ring-quiet);
  padding: var(--observatory-space-3) var(--observatory-space-4);
  transition: transform var(--observatory-motion), box-shadow var(--observatory-motion),
    background-color var(--observatory-motion);
}

.drill-observatory-root .drill-observatory-today-rail:hover {
  background: rgba(244, 241, 234, 0.06);
  box-shadow: 0 0 0 1px var(--observatory-ring-glass);
  transform: translateY(-2px);
}

.drill-observatory-root .drill-observatory-today-rail:active {
  transform: translateY(0.5px);
}

.drill-observatory-root .drill-observatory-today-quiet {
  background: rgba(244, 241, 234, 0.035);
  border-radius: var(--observatory-radius-control);
  box-shadow: 0 0 0 1px var(--observatory-ring-quiet);
  color: var(--observatory-ink-50);
  font-size: var(--observatory-text-meta);
  padding: var(--observatory-space-3) var(--observatory-space-4);
}

/* ── Analytics stage ─────────────────────────────────────────────────────── */

/* AnalyticsStage is written against the app&#x27;s light-only shadcn tokens; dropped
   on this surface it renders grey-on-black. Re-map it rather than fork it. */
.drill-observatory-root .drill-observatory-analytics {
  background: var(--observatory-surface-card);
  border: 0;
  border-radius: var(--observatory-radius-shell);
  box-shadow:
    0 0 0 1px var(--observatory-hairline),
    var(--observatory-shadow-card);
  color: var(--observatory-ink);
  overflow: hidden;
  padding: 26px 28px;
}

.drill-observatory-root .drill-observatory-analytics .bg-white,
.drill-observatory-root .drill-observatory-analytics .bg-slate-100 {
  background-color: rgba(244, 241, 234, 0.035);
}

.drill-observatory-root .drill-observatory-analytics .border-slate-200,
.drill-observatory-root .drill-observatory-analytics .border-slate-300,
.drill-observatory-root .drill-observatory-analytics .border-slate-100 {
  border-color: var(--observatory-hairline);
}

.drill-observatory-root .drill-observatory-analytics .text-slate-900,
.drill-observatory-root .drill-observatory-analytics .text-slate-800,
.drill-observatory-root .drill-observatory-analytics .text-slate-700,
.drill-observatory-root .drill-observatory-analytics .text-slate-600 {

}

.drill-observatory-root .drill-observatory-analytics .text-slate-500,
.drill-observatory-root .drill-observatory-analytics .text-slate-400 {

}

.drill-observatory-root .drill-observatory-analytics .shadow-sm,
.drill-observatory-root .drill-observatory-analytics .shadow {

}

.drill-observatory-root .drill-observatory-analytics .rounded-xl,
.drill-observatory-root .drill-observatory-analytics .rounded-2xl {

}

.drill-observatory-root .drill-observatory-analytics table tr {

}

.drill-observatory-root .drill-observatory-analytics .bg-slate-900 {

}

.drill-observatory-root .drill-observatory-analytics .bg-rose-50 {

}

.drill-observatory-root .drill-observatory-analytics .text-rose-600 {
  color: #ff97a1;
}

/* ── Responsive ──────────────────────────────────────────────────────────── */

/* The console is a fixed 392px by design. Below ~1080px of canvas the hero&#x27;s
   left column starts losing the greeting, so the console narrows before the
   layout stacks. */
@media (max-width: 1199px) {
  .drill-observatory-root .drill-observatory-hero-grid {
    gap: var(--observatory-space-5);
    grid-template-columns: minmax(0, 1fr) 356px;
    padding: var(--observatory-space-2) var(--observatory-space-6) var(--observatory-space-6);
  }

}

@media (max-width: 1023px) {
  /* The menu button lives in the sticky bar above this stage now, so the top
     inset is the hub&#x27;s own spacing rather than clearance for a floating
     button. */
  .classroom-root.classroom-root-drill .classroom-stage {
    padding: var(--observatory-space-4) var(--observatory-space-5)
      var(--observatory-space-5);
  }

}

@media (max-width: 899px) {
  .drill-observatory-root .drill-observatory-hero-grid {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto;
    min-height: 0;
    padding-top: var(--observatory-space-5);
  }

  .drill-observatory-root .drill-observatory-hero {
    background-position: center 78%;
  }

  .drill-observatory-root .drill-observatory-greeting {
    align-self: start;
    max-width: none;
  }

  .drill-observatory-root .drill-observatory-console {
    align-self: stretch;
    max-width: 460px;
  }
}

@media (max-width: 759px) {
  .classroom-root.classroom-root-drill .classroom-stage {
    padding: var(--observatory-space-4) var(--observatory-space-4)
      var(--observatory-space-5);
  }

  .drill-observatory-root .drill-observatory-hero-grid {
    gap: var(--observatory-space-5);
    padding: var(--observatory-space-4);
  }

  .drill-observatory-root .drill-observatory-console {
    max-width: none;
  }

  .drill-observatory-root .drill-observatory-practice,
  .drill-observatory-root .drill-observatory-launcher,
  .drill-observatory-root .drill-observatory-today-inner,
  .drill-observatory-root .drill-observatory-analytics {
    padding: var(--observatory-space-5);
  }

  .drill-observatory-root .drill-observatory-practice-tools {
    grid-template-columns: minmax(0, 1fr);
  }

  .drill-observatory-root .drill-observatory-practice-tile {
    padding: 2px 2px 14px;
  }

  .drill-observatory-root .drill-observatory-practice-tile + .drill-observatory-practice-tile {
    border-left: 0;
    border-top: 1px solid var(--observatory-hairline);
    padding: 14px 2px 2px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .drill-observatory-root .drill-observatory-smart-drill-pulse {
    animation: none;
  }
  .drill-observatory-root *:not(.drill-observatory-smart-drill-pulse),
  .drill-observatory-root *:not(.drill-observatory-smart-drill-pulse)::before,
  .drill-observatory-root *:not(.drill-observatory-smart-drill-pulse)::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }

  .drill-observatory-root .drill-observatory-practice-tile:hover,
  .drill-observatory-root .drill-observatory-today-rail:hover {
    transform: none;
  }

}

/* end observatory */

.classroom-root .classroom-dateline {

.classroom-root .classroom-title {

.classroom-root .classroom-message {

.classroom-root .classroom-actions {

.classroom-root .classroom-button {

/* The fill has to carry a label, so it uses the accent pair rather than

.classroom-root .classroom-button-primary {

.classroom-root .classroom-button-primary:hover {

.classroom-root .classroom-content-section {

.classroom-root .classroom-skeleton-stack .classroom-skeleton:nth-child(3) {

.classroom-root .classroom-note-meta {

}

/* DESIGN.md&#x27;s Reading Measure Rule: a surface carrying a passage, stimulus or
   explanation constrains its own line length; the container&#x27;s maximum is a
   ceiling for layout, never a licence for prose. This ran the full 720px column
   at 16px, about 90 characters a line, against the 65-75ch the rule asks for.
   Applied to the prose block rather than each child so an authored note&#x27;s own
   elements inherit it too. Figures and tables opt out below, because a wide
   table is easier to read than a wrapped one.

   56ch, not the 68ch you would reach for. The `ch` unit is the width of &quot;0&quot;,
   and in Outfit that is 9.71px against a 7.58px average character, so 68ch
   renders about 87 characters a line. 56ch measures ~72, which is inside the
   65-75 the rule actually asks for. Measured in the browser, not assumed. */
.classroom-root .classroom-prose {
  color: var(--classroom-ink-body);
  max-width: 56ch;
}

.classroom-root .classroom-prose figure,
.classroom-root .classroom-prose table,
.classroom-root .classroom-prose pre {
  max-width: none;
}

.classroom-root .classroom-prose p {
  color: var(--classroom-ink-body);
  font-size: 16px;
  line-height: 1.75;
  margin: 0 0 20px;
}

.classroom-root .classroom-prose a {
  color: var(--classroom-link);
  text-decoration: none;
  transition: color var(--classroom-transition) ease;
}

.classroom-root .classroom-prose a:hover {
  color: var(--classroom-ink);
}

.classroom-root .classroom-prose h2 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 36px 0 14px;
}

.classroom-root .classroom-prose h3 {
  font-size: 17px;
  font-weight: 600;
  margin: 28px 0 12px;
}

.classroom-root .classroom-prose ol,
.classroom-root .classroom-prose ul {
  color: var(--classroom-ink-body);
  font-size: 16px;
  line-height: 1.75;
  margin: 0 0 20px;
  padding-left: 22px;
}

.classroom-root .classroom-prose li {
  margin-bottom: 10px;
}

.classroom-root .classroom-prose blockquote {
  border-left: 4px solid var(--classroom-ink);
  color: var(--classroom-ink-body);
  font-size: 16px;
  line-height: 1.7;
  margin: 0 0 22px;
  padding: 2px 0 2px 18px;
}

.classroom-root .classroom-prose figure {
  margin: 0 0 24px;
}

.classroom-root .classroom-prose figure img,
.classroom-root .classroom-prose &gt; img {
  border: 1px solid var(--classroom-line);
  border-radius: var(--classroom-radius);
  display: block;
  height: auto;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  max-width: min(100vw, 720px);
  position: relative;
  left: 50%;
  right: 50%;
  transform: translateX(-50%);
  width: min(100vw, 720px);
}

.classroom-root .classroom-prose figure figcaption {
  color: var(--classroom-meta-text);
  font-family: &quot;IBM Plex Mono&quot;, ui-monospace, &quot;SF Mono&quot;, monospace;

}

.classroom-root .classroom-prose .callout,
.classroom-root .classroom-callout {

  border: 1px solid var(--classroom-line);

  line-height: 1.65;

.classroom-root .classroom-prose iframe,
.classroom-root .classroom-prose embed {

  border-radius: var(--classroom-radius);

  min-height: 360px;

.classroom-root .classroom-detail-actions {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 28px;
}

/* The menu button sits in this bar below 1024px. The bar is sticky, so it
   holds the top of the viewport while the student scrolls, but it takes its
   own 56px in the flow instead of floating over the page the way the fixed
   button did. Above 1024px the sidebar is visible and the bar is not drawn. */
.classroom-root .classroom-mobile-bar {
  display: none;
}

.classroom-root .classroom-mobile-menu-button {
  align-items: center;
  background: var(--classroom-trigger);
  border: 1px solid var(--classroom-line-strong);
  border-radius: var(--classroom-radius);
  cursor: pointer;
  display: none;
  flex: none;
  height: 44px;
  justify-content: center;
  width: 44px;
}

/* The shell&#x27;s own label voice, not the hub&#x27;s mono micro-label: this bar is
   part of the classroom chrome and appears on every section. */
/* The bar&#x27;s section name, promoted to the control that opens that section&#x27;s
   list. It replaces a 48px full-width trigger that sat inside the reading
   column above the note&#x27;s own dateline and h1, costing 23% of a 390px screen
   before a word the coach wrote. Three things about the bar make it the better
   home: it already prints the section&#x27;s real name, so the control no longer has
   to say &quot;Open the list&quot; and leave the object unnamed; it is sticky, so it
   survives a long note instead of scrolling away; and it puts the room control
   and the section control in one row where the difference between them reads.

   It carries the rail’s own chevron glyph, which already means &quot;this opens a list&quot;
   everywhere else in this shell, rather than an icon the student has to decode.
   No border: the words carry the affordance, the same reasoning the sign-out
   control is built on. */
.classroom-root .classroom-mobile-bar-trigger {
  align-items: center;
  align-self: stretch;
  background: transparent;
  border: 0;
  border-radius: var(--classroom-radius);
  color: var(--classroom-ink);
  cursor: pointer;
  display: flex;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  gap: 5px;
  margin-left: -8px;
  min-width: 0;
  padding: 0 8px;
}

.classroom-root .classroom-mobile-bar-trigger &gt; span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.classroom-root .classroom-mobile-bar-trigger &gt; em {
  color: var(--classroom-meta-text);
  flex: none;
  font-size: 15px;
  font-style: normal;
  line-height: 1;
}

.classroom-root .classroom-mobile-bar-trigger:hover {
  background: var(--classroom-hover);
}

/* --classroom-link is the decorative orange and measures 2.38:1 on the light
   ground, under the 3:1 a focus indicator owes. --classroom-link-text is the
   themed pair that carries meaning: 5.38:1 light, and the same #ff8906 in dark
   where the ground is near-black. */
.classroom-root .classroom-mobile-bar-trigger:focus-visible {
  outline: 2px solid var(--classroom-link-text);
  outline-offset: -2px;
}

.classroom-root .classroom-mobile-bar-label {
  color: var(--classroom-meta-text);
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.classroom-root .classroom-mobile-menu,
.classroom-root .classroom-section-overlay {
  inset: 0;
  position: fixed;
  z-index: 80;
}

.classroom-root .classroom-overlay-backdrop {
  background: rgba(15, 14, 23, 0.42);

  cursor: pointer;
  inset: 0;
  padding: 0;
  position: absolute;
  width: 100%;
}

.classroom-root .classroom-mobile-menu &gt; aside {
  bottom: 0;
  left: 0;
  max-width: 336px;
  position: absolute;
  top: 0;
  width: calc(100% - 32px);

.classroom-root .classroom-mobile-menu .classroom-sidebar-card {
  border-left: 0;
  border-radius: 0 var(--classroom-radius) var(--classroom-radius) 0;
}

.classroom-root .classroom-mobile-menu .classroom-overlay-close {
  margin: 0;
  position: absolute;
  right: 16px;
  top: 16px;
  z-index: 4;
}

.classroom-root .classroom-section-overlay &gt; aside {
  bottom: 0;
  max-width: 420px;
  position: absolute;
  right: 0;
  top: 0;
  width: min(100%, 420px);
}

.classroom-root .classroom-section-overlay .classroom-section-card {
  border-left: 1px solid var(--classroom-line);
  border-radius: var(--classroom-radius) 0 0 var(--classroom-radius);
}

.classroom-root .classroom-empty-copy {
  color: var(--classroom-meta-text);
  font-size: 15px;
  line-height: 1.65;
}

/* ---- Flagged ---- */

.classroom-root .classroom-panel-search {
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: var(--classroom-radius);
  color: var(--classroom-ink);
  font-family: inherit;
  font-size: 13px;
  margin-bottom: 12px;
  padding: 7px 10px;
  width: 100%;
}

.classroom-root .classroom-panel-search::placeholder {
  color: var(--classroom-meta-text);

/* A border-colour change is not a focus indicator. DESIGN.md names this exact
   substitution as too quiet to be the only signal, and `outline: none` here was
   also overriding the zero-specificity focus floor in index.css. Keyboard focus
   now draws the same ink outline every other control in the Workroom uses;
   :focus-visible so a mouse click on the field does not draw a ring. */
.classroom-root .classroom-panel-search:focus-visible {
  outline: 2px solid var(--classroom-ink);
  outline-offset: 2px;
}

.classroom-root .classroom-panel-empty {
  color: var(--classroom-meta-text);
  font-size: 13px;
  line-height: 1.6;
  margin: 8px 0 0;
}

.classroom-root .classroom-question {
  margin: 28px 0 0;
}

.classroom-root .classroom-question-stimulus,
.classroom-root .classroom-question-stem {

.classroom-root .classroom-question-stem {

.classroom-root .classroom-flag-note,

.classroom-root .classroom-journal-stage-inner {

.classroom-root .classroom-journal-entry-heading {

.classroom-root .classroom-journal-entry-heading &gt; div {

.classroom-root .classroom-annotate-button {

.classroom-root .classroom-journal-answer-nudge {

.classroom-root .classroom-journal-choices {

.classroom-root .classroom-journal-choice {

.classroom-root .classroom-journal-choice:hover {

}

.classroom-root .classroom-journal-choice i {

.classroom-root .classroom-journal-choice span {

.classroom-root .classroom-journal-choice em {

.classroom-root .classroom-journal-choice-correct i,
.classroom-root .classroom-journal-choice-correct em {

}

.classroom-root .classroom-journal-choice-wrong {
  background: color-mix(in srgb, var(--classroom-wrong) 7%, transparent);
  border-color: var(--classroom-wrong);
}

.classroom-root .classroom-journal-choice-wrong i,

.classroom-root .classroom-journal-reasoning-wrong {

}

.classroom-root .classroom-journal-reasoning-correct {

}

.classroom-root .classroom-aside {

}

.classroom-root .classroom-aside-inner {

.classroom-root .classroom-aside-inner &gt; h2 {

.classroom-root .classroom-review-form {

}

.classroom-root .classroom-review-field {

  gap: 7px;

}

.classroom-root .classroom-review-field &gt; span {

  font-family: &quot;IBM Plex Mono&quot;, ui-monospace, &quot;SF Mono&quot;, monospace;

.classroom-root .classroom-review-ratings {

.classroom-root .classroom-review-rating {

  border-radius: var(--classroom-radius);
  cursor: pointer;

}

.classroom-root .classroom-review-rating-wrong.classroom-review-rating-active {
  background: color-mix(in srgb, var(--classroom-wrong) 10%, transparent);

  color: var(--classroom-wrong);
}

.classroom-root .classroom-review-rating-unsure.classroom-review-rating-active {
  background: color-mix(in srgb, var(--classroom-unsure) 10%, transparent);
  border-color: var(--classroom-unsure);

.classroom-root .classroom-review-rating-correct.classroom-review-rating-active {

}

.classroom-root .classroom-review-correct-answer {
  background: transparent;
  border: 1px solid var(--classroom-line);
  border-radius: var(--classroom-radius);
  color: var(--classroom-ink-body);
  font-family: inherit;
  font-size: 13px;
  min-height: 38px;
  padding: 8px 10px;

}

.classroom-root .classroom-review-control {
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: var(--classroom-radius);

  font-size: 13px;

.classroom-root .classroom-review-control:focus-visible {

.classroom-root .classroom-review-correct-answer {

.classroom-root .classroom-review-answer-grid {

}

.classroom-root .classroom-aside-inner &gt; .classroom-button {

/* Platform announcements: one strip above the list, present only when there is
   something to say. Tinted so it reads as news, not as another task. */
.classroom-root .classroom-announcement {
  align-items: flex-start;
  background: var(--classroom-hover);
  border: 1px solid var(--classroom-line-strong);
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  padding: 14px 16px;
  text-align: left;
  transition: border-color var(--classroom-transition) ease;
  width: 100%;
}

.classroom-root .classroom-announcement:hover {
  border-color: var(--classroom-link);
}

.classroom-root .classroom-announcement-icon {
  align-items: center;
  color: var(--classroom-link);
  display: flex;
  flex: 0 0 auto;
  padding-top: 1px;
}

.classroom-root .classroom-announcement-text {
  display: grid;
  flex: 1 1 auto;
  gap: 2px;
  min-width: 0;
}

.classroom-root .classroom-announcement-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
}

.classroom-root .classroom-announcement-body {
  color: var(--classroom-meta-text);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.classroom-root .classroom-announcement-date {
  color: var(--classroom-meta-text);
  flex: 0 0 auto;
  font-size: 12px;
  opacity: 0.8;
  text-transform: uppercase;
}

@media (min-width: 1024px) {
  .classroom-root .classroom-title {
    font-size: 36px;
  }
}

@media (max-width: 1399px) {
  .classroom-root.classroom-root-journal .classroom-section-list {
    display: none;
  }

  .classroom-root.classroom-root-journal-detail {
    grid-template-columns: 336px minmax(0, 1fr) 320px;
  }

  .classroom-root.classroom-root-journal-detail .classroom-journal-stage {
    grid-column: 2;
  }

  .classroom-root.classroom-root-journal-detail .classroom-aside {
    grid-column: 3;
  }
}

@media (max-width: 1279px) {
  .classroom-root .classroom-section-list {
    display: none;
  }

}

@media (max-width: 1099px) {
  .classroom-root.classroom-root-journal-detail {
    grid-template-columns: 336px minmax(0, 1fr);
    height: auto;
    min-height: 100dvh;
    overflow: visible;
    overflow-x: hidden;
  }

  .classroom-root.classroom-root-journal-detail .classroom-sidebar {
    grid-row: 1 / span 2;
  }

  .classroom-root.classroom-root-journal-detail .classroom-journal-stage {
    grid-column: 2;
    grid-row: 1;
  }

  .classroom-root .classroom-journal-stage {
    height: auto;
    min-height: 0;
    overflow: visible;
  }

  .classroom-root.classroom-root-journal-detail .classroom-aside {
    border-left: 0;
    border-top: 1px solid var(--classroom-line);
    grid-column: 2;
    grid-row: 2;
    height: auto;
    overflow: visible;
  }
}

@media (max-width: 1023px) {
  /* The root is a flex ROW: sidebar beside stage. The bar is a third child, so
     in a row it claimed a column of its own and squeezed the stage (271px of
     375 on a phone). Below the sidebar breakpoint the room stacks instead, and
     the bar is a full-width band above the stage. */
  .classroom-root {
    align-items: stretch;
    flex-direction: column;
  }

  .classroom-root .classroom-sidebar {
    display: none;
  }

  /* The bar takes 56px of the flow, so a full-height stage would push every
     short page 56px past the viewport. */
  .classroom-root .classroom-stage,
  .classroom-root .classroom-stage-pending {
    min-height: calc(100dvh - 56px);
  }

  .classroom-root .classroom-mobile-bar {
    align-items: center;
    background: var(--classroom-page);
    border-bottom: 1px solid var(--classroom-line);
    display: flex;
    /* A column flex item shrinks when its siblings ask for the full height, and
       Messages did exactly that: the bar came out 52px instead of 56. */
    flex: none;
    gap: 12px;
    height: 56px;
    padding: 0 12px;
    position: sticky;
    top: 0;
    z-index: 70;
  }

  .classroom-root.classroom-root-drill .classroom-mobile-bar {
    background: var(--classroom-drill-page);
  }

  .classroom-root .classroom-mobile-menu-button {
    display: flex;
  }

  /* Was 72px, the clearance the fixed button needed. The bar has its own
     space now, so the column only needs its ordinary inset. */
  .classroom-root .classroom-column {
    padding: 16px 0 90px;
  }

  .classroom-root.classroom-root-schedule .classroom-column {
    padding: 16px 0 72px;
  }

  .classroom-root .classroom-leader-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 2px;
  }

  .classroom-root .classroom-dotted-leader {
    display: none;
  }

  .classroom-root .classroom-covering-link {
    min-height: 100%;
  }

  .classroom-root.classroom-root-journal-detail {
    grid-template-columns: minmax(0, 1fr);
  }

  .classroom-root.classroom-root-journal-detail .classroom-journal-stage,
  .classroom-root.classroom-root-journal-detail .classroom-aside {
    grid-column: 1;
  }

  .classroom-root .classroom-journal-stage-inner {
    padding-top: 16px;
  }
}

@media (max-width: 639px) {
  .classroom-root .classroom-stage {
    padding: 0 18px;
  }

  .classroom-root .classroom-message {
    padding: 16px;
  }

  .classroom-root .classroom-message header {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .classroom-root .classroom-message time {
    flex-basis: 100%;
    margin-left: 42px;
  }

  .classroom-root .classroom-journal-stage-inner,
  .classroom-root .classroom-aside-inner {
    padding-left: 18px;
    padding-right: 18px;
  }

  .classroom-root .classroom-journal-entry-heading {
    align-items: stretch;
    flex-direction: column;
  }

  .classroom-root .classroom-annotate-button {
    align-self: flex-start;
  }

  .classroom-root .classroom-review-answer-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   Drill launcher panels (Full Section / Build a Set)

   These moved onto the drill hub when the /practice hub was removed. The
   panels themselves (SectionSelector, QuestionPicker) are written entirely
   against shadcn tokens, and this app&#x27;s token set is light-only — dropping
   them onto the hub&#x27;s dark observatory surface would render near-invisible
   grey-on-black. Rather than fork the shared components, re-declare the
   tokens to true-dark values for this subtree only, so the panels inherit a
   dark palette that matches the hero and practice bay above them.
   ───────────────────────────────────────────────────────────────────────── */
.drill-observatory-launcher-panel {
  --background: 240 6% 7%;
  --foreground: 40 20% 96%;
  --card: 240 6% 10%;
  --card-foreground: 40 20% 96%;
  --popover: 240 6% 9%;
  --popover-foreground: 40 20% 96%;
  --primary: 40 20% 96%;
  --primary-foreground: 240 6% 7%;
  --secondary: 240 5% 16%;
  --secondary-foreground: 40 20% 96%;
  --muted: 240 5% 15%;
  --muted-foreground: 40 8% 68%;
  --accent: 240 5% 18%;
  --accent-foreground: 40 20% 96%;
  --border: 0 0% 100% / 0.12;
  --input: 0 0% 100% / 0.14;
  --ring: 40 20% 80%;

  color: hsl(var(--foreground));
}


/* ─────────────────────────────────────────────────────────────────────────
   Messages stage

   Messages is reached from the rail&#x27;s Support group and must stay inside this
   frame — routing it out swapped the whole rail mid-navigation. Unlike the
   reading surfaces it is a chat: it needs the full height beside the rail, not
   the 720px centred column, so it gets its own stage and no section list.
   ───────────────────────────────────────────────────────────────────────── */
.classroom-root.classroom-root-messages {
  height: 100dvh;
  overflow: hidden;
}

.classroom-root .classroom-messages-stage {
  flex: 1 1 auto;
  height: 100dvh;
  min-width: 0;
  overflow: hidden;
}

@media (max-width: 1023px) {
  /* Clear the fixed menu button, the same way .classroom-column does. */
  .classroom-root .classroom-messages-stage {
    padding-top: 62px;
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   Teacher workspace stage

   The rail opens the workspace INTO this stage rather than navigating away
   from the classroom frame. The workspace draws its own room rail and header,
   so it needs the full height beside the classroom rail with no reading
   column and no section list — the same shape Messages uses.
   ───────────────────────────────────────────────────────────────────────── */
.classroom-root.classroom-root-workspace {
  height: 100dvh;
  overflow: hidden;
}

.classroom-root .classroom-workspace-stage {
  flex: 1 1 auto;
  height: 100dvh;
  min-width: 0;
  overflow: hidden;
}

@media (max-width: 1023px) {
  /* Clear the fixed menu button, the same way .classroom-column does. */
  .classroom-root .classroom-workspace-stage {
    padding-top: 62px;
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   Account stage

   Native classroom surfaces for the Profile and Customize-layout tabs. All
   controls are hand-styled on classroom tokens (no shadcn) so dark mode
   follows the classroom palette, not the broken global .dark variables.
   ───────────────────────────────────────────────────────────────────────── */
.classroom-root .classroom-account-grid {
  align-items: flex-start;
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(0, 1fr) 240px;
}

@media (max-width: 1023px) {
  .classroom-root .classroom-account-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .classroom-root .classroom-account-side {
    display: none;
  }
}

.classroom-root .classroom-account-main {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.classroom-root .classroom-account-card {
  background: var(--classroom-panel);
  border: 1px solid var(--classroom-line);
  border-radius: var(--classroom-radius);
  padding: 16px;
