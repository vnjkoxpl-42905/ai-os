.classroom-root .classroom-account-card-head {
  margin-bottom: 10px;
}

.classroom-root .classroom-account-card-head h2 {
  color: var(--classroom-meta-text);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  margin: 0;
  text-transform: uppercase;
}

.classroom-root .classroom-account-card-foot {
  border-top: 1px solid var(--classroom-line);
  margin-top: 12px;
  padding-top: 12px;
}

/* Identity */
.classroom-root .classroom-account-identity {
  align-items: flex-start;
  display: flex;
  gap: 14px;
}

.classroom-root .classroom-account-avatar {
  flex: 0 0 auto;
  font-size: 16px;
  height: 44px;
  width: 44px;
}

.classroom-root .classroom-account-identity-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.classroom-root .classroom-account-name {
  align-items: center;
  color: var(--classroom-ink);
  display: flex;
  font-size: 16px;
  font-weight: 600;
  gap: 6px;
}

.classroom-root .classroom-account-identity-copy &gt; small {
  color: var(--classroom-meta-text);
  font-size: 12.5px;
}

.classroom-root .classroom-account-identity-meta {
  color: var(--classroom-meta-text);
  display: flex;
  flex-wrap: wrap;
  font-size: 11.5px;
  gap: 4px 14px;
  margin-top: 8px;
}

.classroom-root .classroom-account-name-edit {
  align-items: center;
  display: flex;
  gap: 6px;
}

.classroom-root .classroom-account-name-edit input {
  background: var(--classroom-trigger);
  border: 1px solid var(--classroom-line-strong);
  border-radius: 7px;
  color: var(--classroom-ink);
  font-size: 14px;
  font-weight: 500;
  padding: 5px 9px;
  width: 220px;
}

.classroom-root .classroom-account-icon-button {
  align-items: center;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--classroom-meta-text);
  cursor: pointer;
  display: inline-flex;
  justify-content: center;
  padding: 4px;
}

.classroom-root .classroom-account-icon-button:hover {
  background: var(--classroom-hover);
  color: var(--classroom-ink);
}

/* Password */
.classroom-root .classroom-account-password {
  border-top: 1px solid var(--classroom-line);
  margin-top: 14px;
  padding-top: 12px;
}

.classroom-root .classroom-account-password-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 320px;
}

.classroom-root .classroom-account-password-form input {
  background: var(--classroom-trigger);
  border: 1px solid var(--classroom-line-strong);
  border-radius: 7px;
  color: var(--classroom-ink);
  font-size: 13px;
  padding: 7px 10px;
}

.classroom-root .classroom-account-password-actions {
  display: flex;
  gap: 8px;
}

/* Buttons */
.classroom-root .classroom-account-ghost-button {
  align-items: center;
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: 7px;
  color: var(--classroom-ink);
  cursor: pointer;
  display: inline-flex;
  font-size: 12px;
  font-weight: 500;
  gap: 6px;
  padding: 6px 11px;
}

.classroom-root .classroom-account-ghost-button:hover:not(:disabled) {
  background: var(--classroom-hover);
}

.classroom-root .classroom-account-ghost-button:disabled {
  cursor: default;
  opacity: 0.5;
}

.classroom-root .classroom-account-primary-button {
  align-items: center;
  background: var(--classroom-active);
  border: 1px solid var(--classroom-active);
  border-radius: 7px;
  color: var(--classroom-active-ink);
  cursor: pointer;
  display: inline-flex;
  font-size: 12px;
  font-weight: 600;
  gap: 6px;
  padding: 6px 12px;
}

.classroom-root .classroom-account-primary-button:disabled {
  cursor: default;
  opacity: 0.6;
}

/* Preference rows */
.classroom-root .classroom-account-pref-row {
  align-items: center;
  display: flex;
  gap: 16px;
  justify-content: space-between;
  padding: 9px 0;
}

.classroom-root .classroom-account-pref-row + .classroom-account-pref-row {
  border-top: 1px solid var(--classroom-line);
}

.classroom-root .classroom-account-pref-indent {
  opacity: 0.45;
  pointer-events: none;
}

.classroom-root .classroom-account-subgroup {
  border-left: 2px solid var(--classroom-line);
  margin-top: 2px;
  padding-left: 12px;
}

.classroom-root .classroom-account-subgroup .classroom-account-pref-indent {
  opacity: 1;
  pointer-events: auto;
}

.classroom-root .classroom-account-pref-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.classroom-root .classroom-account-pref-copy span {
  color: var(--classroom-ink);
  font-size: 13px;
}

.classroom-root .classroom-account-pref-copy small {
  color: var(--classroom-meta-text);
  font-size: 11.5px;
}

/* Toggle */
.classroom-root .classroom-toggle {
  background: var(--classroom-hover);
  border: 1px solid var(--classroom-line-strong);
  border-radius: 999px;
  cursor: pointer;
  flex: 0 0 auto;
  height: 22px;
  padding: 2px;
  transition: background var(--classroom-transition) ease;
  width: 38px;
}

/* The knob is how the switch shows its state, which 1.4.11 covers as well as
   the control edge. Off, it is a white knob on a near-white track, so the
   border was the only thing locating it and the old hairline measured 1.25:1.
   The on state overrides this with --classroom-active and is unaffected. */
.classroom-root .classroom-toggle i {
  background: var(--classroom-panel);
  border: 1px solid var(--classroom-line-on-tint);
  border-radius: 999px;
  display: block;
  height: 16px;
  transform: translateX(0);
  transition: transform 200ms ease;
  width: 16px;
}

.classroom-root .classroom-toggle-on {
  background: var(--classroom-toggle-on-track);
  border-color: var(--classroom-toggle-on-track);
}

.classroom-root .classroom-toggle-on i {
  border-color: var(--classroom-toggle-on-track);
  transform: translateX(16px);
}

.classroom-root .classroom-toggle:disabled {
  cursor: default;
  opacity: 0.5;
}

/* Select + number input */
.classroom-root .classroom-account-select,
.classroom-root .classroom-account-number {
  background: var(--classroom-trigger);
  border: 1px solid var(--classroom-line-strong);
  border-radius: 7px;
  color: var(--classroom-ink);
  flex: 0 0 auto;
  font-size: 12.5px;
  padding: 6px 9px;
}

.classroom-root .classroom-account-number {
  text-align: right;
  width: 76px;
}

/* Layout editor */
.classroom-root .classroom-account-toolbar {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  justify-content: space-between;
}

.classroom-root .classroom-account-toolbar p {
  color: var(--classroom-meta-text);
  font-size: 12.5px;
  margin: 0;
}

.classroom-root .classroom-account-toolbar-actions {
  align-items: center;
  display: flex;
  gap: 10px;
}

.classroom-root .classroom-account-savestate {
  align-items: center;
  color: var(--classroom-meta-text);
  display: inline-flex;
  font-size: 11.5px;
  gap: 5px;
  opacity: 0;
  transition: opacity 200ms ease;
}

.classroom-root .classroom-account-savestate-visible {
  opacity: 1;
}

.classroom-root .classroom-account-rows {
  list-style: none;
  margin: 0;
  padding: 0;
}

.classroom-root .classroom-account-row {
  align-items: center;
  display: flex;
  gap: 10px;
  padding: 7px 0;
}

.classroom-root .classroom-account-row + .classroom-account-row {
  border-top: 1px solid var(--classroom-line);
}

.classroom-root .classroom-account-row-arrows {
  display: flex;
  flex-direction: column;
}

.classroom-root .classroom-account-row-arrows button {
  background: transparent;
  border: 0;
  border-radius: 4px;
  color: var(--classroom-meta-text);
  cursor: pointer;
  display: flex;
  padding: 0 2px;
}

.classroom-root .classroom-account-row-arrows button:hover:not(:disabled) {
  color: var(--classroom-ink);
}

.classroom-root .classroom-account-row-arrows button:disabled {
  cursor: default;
  opacity: 0.3;
}

.classroom-root .classroom-account-row-label {
  align-items: center;
  color: var(--classroom-ink);
  display: flex;
  flex: 1 1 auto;
  font-size: 13px;
  gap: 7px;
  min-width: 0;
}

.classroom-root .classroom-account-row-hidden {
  opacity: 0.45;
  text-decoration: line-through;
  text-decoration-color: var(--classroom-dash);
}

.classroom-root .classroom-account-row-lock {
  color: var(--classroom-meta-text);
  flex: 0 0 auto;
}

.classroom-root .classroom-account-row-note {
  color: var(--classroom-meta-text);
  font-size: 11px;
}

.classroom-root .classroom-account-eye {
  align-items: center;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--classroom-meta-text);
  cursor: pointer;
  display: inline-flex;
  padding: 5px;
}

.classroom-root .classroom-account-eye:hover:not(:disabled) {
  background: var(--classroom-hover);
  color: var(--classroom-ink);
}

/* Preview rail */
.classroom-root .classroom-account-preview-rail {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.classroom-root .classroom-account-preview-rail .classroom-nav {
  cursor: default;
}

.classroom-root .classroom-account-preview-note {
  border-top: 1px solid var(--classroom-line);
  color: var(--classroom-meta-text);
  font-size: 11px;
  line-height: 1.5;
  margin: 12px 0 0;
  padding-top: 10px;
}

/* Confirm dialog (in-tree, classroom tokens) */
.classroom-root .classroom-account-dialog-veil {
  align-items: center;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  inset: 0;
  justify-content: center;
  padding: 24px;
  position: fixed;
  z-index: 60;
}

.classroom-root .classroom-account-dialog {
  background: var(--classroom-panel);
  border: 1px solid var(--classroom-line);
  border-radius: var(--classroom-radius);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
  max-width: 380px;
  padding: 18px;
  width: 100%;
}

.classroom-root .classroom-account-dialog h3 {
  color: var(--classroom-ink);
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 6px;
}

.classroom-root .classroom-account-dialog p {
  color: var(--classroom-meta-text);
  font-size: 12.5px;
  line-height: 1.5;
  margin: 0 0 14px;
}

.classroom-root .classroom-account-dialog-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* Spinner */
.classroom-root .classroom-spin {
  animation: classroom-spin 0.9s linear infinite;
}

@keyframes classroom-spin {
  to {
    transform: rotate(360deg);
  }
}

.classroom-root .classroom-account-single {
  max-width: 640px;
}

/* ── Orientation card ───────────────────────────────────────────────────────
   The setup walkthrough, first thing on Home until it is finished. It stays a
   card the student has to open: the steps expand in place, they never take
   over the screen, and the card is gone once the gate is set. */

.classroom-root .classroom-orientation {
  border: 1px solid var(--classroom-line);
  border-radius: 14px;
  margin-bottom: 16px;
  padding: 18px;
}

.classroom-root .classroom-orientation .classroom-button {
  align-items: center;
  display: inline-flex;
  gap: 6px;
  white-space: nowrap;
}

/* A required step with no answer yet: Continue has to look as dead as it is. */
.classroom-root .classroom-orientation .classroom-button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

/* Collapsed: the invitation */
.classroom-root .classroom-orientation-intro {
  align-items: flex-end;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: space-between;
}

.classroom-root .classroom-orientation-intro-text {
  flex: 1 1 260px;
  min-width: 0;
}

.classroom-root .classroom-orientation-eyebrow {
  color: var(--classroom-link);
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.classroom-root .classroom-orientation h2 {
  font-family: &quot;Fraunces&quot;, Georgia, ui-serif, serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}

.classroom-root .classroom-orientation-intro-text p {
  color: var(--classroom-meta-text);
  font-size: 13.5px;
  line-height: 1.55;
  margin: 0;
  max-width: 46ch;
}

.classroom-root .classroom-orientation-intro-action {
  align-items: flex-end;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.classroom-root .classroom-orientation-tally {
  color: var(--classroom-meta-text);
  font-size: 12.5px;
  opacity: 0.85;
  white-space: nowrap;
}

/* Open: header, progress, one step */
.classroom-root .classroom-orientation-header {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.classroom-root .classroom-orientation-header .classroom-orientation-tally {
  margin-left: auto;
}

.classroom-root .classroom-orientation-progress {
  background: var(--classroom-hover);
  border-radius: 999px;
  height: 3px;
  margin: 12px 0 20px;
  overflow: hidden;
}

.classroom-root .classroom-orientation-progress span {
  background: var(--classroom-link);
  display: block;
  height: 100%;
  transition: width var(--classroom-transition) ease;
}

.classroom-root .classroom-orientation-step h3 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}

.classroom-root .classroom-orientation-sub {
  color: var(--classroom-meta-text);
  font-size: 13px;
  line-height: 1.5;
  margin: 0 0 16px;
  max-width: 52ch;
}

.classroom-root .classroom-orientation-hint {
  color: var(--classroom-meta-text);
  font-size: 12px;
  margin: 8px 0 10px;
}

/* Inputs */
.classroom-root .classroom-orientation-input {
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: var(--classroom-radius);
  color: inherit;
  font-family: inherit;
  font-size: 14px;
  padding: 10px 12px;
  width: 100%;
}

.classroom-root .classroom-orientation-input:focus-visible {
  outline: 2px solid var(--classroom-ink);
  outline-offset: 2px;
}

.classroom-root .classroom-orientation-textarea {
  line-height: 1.55;
  resize: vertical;
}

.classroom-root .classroom-orientation-date {
  max-width: 220px;
}

.classroom-root .classroom-orientation-search {
  align-items: center;
  display: flex;
  gap: 8px;
}

.classroom-root .classroom-orientation-search svg {
  color: var(--classroom-meta-text);
  flex: 0 0 auto;
}

/* The visible way to add. Sits with the field so the pair reads as one
   control: type a name, press Add. */
.classroom-root .classroom-orientation-add {
  align-items: center;
  background: var(--classroom-active);
  border: 1px solid var(--classroom-active);
  border-radius: 8px;
  color: var(--classroom-active-ink);
  cursor: pointer;
  display: inline-flex;
  flex: 0 0 auto;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  gap: 5px;
  padding: 9px 14px;
  transition: opacity var(--classroom-transition) ease;
}

.classroom-root .classroom-orientation-add:disabled {
  cursor: not-allowed;
  opacity: 0.35;
}

/* Chips */
.classroom-root .classroom-orientation-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.classroom-root .classroom-orientation-chip {
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: 999px;
  color: inherit;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  transition:
    background-color var(--classroom-transition) ease,
    border-color var(--classroom-transition) ease;
}

.classroom-root .classroom-orientation-chip:hover {
  background: var(--classroom-hover);
}

/* A sitting chip carries its window under the month, so &quot;November 2026&quot; and
   &quot;Nov 11-14&quot; read as one choice rather than two lines of chrome. */
.classroom-root .classroom-orientation-chip:has(.classroom-orientation-chip-note) {
  display: inline-flex;
  flex-direction: column;
  gap: 2px;
  line-height: 1.25;
  padding: 8px 16px;
  text-align: center;
}

.classroom-root .classroom-orientation-chip-note {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.6;
}

/* School typeahead: the matches sit directly under the field as a short list
   the student picks from, rather than a dropdown that covers the step. */
.classroom-root .classroom-orientation-suggestions {
  border: 1px solid var(--classroom-line);
  border-radius: 10px;
  list-style: none;
  margin: 8px 0 0;
  overflow: hidden;
  padding: 0;
}

.classroom-root .classroom-orientation-suggestions li + li {
  border-top: 1px solid var(--classroom-line);
}

.classroom-root .classroom-orientation-suggestions button {
  align-items: center;
  background: transparent;
  border: 0;
  color: inherit;
  cursor: pointer;
  display: flex;
  font-family: inherit;
  font-size: 13.5px;
  gap: 10px;
  padding: 9px 12px;
  text-align: left;
  width: 100%;
}

.classroom-root .classroom-orientation-suggestions button:hover {
  background: var(--classroom-hover);
}

.classroom-root .classroom-orientation-suggestion-name {
  flex: 1 1 auto;
  min-width: 0;
}

.classroom-root .classroom-orientation-suggestion-region {
  color: var(--classroom-meta-text);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

/* Selected has to outrank hover, or the chip under the cursor reads unpicked. */
.classroom-root .classroom-orientation-chip-on,
.classroom-root .classroom-orientation-chip-on:hover {
  background: var(--classroom-active);
  border-color: var(--classroom-active);
  color: var(--classroom-active-ink);
}

/* Added-school rows */
.classroom-root .classroom-orientation-list {
  display: grid;
  gap: 6px;
}

.classroom-root .classroom-orientation-list-row {
  align-items: center;
  border: 1px solid var(--classroom-line);
  border-radius: var(--classroom-radius);
  display: flex;
  gap: 10px;
  padding: 8px 12px;
}

.classroom-root .classroom-orientation-list-index {
  color: var(--classroom-meta-text);
  font-size: 12px;
}

.classroom-root .classroom-orientation-list-label {
  flex: 1 1 auto;
  font-size: 13.5px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.classroom-root .classroom-orientation-list-row button {
  background: none;
  border: none;
  color: var(--classroom-meta-text);
  cursor: pointer;
  display: flex;
  padding: 2px;
}

.classroom-root .classroom-orientation-list-row button:hover {
  color: var(--classroom-ink);
}

/* Life-stage cards */
.classroom-root .classroom-orientation-cards {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 12px;
}

.classroom-root .classroom-orientation-choice {
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: 12px;
  cursor: pointer;
  display: grid;
  gap: 3px;
  padding: 14px;
  text-align: left;
  transition: border-color var(--classroom-transition) ease;
}

.classroom-root .classroom-orientation-choice:hover {
  border-color: var(--classroom-link);
}

.classroom-root .classroom-orientation-choice-on,
.classroom-root .classroom-orientation-choice-on:hover {
  border-color: var(--classroom-active);
  box-shadow: inset 0 0 0 1px var(--classroom-active);
}

.classroom-root .classroom-orientation-choice-title {
  font-size: 14px;
  font-weight: 600;
}

.classroom-root .classroom-orientation-choice-desc {
  color: var(--classroom-meta-text);
  font-size: 12px;
  line-height: 1.45;
}

/* Weekly study time */
.classroom-root .classroom-availability {
  margin-top: 16px;
}

.classroom-root .classroom-availability-note {
  align-items: flex-start;
  background: color-mix(in srgb, var(--classroom-link) 7%, transparent);
  border-radius: 12px;
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  padding: 11px 13px;
}

.classroom-root .classroom-availability-note svg {
  color: var(--classroom-link);
  flex: 0 0 auto;
  margin-top: 2px;
}

.classroom-root .classroom-availability-note div {
  display: grid;
  gap: 2px;
}

.classroom-root .classroom-availability-note strong {
  font-size: 13px;
  font-weight: 650;
}

.classroom-root .classroom-availability-note span {
  color: var(--classroom-meta-text);
  font-size: 12px;
  line-height: 1.45;
}

.classroom-root .classroom-orientation-week {
  display: grid;
  gap: 8px;
  grid-template-columns: 58px repeat(7, minmax(0, 1fr));
}

/* Reads against the bar segments, so a filled height has units. */
.classroom-root .classroom-orientation-scale {
  color: var(--classroom-ink);
  display: flex;
  flex-direction: column;
  font-size: 11.5px;
  font-weight: 650;
  gap: 3px;
  height: 104px;
  letter-spacing: -0.01em;
  text-align: right;
}

.classroom-root .classroom-orientation-scale span {
  align-items: center;
  display: flex;
  flex: 1 1 0;
  justify-content: flex-end;
}

/* &quot;No time&quot; is the floor of the chart, matching the short segment it labels. */
.classroom-root .classroom-orientation-scale span:last-child {
  flex: 0 0 16px;
}

.classroom-root .classroom-orientation-day {
  border: 1px solid var(--classroom-line);
  border-radius: 12px;
  display: grid;
  gap: 10px;
  min-width: 0;
  padding: 11px 8px 8px;
  transition:
    background-color var(--classroom-transition) ease,
    border-color var(--classroom-transition) ease,
    transform var(--classroom-transition) ease;
}

.classroom-root .classroom-orientation-day-on {
  background: color-mix(in srgb, var(--classroom-link) 6%, transparent);
  border-color: color-mix(in srgb, var(--classroom-link) 55%, var(--classroom-line));
  transform: translateY(-2px);
}

.classroom-root .classroom-orientation-day-head {
  display: grid;
  gap: 2px;
  text-align: center;
}

.classroom-root .classroom-orientation-day-label {
  font-size: 13px;
  font-weight: 650;
}

.classroom-root .classroom-orientation-day-value {
  color: var(--classroom-meta-text);
  font-size: 10.5px;
  min-height: 16px;
}

/* The clickable bar. Four segments per day, tallest at the top: the student
   clicks the height they can protect, and the filled part is the answer. The
   picture and the control are the same object. */
.classroom-root .classroom-orientation-bar {
  display: flex;
  flex-direction: column;
  gap: 3px;
  height: 104px;
}

.classroom-root .classroom-orientation-segment {
  align-items: center;
  background: var(--classroom-hover);
  border: 1px solid transparent;
  border-radius: 5px;
  color: inherit;
  cursor: pointer;
  display: flex;
  flex: 1 1 0;
  justify-content: center;
  min-height: 0;
  padding: 0;
  transition:
    background-color var(--classroom-transition) ease,
    border-color var(--classroom-transition) ease;
}

.classroom-root .classroom-orientation-segment:hover {
  border-color: color-mix(in srgb, var(--classroom-link) 60%, transparent);
}

/* &quot;No time&quot; is a floor, not a quantity: it stays a thin base the student can
   press deliberately rather than a quarter of the bar they seem to have filled. */
.classroom-root .classroom-orientation-segment-off {
  flex: 0 0 16px;
}

/* The bar has to read as a bar across the room, so the fill carries the
   classroom accent at real strength rather than a tint that disappears
   against the warm ground. */
.classroom-root .classroom-orientation-segment-filled {
  background: color-mix(in srgb, var(--classroom-link) 55%, transparent);
}

/* The chosen height is the top of the bar: full accent, so the eye lands on
   where the week actually stops. */
.classroom-root .classroom-orientation-segment-on {
  background: var(--classroom-link);
  border-color: var(--classroom-link);
  color: #ffffff;
}

/* A day marked as no time is a deliberate answer, not an empty one, but it is
   not study time either: it reads as a dark floor rather than more bar. */
.classroom-root .classroom-orientation-segment-off.classroom-orientation-segment-on {
  background: var(--classroom-active);
  border-color: var(--classroom-active);
}

.classroom-root .classroom-availability-summary {
  color: var(--classroom-ink);
  font-size: 12.5px;
  margin: 12px 0 0;
  text-align: right;
}

.classroom-root .classroom-availability-summary strong {
  font-size: 15px;
}

.classroom-root .classroom-availability-summary-empty {
  color: var(--classroom-meta-text);
}

/* Nav row */
.classroom-root .classroom-orientation-nav {
  align-items: center;
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.classroom-root .classroom-orientation-nav-spacer {
  flex: 1 1 auto;
}

.classroom-root .classroom-orientation-back {
  align-items: center;
  background: none;
  border: none;
  color: var(--classroom-meta-text);
  cursor: pointer;
  display: inline-flex;
  font-family: inherit;
  font-size: 12.5px;
  gap: 6px;
  padding: 8px 2px;
}

.classroom-root .classroom-orientation-back:hover {
  color: var(--classroom-ink);
}

/* Finished, for the rest of the session */
.classroom-root .classroom-orientation-done {
  align-items: flex-start;
  display: flex;
  gap: 12px;
}

.classroom-root .classroom-orientation-done-mark {
  align-items: center;
  background: var(--classroom-active);
  border-radius: 999px;
  color: var(--classroom-active-ink);
  display: flex;
  flex: 0 0 auto;
  height: 26px;
  justify-content: center;
  width: 26px;
}

.classroom-root .classroom-orientation-done p {
  color: var(--classroom-meta-text);
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
  max-width: 46ch;
}

@media (max-width: 640px) {
  .classroom-root .classroom-orientation-cards {
    grid-template-columns: minmax(0, 1fr);
  }

  .classroom-root .classroom-orientation-intro-action {
    align-items: stretch;
    width: 100%;
  }

  .classroom-root .classroom-orientation-day {
    grid-template-columns: 58px 1fr;
    padding: 10px;
  }

  .classroom-root .classroom-orientation-week {
    grid-template-columns: minmax(0, 1fr);
  }

  .classroom-root .classroom-orientation-day-head {
    align-self: center;
    text-align: left;
  }

  /* One day per row on a phone: the label leads and the bar lies on its side,
     so the same four targets stay thumb-sized instead of a stack seven tall. */
  .classroom-root .classroom-orientation-scale {
    display: none;
  }

  .classroom-root .classroom-orientation-day-head {
    order: 0;
  }

  .classroom-root .classroom-orientation-bar {
    flex-direction: row-reverse;
    height: 44px;
    order: 1;
  }

  .classroom-root .classroom-orientation-segment-off {
    flex: 0 0 34px;
  }

  .classroom-root .classroom-availability-summary {
    text-align: left;
  }
}

/* ── Account: &quot;Your prep&quot; (the orientation card&#x27;s answers, editable) ────────
   One row per answer, reading back what the student told us, expanding into
   the card&#x27;s own input when they change it. */

.classroom-root .classroom-account-card-note {
  color: var(--classroom-meta-text);
  font-size: 12px;
  line-height: 1.5;
  margin: -4px 0 10px;
  max-width: 52ch;
}

.classroom-root .classroom-account-prep-row {
  padding: 9px 0;
}

.classroom-root .classroom-account-prep-row + .classroom-account-prep-row {
  border-top: 1px solid var(--classroom-line);
}

.classroom-root .classroom-account-prep-head {
  align-items: center;
  display: flex;
  gap: 16px;
  justify-content: space-between;
}

/* A long free-text answer or a school list must not stretch the row. */
.classroom-root .classroom-account-prep-head .classroom-account-pref-copy small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.classroom-root .classroom-account-prep-empty {
  font-style: italic;
  opacity: 0.7;
}

.classroom-root .classroom-account-prep-edit {
  padding: 12px 0 4px;
}

.classroom-root .classroom-account-prep-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

/* --------------------------------------------------------------------------
   Stage-side index list (H5)

   The section list column is hidden below 1280px, and below 1400px for Wrong
   answers, where it collapses behind a trigger. At those widths the index
   routes were telling the student to choose from a list that was not on
   screen. Both copies render; these rules show exactly one.
   -------------------------------------------------------------------------- */

.classroom-root .classroom-stage-index {
  display: none;
  gap: 4px;
  margin: 0 -8px;
}

@media (max-width: 1279px) {
  .classroom-root .classroom-stage-index {
    display: grid;
  }

  .classroom-root .classroom-stage-index-hint {
    display: none;
  }
}

/* Wrong answers keeps its column 120px longer than the rest, so it swaps over
   at its own breakpoint rather than the shared one. */
@media (max-width: 1399px) {
  .classroom-root.classroom-root-journal .classroom-stage-index {
    display: grid;
  }

  .classroom-root.classroom-root-journal .classroom-stage-index-hint {
    display: none;
  }
}

/* ---- Unread notes -------------------------------------------------------
   A note is unread until it is opened (classroom_items.status === &#x27;assigned&#x27;).
   Two markers, both quiet: a dot on the row, and a count beside the panel
   title. Colour alone never carries the state — the dot has a size and a
   position, the count has a number, and both rows also carry an sr-only
   &quot;(unread)&quot; so this is not a colour-only signal. */

.classroom-unread-dot {
  display: inline-block;
  width: 0.45rem;
  height: 0.45rem;
  margin-right: 0.45rem;
  border-radius: 50%;
  background: var(--classroom-accent, currentColor);
  vertical-align: middle;
  flex: 0 0 auto;
}

.classroom-unread-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.25rem;
  height: 1.25rem;
  margin-left: 0.5rem;
  padding: 0 0.35rem;
  border-radius: 999px;
  background: var(--classroom-accent, currentColor);
  color: var(--classroom-surface, #fff);
  font-size: 0.6875rem;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  vertical-align: middle;
}

/* Group label above a list, used when Notes and recaps splits unread from
   read. Only rendered when there is more than one list on the page. */
.classroom-stage-index-heading {
  margin: 1.4rem 0 0.5rem;
  font-size: 0.6875rem;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.55;
}
.classroom-stage-index-heading:first-child {
  margin-top: 0;
}


/* ── Admissions ─────────────────────────────────────────────────────────────
   The 509 numbers for every accredited school, and where the student&#x27;s own
   score sits against each class. A table, deliberately: the student is
   comparing rows, and anything prettier would make that harder. */

.classroom-root .classroom-admissions-head {
  align-items: flex-end;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: space-between;
  margin-bottom: 16px;
}

.classroom-root .classroom-admissions-head h1 {
  font-family: &quot;Fraunces&quot;, Georgia, ui-serif, serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}

.classroom-root .classroom-admissions-head p {
  color: var(--classroom-meta-text);
  font-size: 13.5px;
  line-height: 1.6;
  margin: 0;
  max-width: 68ch;
}

.classroom-root .classroom-admissions-score {
  white-space: nowrap;
}

.classroom-root .classroom-admissions-score strong {
  color: var(--classroom-ink);
  font-size: 17px;
}

.classroom-root .classroom-admissions-section {
  align-items: center;
  display: flex;
  font-size: 11px;
  font-weight: 650;
  gap: 6px;
  letter-spacing: 0.12em;
  margin: 22px 0 8px;
  text-transform: uppercase;
}

/* The table scrolls inside its own box: seven columns will not fit a phone,
   and the page itself must never scroll sideways. */
.classroom-root .classroom-admissions-scroll {
  border: 1px solid var(--classroom-line);
  border-radius: 12px;
  overflow-x: auto;
}

.classroom-root .classroom-admissions-table {
  border-collapse: collapse;
  font-size: 13px;
  min-width: 620px;
  width: 100%;
}

.classroom-root .classroom-admissions-table th,
.classroom-root .classroom-admissions-table td {
  padding: 9px 12px;
  text-align: left;
}

.classroom-root .classroom-admissions-table thead th {
  border-bottom: 1px solid var(--classroom-line);
  color: var(--classroom-meta-text);
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.08em;
  position: sticky;
  text-transform: uppercase;
  top: 0;
}

.classroom-root .classroom-admissions-table tbody tr + tr th,
.classroom-root .classroom-admissions-table tbody tr + tr td {
  border-top: 1px solid color-mix(in srgb, var(--classroom-line) 60%, transparent);
}

.classroom-root .classroom-admissions-table tbody tr:hover {
  background: var(--classroom-hover);
}

.classroom-root .classroom-admissions-name {
  display: block;
  font-weight: 600;
}

.classroom-root .classroom-admissions-state {
  color: var(--classroom-meta-text);
  font-size: 11.5px;
}

.classroom-root .classroom-admissions-num {
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.classroom-root .classroom-admissions-median {
  font-weight: 700;
}

.classroom-root .classroom-admissions-band {
  border-radius: 999px;
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  white-space: nowrap;
}

.classroom-root .admissions-band-strong {
  background: color-mix(in srgb, #2f7d4f 14%, transparent);
  color: #24623d;
}

.classroom-root .admissions-band-mid {
  background: color-mix(in srgb, var(--classroom-link) 16%, transparent);
  color: #9a4f04;
}

.classroom-root .admissions-band-low {
  background: var(--classroom-hover);
  color: var(--classroom-meta-text);
}

.classroom-root .classroom-admissions-empty {
  color: var(--classroom-meta-text);
  font-size: 13.5px;
}


/* The finish line offers the session first and the classroom second. */
.classroom-root .classroom-orientation-done-actions {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.classroom-root .classroom-orientation-continue-quiet {
  background: transparent;
  border: 1px solid var(--classroom-line-strong);
  border-radius: 999px;
  color: var(--classroom-meta-text);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 16px;
}

.classroom-root .classroom-orientation-continue-quiet:hover {
  background: var(--classroom-hover);
  color: var(--classroom-ink);
}


/* &quot;Start my setup again&quot; sits below the editable rows, quiet and separated:
   it is a real reset, not another row to tweak. */
.classroom-root .classroom-account-prep-reset {
  border-top: 1px solid var(--classroom-line);
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 14px;
  padding-top: 14px;
}

.classroom-root .classroom-account-prep-reset button {
  align-self: flex-start;
}

.classroom-root .classroom-account-prep-reset small {
  color: var(--classroom-meta-text);
  font-size: 11.5px;
  line-height: 1.5;
}

/* ── Section briefing ──────────────────────────────────────────────────────
   The screen between Home and a timed section. It covers the stage instead of
   navigating, so Home is still underneath and &quot;Not now&quot; costs nothing.
   Everything here reads off the classroom tokens, so it follows the theme. */
.section-briefing {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: clamp(1.5rem, 6vw, 5rem) clamp(1.25rem, 6vw, 4rem);
  background: var(--classroom-page);
  animation: section-briefing-in 320ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
}

.section-briefing-inner {
  width: 100%;
  max-width: 46rem;
  margin: auto;
}

.section-briefing-eyebrow {
  display: block;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--classroom-link-text);
}

.section-briefing-head h1 {
  margin: 0.9rem 0 0;
  font-size: clamp(2.25rem, 7vw, 3.75rem);
  line-height: 1.02;
  letter-spacing: -0.022em;
  color: var(--classroom-ink);
}

.section-briefing-lede {
  margin: 1rem 0 0;
  max-width: 34rem;
  font-size: clamp(1rem, 2.4vw, 1.125rem);
  line-height: 1.6;
  color: var(--classroom-meta-text);
}

.section-briefing-cols {
  display: grid;
  gap: clamp(1.75rem, 5vw, 3rem);
  margin-top: clamp(2.25rem, 6vw, 3.25rem);
  padding-top: clamp(2.25rem, 6vw, 3.25rem);
  border-top: 1px solid var(--classroom-line);
}

@media (min-width: 46rem) {
  .section-briefing-cols {
    grid-template-columns: 1fr 1fr;
  }
}

.section-briefing-cols h2 {
  margin: 0 0 1rem;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--classroom-meta-text);
}

.section-briefing-cols ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 0.85rem;
}

.section-briefing-cols li {
  position: relative;
  padding-left: 1.1rem;
  font-size: 0.9375rem;
  line-height: 1.55;
  color: var(--classroom-ink-body);
}

.section-briefing-cols li::before {
  content: &quot;&quot;;
  position: absolute;
  left: 0;
  top: 0.62em;
  width: 5px;
  height: 1px;
  background: var(--classroom-link-text);
}

.section-briefing-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1.5rem;
  margin-top: clamp(2.25rem, 6vw, 3.25rem);
}

.section-briefing-start {
  padding: 0.95rem 2.75rem;
  border: 0;
  border-radius: 999px;
  background: var(--classroom-link-text);
  color: #fff;
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 160ms ease, filter 160ms ease;
}

.section-briefing-start:hover {
  filter: brightness(1.06);
  transform: translateY(-1px);
}

.section-briefing-start:focus-visible {
  outline: 2px solid var(--classroom-ink);
  outline-offset: 3px;
}

.section-briefing-later {
  border: 0;
  background: none;
  padding: 0;
  font-size: 0.875rem;
  color: var(--classroom-meta-text);
  cursor: pointer;
  text-underline-offset: 4px;
}

.section-briefing-later:hover {
  color: var(--classroom-ink);
  text-decoration: underline;
}

@keyframes section-briefing-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .section-briefing { animation-duration: 1ms; }
  .section-briefing-start { transition: none; }
}

/* ── Touch targets ─────────────────────────────────────────────────────────
   `.classroom-nav` computes to 34px, and the same class draws the mobile
   drawer, where it is a genuine touch target rather than a mouse one. So the
   44px floor is applied where a finger is doing the pointing.

   This is not a deviation, despite an earlier note here that said it was.
   PRODUCT.md&#x27;s binding floor is WCAG 2.1 AA. The 44x44 figure is 2.5.5, which
   is Level AAA; the AA target-size rule is 2.2&#x27;s 2.5.8, and it asks 24x24. A
   34px row clears the binding floor by ten pixels. Applying 44px globally would
   add ~170px of height to a 17-row rail to satisfy a criterion the product has
   not adopted.

   PRODUCT.md line 104 lists the AAA number inside its AA section. That is worth
   correcting in the doc; it is not a defect in this file. */
@media (pointer: coarse) {
  .classroom-root .classroom-nav,
  .classroom-root .classroom-profile-menu-item {
    min-height: 44px;
  }
}

.classroom-root .classroom-mobile-menu .classroom-nav {
  min-height: 44px;
}

/* ── The Notes and recaps landing ──────────────────────────────────────────
   The stage carried a dateline, an &lt;h1&gt; and a one-line count into a 720px
   column, so the widest region of the page held the least information. These
   rules dress the lede and the featured note that now fill it.

   No card. The stage has no container around it, and wrapping the only content
   on the page in a border would be a box for its own sake. Hierarchy comes from
   size, weight and space, and separation from a single hairline. */
.classroom-root .classroom-surface-lede {
  color: var(--classroom-meta-text);
  font-size: 15px;
  line-height: 1.6;
  margin: -8px 0 32px;
  max-width: 52ch;
}

.classroom-root .classroom-featured-note {
  border-top: 1px solid var(--classroom-line);
  margin-bottom: 40px;
  padding-top: 24px;
}

.classroom-root .classroom-featured-note-meta {
  color: var(--classroom-meta-text);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  margin: 0 0 8px;
  text-transform: uppercase;
}

.classroom-root .classroom-featured-note-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.25;
  margin: 0 0 12px;
  max-width: 34ch;
}

.classroom-root .classroom-featured-note-excerpt {
  color: var(--classroom-ink-body);
  font-size: 16px;
  line-height: 1.65;
  margin: 0 0 20px;
  max-width: 56ch;
}

/* A note&#x27;s own standfirst is authored content. It used to inherit
   .classroom-empty-copy, the class that means &quot;there is nothing here&quot;. */
.classroom-root .classroom-note-standfirst {
  color: var(--classroom-ink-body);
  font-size: 17px;
  line-height: 1.6;
  margin: 0 0 24px;
  max-width: 56ch;
}

&lt;div class=&quot;quantity-progress&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;classroom-root&quot;&gt;
  &lt;main class=&quot;classroom-stage&quot;&gt;&lt;div class=&quot;classroom-column&quot;&gt;
    &lt;div class=&quot;classroom-dateline&quot;&gt;&lt;time&gt;September 29, 2026&lt;/time&gt;&lt;span&gt;|&lt;/span&gt;&lt;span&gt;Note&lt;/span&gt;&lt;/div&gt;
    &lt;h1 class=&quot;classroom-title&quot;&gt;Some, Most, and All&lt;/h1&gt;
    &lt;article class=&quot;classroom-prose quantity-note&quot;&gt;&lt;header class=&quot;quantity-opening&quot;&gt;
  &lt;div class=&quot;quantity-opening-story&quot;&gt;
  &lt;p class=&quot;quantity-lead&quot;&gt;Quantity statements tell us whether a claim applies to some members of a group, most of them, or all of them.&lt;/p&gt;
  &lt;p class=&quot;quantity-scenario&quot;&gt;Suppose a class has been assigned a case to read. These are three different claims about that same class:&lt;/p&gt;
  &lt;div class=&quot;quantity-claims&quot; aria-label=&quot;Three claims about the same class&quot;&gt;
    &lt;div class=&quot;quantity-claim&quot;&gt;&lt;b&gt;Some&lt;/b&gt;&lt;span&gt;students read it.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-claim&quot;&gt;&lt;b&gt;Most&lt;/b&gt;&lt;span&gt;students read it.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-claim&quot;&gt;&lt;b&gt;All&lt;/b&gt;&lt;span&gt;students read it.&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;quantity-scenario&quot;&gt;We do not need an exact headcount to understand the difference.&lt;/p&gt;
  &lt;div class=&quot;quantity-opening-question&quot;&gt;&lt;p&gt;What must be true?&lt;/p&gt;&lt;p&gt;What could still be true?&lt;/p&gt;&lt;small&gt;The answer changes with the word we use.&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quantity-lab&quot; aria-label=&quot;Explore quantity statements with eight books&quot;&gt;
    &lt;div class=&quot;quantity-lab-head&quot;&gt;&lt;span class=&quot;quantity-lab-kicker&quot;&gt;A little experiment&lt;/span&gt;&lt;span class=&quot;quantity-lab-count&quot; aria-live=&quot;polite&quot;&gt;&lt;b id=&quot;quantity-count&quot;&gt;1&lt;/b&gt; of 8 books are hardcover&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-lab-books&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;quantity-lab-book is-hardcover&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span class=&quot;quantity-lab-book&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;label class=&quot;quantity-lab-instruction&quot; for=&quot;quantity-slider&quot;&gt;Move the count. Watch which statements become true.&lt;/label&gt;
    &lt;input id=&quot;quantity-slider&quot; class=&quot;quantity-lab-slider&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;8&quot; value=&quot;1&quot; aria-label=&quot;Number of hardcover books&quot;&gt;
    &lt;div class=&quot;quantity-lab-verdicts&quot; aria-live=&quot;polite&quot;&gt;&lt;span data-rule=&quot;some&quot; class=&quot;is-true&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;b&gt;Some&lt;/b&gt;&lt;small&gt;1–8&lt;/small&gt;&lt;/span&gt;&lt;span data-rule=&quot;most&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;b&gt;Most&lt;/b&gt;&lt;small&gt;5–8&lt;/small&gt;&lt;/span&gt;&lt;span data-rule=&quot;all&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;b&gt;All&lt;/b&gt;&lt;small&gt;8&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/header&gt;
&lt;nav class=&quot;quantity-jump&quot; aria-label=&quot;Jump through the lesson&quot;&gt;&lt;a href=&quot;#some&quot;&gt;Some&lt;/a&gt;&lt;a href=&quot;#most&quot;&gt;Most&lt;/a&gt;&lt;a href=&quot;#all&quot;&gt;All&lt;/a&gt;&lt;a href=&quot;#inferences&quot;&gt;Inferences&lt;/a&gt;&lt;a href=&quot;#quantity-quiz&quot;&gt;Practice&lt;/a&gt;&lt;a href=&quot;#drill&quot;&gt;Drill&lt;/a&gt;&lt;/nav&gt;&lt;h2 id=&quot;some&quot; class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;01&lt;/span&gt;Some guarantees at least one&lt;/h2&gt;
&lt;p&gt;Imagine a shelf with eight books. I tell you that &lt;strong&gt;some of the books are hardcover&lt;/strong&gt;. How many hardcover books must there be?&lt;/p&gt;
&lt;p&gt;At least &lt;strong&gt;one&lt;/strong&gt;. There could be one, four, or all eight. “Some” rules out zero. It does not rule out “most” or “all.”&lt;/p&gt;

&lt;p&gt;This is easy to miss because in ordinary conversation “some” often suggests “some, but not all.” On the LSAT, that extra phrase is not part of the statement. If all eight books are hardcover, it is still true that some are hardcover.&lt;/p&gt;
&lt;aside class=&quot;quantity-check&quot; data-check=&quot;0&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Try it&lt;/span&gt;&lt;span&gt;01&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; “Some applicants received an interview.” Could every applicant have received one? Does the sentence tell us that anyone was denied an interview?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-0&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-0&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;Every applicant could have received an interview. The sentence does not tell us that anyone was denied one. “Some” guarantees at least one applicant received an interview, but it leaves open how many others did.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;p&gt;Whenever you read &lt;strong&gt;some&lt;/strong&gt;, replace it with &lt;strong&gt;at least one&lt;/strong&gt; in your head. That tells you exactly what the sentence guarantees:&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;&lt;strong&gt;Some of the books are hardcover.&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;At least one of the books is hardcover.&lt;/strong&gt;&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;Now focus on that one book. It belongs to both groups: it is a book, and it is hardcover. If we describe the same object from the hardcover side, we can say:&lt;/p&gt;
&lt;blockquote&gt;
&lt;p&gt;&lt;strong&gt;Some hardcover items are books.&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;At least one hardcover item is a book.&lt;/strong&gt;&lt;/p&gt;
&lt;/blockquote&gt;
&lt;p&gt;We have not found a new object. We have described the same overlap in the other direction. That is why a &lt;strong&gt;some&lt;/strong&gt; statement works both ways:&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;Books  ←some→  Hardcover
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The double arrow tells us that at least one thing belongs to both groups. It does not tell us that every book is hardcover or that every hardcover item is a book.&lt;/p&gt;
&lt;h3&gt;What would make “some” false?&lt;/h3&gt;
&lt;p&gt;If &lt;strong&gt;some books are hardcover&lt;/strong&gt; is false, then &lt;strong&gt;no books are hardcover&lt;/strong&gt;. There is not even one book in both groups. Notice the difference between &lt;strong&gt;no books are hardcover&lt;/strong&gt; and &lt;strong&gt;some books are not hardcover&lt;/strong&gt;. The second sentence still allows other books to be hardcover, so it does not negate “some.”&lt;/p&gt;
&lt;h2 id=&quot;most&quot; class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;02&lt;/span&gt;Most guarantees more than half&lt;/h2&gt;
&lt;p&gt;Now I tell you that &lt;strong&gt;most of the eight books are hardcover&lt;/strong&gt;. We need at least &lt;strong&gt;five&lt;/strong&gt; hardcover books. Four would be exactly half, and half is not most. Five, six, seven, or eight could satisfy the sentence.&lt;/p&gt;

&lt;aside class=&quot;quantity-check&quot; data-check=&quot;1&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Try it&lt;/span&gt;&lt;span&gt;02&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; If most of the eight books are hardcover, must some of them be hardcover? Must any be paperback?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-1&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-1&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;At least five are hardcover, so &lt;strong&gt;some are hardcover&lt;/strong&gt;. No paperback book is required. All eight could be hardcover.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;p&gt;Here is where the direction of the statement matters. From “most books are hardcover,” we know that &lt;strong&gt;some hardcover things are books&lt;/strong&gt;. We cannot say that &lt;strong&gt;most hardcover things are books&lt;/strong&gt;. Five of our eight shelf books could be hardcover, while a library holds hundreds of other hardcover items. The first statement counts the eight books; the reversed statement counts a different group.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;Books  ─most→  Hardcover
Hardcover  ←some→  Books
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The first arrow gives the majority claim. The second line is the overlap that the majority guarantees. When we read a most statement backward, the word becomes &lt;strong&gt;some&lt;/strong&gt;.&lt;/p&gt;
&lt;aside class=&quot;quantity-check&quot; data-check=&quot;2&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Quick check&lt;/span&gt;&lt;span&gt;03&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; A program has 100 applicants. Most speak Spanish. What is the smallest possible number who speak Spanish? What is the largest?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-2&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-2&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;&lt;strong&gt;51 to 100.&lt;/strong&gt; Fifty is only half. “Most” also permits all 100, so it does not establish an exception.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;h3&gt;What would make “most” false?&lt;/h3&gt;
&lt;p&gt;“Most of the eight books are hardcover” needs at least five hardcover books. Its negation permits &lt;strong&gt;four or fewer&lt;/strong&gt;. Four is exactly half, so it already makes “most” false. The opposite of “most are hardcover” is &lt;strong&gt;half or fewer are hardcover&lt;/strong&gt;, not “most are paperback.” Both kinds could make up exactly half.&lt;/p&gt;
&lt;h2 id=&quot;all&quot; class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;03&lt;/span&gt;All leaves no exception&lt;/h2&gt;
&lt;p&gt;If &lt;strong&gt;all eight books are hardcover&lt;/strong&gt;, every book on the shelf is hardcover. One paperback on that shelf would make the statement false.&lt;/p&gt;

&lt;p&gt;An all statement gives us a rule: &lt;strong&gt;if it is one of these eight books, then it is hardcover&lt;/strong&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;One of these books  →  Hardcover
Not hardcover       →  Not one of these books
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The second line is the contrapositive. Both lines go with the same rule. We cannot turn the first line around and conclude that every hardcover thing is a book on this shelf.&lt;/p&gt;
&lt;aside class=&quot;quantity-check&quot; data-check=&quot;3&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Try it&lt;/span&gt;&lt;span&gt;04&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; You pick up a paperback. What does the rule tell you? What if you pick up a hardcover book from another shelf?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-3&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-3&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;The paperback cannot be one of these eight books. A hardcover book from another shelf does not become one of these eight just because it is hardcover. Being hardcover is required, but it is not enough to identify one of these books.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;p&gt;There is a small qualification. “All A are B” gives a rule about A. By itself, it does not tell us that any A exist. When we already know the group exists, all also guarantees most and some.&lt;/p&gt;
&lt;h3&gt;What would make “all” false?&lt;/h3&gt;
&lt;p&gt;One exception is enough. “Not all eight books are hardcover” means &lt;strong&gt;at least one of the eight is not hardcover&lt;/strong&gt;. The other seven could still be hardcover. This is the negation of the all claim. By contrast, “not hardcover → not one of these eight books” is its &lt;strong&gt;contrapositive&lt;/strong&gt;: another way to state the original rule, not a way to deny it.&lt;/p&gt;
&lt;h2 class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;04&lt;/span&gt;Put the three statements side by side&lt;/h2&gt;
&lt;p&gt;The same shelf can help us see the whole range.&lt;/p&gt;

;For eight existing books: some permits one through eight hardcover, most permits five through eight, and all requires eight.&quot;&gt;&lt;/figure&gt;
&lt;p&gt;Read the implications in one direction:&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;ALL  →  MOST  →  SOME       (when the group exists)
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;If all eight books are hardcover, then most are, and some are. If only “some” is given, all eight &lt;strong&gt;could&lt;/strong&gt; be hardcover, but we cannot conclude that they &lt;strong&gt;are&lt;/strong&gt;. Keep the distinction between a possible situation and a required one.&lt;/p&gt;
&lt;h2 id=&quot;inferences&quot; class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;05&lt;/span&gt;Carry a claim through an all rule&lt;/h2&gt;
&lt;p&gt;Now we can combine statements. Suppose &lt;strong&gt;some library books are mysteries&lt;/strong&gt; and &lt;strong&gt;all mysteries are fiction&lt;/strong&gt;. We have at least one book that is a mystery. The all rule applies to every mystery, including that one. So &lt;strong&gt;some library books are fiction&lt;/strong&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;Library books  ←some→  Mysteries  →  Fiction
Library books  ←some→  Fiction
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The all arrow points &lt;strong&gt;away from&lt;/strong&gt; the mystery group we reached. That is why the chain works. If the second sentence said only “most mysteries are fiction,” the mystery books we found could be among the exceptions.&lt;/p&gt;

&lt;tr&gt;

&lt;th&gt;Rule&lt;/th&gt;
&lt;th&gt;What follows&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Some library books are mysteries.&lt;/td&gt;
&lt;td&gt;All mysteries are fiction.&lt;/td&gt;
&lt;td&gt;Some library books are fiction.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Most library books are mysteries.&lt;/td&gt;
&lt;td&gt;All mysteries are fiction.&lt;/td&gt;
&lt;td&gt;Most library books are fiction.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;All library books are mysteries.&lt;/td&gt;
&lt;td&gt;All mysteries are fiction.&lt;/td&gt;

&lt;aside class=&quot;quantity-check&quot; data-check=&quot;5&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Try it&lt;/span&gt;&lt;span&gt;06&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; “Most library books are mysteries. All fiction is mystery.” Can we conclude that most library books are fiction?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-5&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-5&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;No. The all arrow goes from fiction to mystery. We cannot start at mystery and travel backward to fiction.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;h2 class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;06&lt;/span&gt;Two majorities of the same group must meet&lt;/h2&gt;
&lt;p&gt;Suppose a club has ten members. &lt;strong&gt;Most members study law&lt;/strong&gt;, and &lt;strong&gt;most members work part time&lt;/strong&gt;. Each “most” needs at least six of the ten members. Those two sets cannot fit inside the club without sharing at least two people.&lt;/p&gt;
&lt;section class=&quot;quantity-overlap-lab&quot; aria-label=&quot;Explore why two majorities overlap&quot;&gt;
    &lt;div class=&quot;quantity-overlap-head&quot;&gt;&lt;h3&gt;Try to separate the majorities.&lt;/h3&gt;&lt;p&gt;Six of ten club members study law. Six work part time. Rearrange the workers and watch what cannot change.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-overlap-people&quot; id=&quot;quantity-overlap-people&quot; aria-label=&quot;Ten club members&quot;&gt;&lt;span class=&quot;quantity-person studies-law &quot; role=&quot;img&quot; aria-label=&quot;Member 1: studies law, does not work part time&quot;&gt;01&lt;/span&gt;&lt;span class=&quot;quantity-person studies-law &quot; role=&quot;img&quot; aria-label=&quot;Member 2: studies law, does not work part time&quot;&gt;02&lt;/span&gt;&lt;span class=&quot;quantity-person studies-law &quot; role=&quot;img&quot; aria-label=&quot;Member 3: studies law, does not work part time&quot;&gt;03&lt;/span&gt;&lt;span class=&quot;quantity-person studies-law &quot; role=&quot;img&quot; aria-label=&quot;Member 4: studies law, does not work part time&quot;&gt;04&lt;/span&gt;&lt;span class=&quot;quantity-person studies-law works-part-time&quot; role=&quot;img&quot; aria-label=&quot;Member 5: studies law, works part time&quot;&gt;05&lt;/span&gt;&lt;span class=&quot;quantity-person studies-law works-part-time&quot; role=&quot;img&quot; aria-label=&quot;Member 6: studies law, works part time&quot;&gt;06&lt;/span&gt;&lt;span class=&quot;quantity-person works-part-time&quot; role=&quot;img&quot; aria-label=&quot;Member 7: does not study law, works part time&quot;&gt;07&lt;/span&gt;&lt;span class=&quot;quantity-person works-part-time&quot; role=&quot;img&quot; aria-label=&quot;Member 8: does not study law, works part time&quot;&gt;08&lt;/span&gt;&lt;span class=&quot;quantity-person works-part-time&quot; role=&quot;img&quot; aria-label=&quot;Member 9: does not study law, works part time&quot;&gt;09&lt;/span&gt;&lt;span class=&quot;quantity-person works-part-time&quot; role=&quot;img&quot; aria-label=&quot;Member 10: does not study law, works part time&quot;&gt;10&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-overlap-legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;law&quot;&gt;&lt;/i&gt;Studies law&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;work&quot;&gt;&lt;/i&gt;Works part time&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;both&quot;&gt;&lt;/i&gt;Both&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-overlap-footer&quot;&gt;&lt;p aria-live=&quot;polite&quot;&gt;&lt;b id=&quot;quantity-overlap-count&quot;&gt;2&lt;/b&gt; members have both traits. &lt;span id=&quot;quantity-overlap-message&quot;&gt;Even the smallest possible overlap is not zero.&lt;/span&gt;&lt;/p&gt;&lt;button id=&quot;quantity-overlap-shuffle&quot; type=&quot;button&quot;&gt;Rearrange the workers &lt;span aria-hidden=&quot;true&quot;&gt;↻&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-venn&quot;&gt;&lt;p&gt;&lt;b&gt;The universe is the ten club members.&lt;/b&gt; The shared middle cannot be empty.&lt;/p&gt;&lt;svg viewBox=&quot;0 0 640 278&quot; role=&quot;img&quot; aria-label=&quot;Venn diagram of ten club members, updated as the members are rearranged&quot;&gt;&lt;rect x=&quot;8&quot; y=&quot;8&quot; width=&quot;624&quot; height=&quot;262&quot; rx=&quot;18&quot; fill=&quot;#fffdfa&quot; stroke=&quot;#bed6d3&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;30&quot; y=&quot;37&quot; fill=&quot;#173047&quot; font-size=&quot;16&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;All ten club members&lt;/text&gt;&lt;circle cx=&quot;259&quot; cy=&quot;151&quot; r=&quot;98&quot; fill=&quot;#48b0a9&quot; fill-opacity=&quot;.36&quot; stroke=&quot;#00847f&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;381&quot; cy=&quot;151&quot; r=&quot;98&quot; fill=&quot;#bb9bdf&quot; fill-opacity=&quot;.36&quot; stroke=&quot;#7650a3&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;98&quot; fill=&quot;#173047&quot; font-size=&quot;14&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;Study law&lt;/text&gt;&lt;text x=&quot;380&quot; y=&quot;98&quot; fill=&quot;#173047&quot; font-size=&quot;14&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;Work part time&lt;/text&gt;&lt;text id=&quot;venn-law-only&quot; x=&quot;206&quot; y=&quot;165&quot; fill=&quot;#173047&quot; font-size=&quot;27&quot; font-weight=&quot;700&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;4&lt;/text&gt;&lt;text id=&quot;venn-both&quot; x=&quot;312&quot; y=&quot;165&quot; fill=&quot;#173047&quot; font-size=&quot;27&quot; font-weight=&quot;700&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;2&lt;/text&gt;&lt;text id=&quot;venn-work-only&quot; x=&quot;415&quot; y=&quot;165&quot; fill=&quot;#173047&quot; font-size=&quot;27&quot; font-weight=&quot;700&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;4&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;247&quot; fill=&quot;#173047&quot; font-size=&quot;13&quot; font-family=&quot;Outfit, sans-serif&quot;&gt;Neither: &lt;tspan id=&quot;venn-neither&quot;&gt;0&lt;/tspan&gt;&lt;/text&gt;&lt;/svg&gt;&lt;small&gt;The circle areas are schematic. The numbers count members and change when you rearrange them.&lt;/small&gt;&lt;/div&gt;
  &lt;/section&gt;
&lt;p&gt;&lt;strong&gt;What is given?&lt;/strong&gt; More than half of the &lt;em&gt;same ten members&lt;/em&gt; study law. More than half of those same ten work part time. The claims count club members, not all law students or all part-time workers everywhere.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Why must they meet?&lt;/strong&gt; Each group needs at least six members. If the groups were separate, we would need twelve different club members. There are only ten. At least two members must be in both groups.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;What follows?&lt;/strong&gt; &lt;strong&gt;Some law students work part time.&lt;/strong&gt; We can reverse that some claim: &lt;strong&gt;some part-time workers study law&lt;/strong&gt;. Both sentences describe the same overlapping members. We know at least one exists; we do not know that most law students or most part-time workers have the other trait.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;Given:       Most club members study law.
             Most club members work part time.
Must follow: Some law students work part time.
Why:         Both majorities count the same club members.
&lt;/code&gt;&lt;/pre&gt;
&lt;aside class=&quot;quantity-check&quot; data-check=&quot;6&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Quick check&lt;/span&gt;&lt;span&gt;07&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; A club has 25 members. Most are lawyers, and most play an instrument. What is the smallest possible number who are both lawyers and play an instrument?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-6&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-6&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;&lt;strong&gt;One.&lt;/strong&gt; Each majority needs at least 13 members. If none overlapped, those groups would require 26 different people, but the club has only 25. All 25 could also have both traits.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;aside class=&quot;quantity-check&quot; data-check=&quot;7&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Try it&lt;/span&gt;&lt;span&gt;08&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; If most club members study law and most club members work part time, could the two groups of members be completely separate?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-7&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-7&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;No. Two separate majorities would require more members than the club has. At least one member must have both traits.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;h3&gt;When all describes that same group&lt;/h3&gt;
&lt;p&gt;There is another way to guarantee an overlap. Suppose &lt;strong&gt;most club members study law&lt;/strong&gt;, and &lt;strong&gt;all club members work part time&lt;/strong&gt;. We already know there are law students in the club. The all rule tells us that &lt;em&gt;each one of those members&lt;/em&gt; also works part time. So &lt;strong&gt;some law students work part time&lt;/strong&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;Given:       Most club members study law.
             All club members work part time.
Must follow: Some law students work part time.
Why:         The law students already found are club members,
             so the all rule applies to each of them.
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;We can make the same move with &lt;strong&gt;some&lt;/strong&gt;. If &lt;strong&gt;some club members study law&lt;/strong&gt; and &lt;strong&gt;all club members work part time&lt;/strong&gt;, take the member guaranteed by “some.” That person has both traits. Again, &lt;strong&gt;some law students work part time&lt;/strong&gt;. The sentences can be stated in the other order: &lt;strong&gt;all club members work part time; some club members study law&lt;/strong&gt;. The same person still proves the overlap.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;h2 class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;07&lt;/span&gt;Two majorities can also compare group sizes&lt;/h2&gt;
&lt;p&gt;Here is a different comparison. &lt;strong&gt;Most debate team members are seniors&lt;/strong&gt;, but &lt;strong&gt;most seniors are not on the debate team&lt;/strong&gt;. The seniors on the team are more than half of the team and less than half of the seniors. The same overlap takes up a larger share of the team than of the senior class. Therefore, &lt;strong&gt;there are more seniors than debate team members&lt;/strong&gt;.&lt;/p&gt;

&lt;p&gt;The numbers in the picture are one possible case. The conclusion follows from the two majority claims, not from those particular numbers.&lt;/p&gt;
&lt;h2 class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;08&lt;/span&gt;Similar chains can leave a gap&lt;/h2&gt;
&lt;p&gt;Two some statements need not describe the same person or thing:&lt;/p&gt;
&lt;pre&gt;&lt;code class=&quot;language-text&quot;&gt;Some volunteers speak Spanish.
Some Spanish speakers are trained.
&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;The trained Spanish speakers could all be people who do not volunteer. We cannot conclude that any volunteers are trained.&lt;/p&gt;
