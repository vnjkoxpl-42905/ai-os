&lt;p&gt;Replacing the second “some” with “most” does not fix the gap. The Spanish-speaking volunteers could sit in the untrained minority. Even two most statements that count different groups do not automatically produce a new majority claim.&lt;/p&gt;
&lt;p&gt;Before drawing a conclusion, ask: &lt;strong&gt;Am I carrying a known group through an all rule? Or do two majorities count the same group?&lt;/strong&gt; If neither is true, check whether the groups could miss each other.&lt;/p&gt;
&lt;aside class=&quot;quantity-check&quot; data-check=&quot;9&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Quick check&lt;/span&gt;&lt;span&gt;10&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; A club has 13 members. Most are women, and some are dancers. How many female dancers are guaranteed? How many are possible?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-9&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-9&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;&lt;strong&gt;Zero are guaranteed; as many as 13 are possible.&lt;/strong&gt; Seven women and one dancer meet the statements even if that dancer is one of the six men. Both traits could also belong to every member. A most claim and a some claim about the same group do not force the two traits to meet.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;section class=&quot;quantity-summary&quot;&gt;&lt;h2 class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;09&lt;/span&gt;The moves to keep&lt;/h2&gt;
&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;What you have&lt;/th&gt;
&lt;th&gt;What you may conclude&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;Some A are B&lt;/td&gt;
&lt;td&gt;Some B are A&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Most A are B&lt;/td&gt;
&lt;td&gt;Some A are B, and some B are A&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;All A are B&lt;/td&gt;
&lt;td&gt;A → B, and not B → not A&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Some/most/all A are B; all B are C&lt;/td&gt;
&lt;td&gt;The same first quantity of A are C&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Most A are B; most A are C&lt;/td&gt;
&lt;td&gt;Some B are C&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Most A are B; all A are C&lt;/td&gt;
&lt;td&gt;Some B are C&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;Some A are B; all A are C&lt;/td&gt;
&lt;td&gt;Some B are C&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;Two &lt;strong&gt;all&lt;/strong&gt; claims about A guarantee that every A has both traits. They guarantee &lt;strong&gt;some B are C&lt;/strong&gt; only when we also know that at least one A exists.&lt;/p&gt;
&lt;p&gt;Use the sentence behind each arrow to check what it guarantees.&lt;/p&gt;
&lt;/section&gt;&lt;section class=&quot;quantity-language&quot;&gt;&lt;h2 class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;10&lt;/span&gt;Nearby words need a closer look&lt;/h2&gt;
&lt;p&gt;The words around a quantity statement can look familiar without making the same promise. Sort them by &lt;strong&gt;what they guarantee&lt;/strong&gt;, then check the sentence in front of you:&lt;/p&gt;
&lt;table&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;Word or phrase&lt;/th&gt;
&lt;th&gt;What it guarantees&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;Some&lt;/strong&gt;, &lt;strong&gt;at least one&lt;/strong&gt;, &lt;strong&gt;one or more&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;One or more members fit. All may fit too.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;A few&lt;/strong&gt;, &lt;strong&gt;several&lt;/strong&gt;, &lt;strong&gt;many&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;A positive number in ordinary use, but no universal cutoff. They imply at least one.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;Most&lt;/strong&gt;, &lt;strong&gt;more than half&lt;/strong&gt;, &lt;strong&gt;a majority of&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;Strictly more than half of the named group fit.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;All&lt;/strong&gt;, &lt;strong&gt;every&lt;/strong&gt;, &lt;strong&gt;each&lt;/strong&gt;, &lt;strong&gt;without exception&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;Every member of the named group fits. The group may still need a separate existence premise.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;Few&lt;/strong&gt;, &lt;strong&gt;not many&lt;/strong&gt;, &lt;strong&gt;not often&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;A small number or low frequency in context. No exact numerical boundary follows.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;No&lt;/strong&gt;, &lt;strong&gt;none&lt;/strong&gt;, &lt;strong&gt;zero&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;Not a single member fits.&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td&gt;&lt;strong&gt;Not all&lt;/strong&gt;&lt;/td&gt;
&lt;td&gt;At least one member does &lt;strong&gt;not&lt;/strong&gt; fit.&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;p&gt;&lt;strong&gt;Few&lt;/strong&gt; is worth separating from &lt;strong&gt;a few&lt;/strong&gt;. “A few books are hardcover” affirms that at least some are. “Few books are hardcover” stresses how small the number is. It often suggests some in ordinary speech, but it does not set a dependable numerical minimum. “Not many” can include zero. A hundred menu items could make five feel like few; in a menu of six, five would not feel like few. Do not quietly replace any of these phrases with a fixed number.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Most&lt;/strong&gt; is different: it crosses a precise line, &lt;strong&gt;more than half&lt;/strong&gt;. Words such as &lt;strong&gt;the majority&lt;/strong&gt; plainly express that idea. Words such as &lt;strong&gt;usually&lt;/strong&gt;, &lt;strong&gt;typically&lt;/strong&gt;, &lt;strong&gt;generally&lt;/strong&gt;, &lt;strong&gt;commonly&lt;/strong&gt;, &lt;strong&gt;frequently&lt;/strong&gt;, &lt;strong&gt;often&lt;/strong&gt;, &lt;strong&gt;likely&lt;/strong&gt;, and &lt;strong&gt;probably&lt;/strong&gt; can suggest prevalence in context, but pay attention to what the sentence actually counts. “Probably” about one event, for example, is a likelihood claim, not a headcount of a group.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Not all&lt;/strong&gt; &lt;em&gt;does&lt;/em&gt; give us a precise minimum: at least one exception. “Not all club members are lawyers” means &lt;strong&gt;at least one club member is not a lawyer&lt;/strong&gt;. It does not tell us whether the other members are lawyers.&lt;/p&gt;
&lt;aside class=&quot;quantity-check&quot; data-check=&quot;10&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Quick check&lt;/span&gt;&lt;span&gt;11&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt; A menu lists 100 beers. “Many are Belgian,” “few are Belgian,” and “not many are Belgian” are three claims. Can you assign each one an exact minimum and maximum? What does “not all are Belgian” guarantee?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-check-10&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-check-10&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;div class=&quot;quantity-answer-body&quot;&gt;&lt;p&gt;The first three do &lt;strong&gt;not&lt;/strong&gt; have fixed numerical boundaries. “Many” suggests more than an isolated example, while “few” and “not many” suggest a small number relative to the context. None alone licenses a specific cutoff such as five or ten. “Not all” is exact about one thing: &lt;strong&gt;at least one beer is not Belgian&lt;/strong&gt;.&lt;/p&gt;
&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/aside&gt;

&lt;/section&gt;&lt;section class=&quot;quantity-quiz&quot; id=&quot;quantity-quiz&quot; aria-labelledby=&quot;quantity-quiz-title&quot;&gt;
  &lt;div class=&quot;quantity-quiz-top&quot;&gt;&lt;span&gt;Practice&lt;/span&gt;&lt;span class=&quot;quantity-quiz-progress&quot; id=&quot;quantity-quiz-progress&quot;&gt;01 / 07&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;quantity-quiz-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;span id=&quot;quantity-quiz-track-fill&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;h3 id=&quot;quantity-quiz-title&quot;&gt;Can you prove the overlap?&lt;/h3&gt;
  &lt;p class=&quot;quantity-quiz-intro&quot;&gt;Seven short answers. Make a call, explain it, then compare your reasoning.&lt;/p&gt;
  &lt;div class=&quot;quantity-quiz-stage&quot;&gt;
    &lt;div class=&quot;quantity-quiz-premises&quot; id=&quot;quantity-quiz-premises&quot;&gt;&lt;span&gt;Given&lt;/span&gt;&lt;strong&gt;Some A are B.&lt;/strong&gt;&lt;strong&gt;All B are C.&lt;/strong&gt;&lt;/div&gt;
    &lt;div class=&quot;quantity-quiz-bridge&quot; id=&quot;quantity-quiz-bridge&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;A&lt;/span&gt;&lt;i&gt;&lt;/i&gt;&lt;span&gt;C&lt;/span&gt;&lt;/div&gt;
    &lt;form id=&quot;quantity-quiz-form&quot; class=&quot;quantity-quiz-form&quot;&gt;
      &lt;label for=&quot;quantity-quiz-input&quot;&gt;Must some A be C?&lt;/label&gt;
      &lt;p&gt;Start with &lt;b&gt;Yes&lt;/b&gt; or &lt;b&gt;No&lt;/b&gt;, then tell me why.&lt;/p&gt;
      &lt;textarea id=&quot;quantity-quiz-input&quot; rows=&quot;3&quot; placeholder=&quot;Yes or no, because…&quot; required&gt;&lt;/textarea&gt;
      &lt;div class=&quot;quantity-quiz-actions&quot;&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;span id=&quot;quantity-quiz-error&quot; role=&quot;alert&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/form&gt;
    &lt;div class=&quot;quantity-quiz-feedback&quot; id=&quot;quantity-quiz-feedback&quot; hidden tabindex=&quot;-1&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;quantity-quiz-feedback-label&quot; id=&quot;quantity-quiz-feedback-label&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;quantity-quiz-verdict&quot; id=&quot;quantity-quiz-verdict&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;quantity-quiz-explanation&quot; id=&quot;quantity-quiz-explanation&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;quantity-quiz-reflection&quot;&gt;Compare your explanation with this one. Did you identify the same person or the same gap?&lt;/p&gt;
      &lt;button class=&quot;quantity-quiz-next&quot; id=&quot;quantity-quiz-next&quot; type=&quot;button&quot;&gt;Next question &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;quantity-quiz-done&quot; id=&quot;quantity-quiz-done&quot; hidden&gt;&lt;span&gt;Practice complete&lt;/span&gt;&lt;strong id=&quot;quantity-quiz-score&quot;&gt;&lt;/strong&gt;&lt;p&gt;You checked each conclusion against a witness or a possible gap. Review any answer where your reason differed, even if your yes or no matched.&lt;/p&gt;&lt;button id=&quot;quantity-quiz-restart&quot; type=&quot;button&quot;&gt;Try the seven again ↺&lt;/button&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;quantity-drill&quot;&gt;&lt;h2 id=&quot;drill&quot; class=&quot;quantity-chapter&quot;&gt;&lt;span class=&quot;quantity-chapter-number&quot;&gt;11&lt;/span&gt;Short drill: diagram, combine, decide&lt;/h2&gt;
&lt;p&gt;Here are five statements about one volunteer program. &lt;strong&gt;Volunteer&lt;/strong&gt;, &lt;strong&gt;Spanish speaker&lt;/strong&gt;, &lt;strong&gt;trained person&lt;/strong&gt;, &lt;strong&gt;weekend worker&lt;/strong&gt;, and &lt;strong&gt;student&lt;/strong&gt; name groups of people. Treat each sentence as true.&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;Some volunteers speak Spanish.&lt;/li&gt;
&lt;li&gt;All Spanish speakers are trained.&lt;/li&gt;
&lt;li&gt;Most volunteers work weekends.&lt;/li&gt;
&lt;li&gt;Most volunteers are students.&lt;/li&gt;
&lt;li&gt;Most weekend workers are trained.&lt;/li&gt;
&lt;/ol&gt;
&lt;p class=&quot;quantity-drill-diagram-note&quot;&gt;Diagram the five statements for yourself. Then work through these four questions. Your answer stays on the page while you compare it with the worked reason.&lt;/p&gt;&lt;section class=&quot;quantity-check quantity-drill-check&quot; data-drill=&quot;0&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Question 1&lt;/span&gt;&lt;span&gt;01 / 04&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt;Which two statements prove that some volunteers are trained?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-drill-0&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-drill-0&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;p&gt;Statements 1 and 2. At least one volunteer speaks Spanish. Every Spanish speaker is trained. That volunteer is trained.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;quantity-check quantity-drill-check&quot; data-drill=&quot;1&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Question 2&lt;/span&gt;&lt;span&gt;02 / 04&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt;Which two statements prove that some students work weekends?&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-drill-1&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-drill-1&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;p&gt;Statements 3 and 4. Both majorities count volunteers, so the students and weekend workers must share at least one volunteer.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;quantity-check quantity-drill-check&quot; data-drill=&quot;2&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Question 3&lt;/span&gt;&lt;span&gt;03 / 04&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt;Do statements 3 and 5 prove that most volunteers are trained? Explain.&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-drill-2&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-drill-2&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;p&gt;No. Statement 3 counts volunteers; statement 5 counts all weekend workers. The volunteer weekend workers could be in the untrained minority of weekend workers.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;quantity-check quantity-drill-check&quot; data-drill=&quot;3&quot;&gt;&lt;div class=&quot;quantity-check-top&quot;&gt;&lt;span&gt;Question 4&lt;/span&gt;&lt;span&gt;04 / 04&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;quantity-check-question&quot;&gt;Can either valid some conclusion be reversed? Give an example.&lt;/p&gt;&lt;form class=&quot;quantity-check-form&quot;&gt;&lt;label for=&quot;quantity-drill-3&quot;&gt;Your answer&lt;/label&gt;&lt;textarea id=&quot;quantity-drill-3&quot; rows=&quot;2&quot; placeholder=&quot;Write your answer here…&quot; required&gt;&lt;/textarea&gt;&lt;button type=&quot;submit&quot;&gt;Check my answer &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/form&gt;&lt;div class=&quot;quantity-check-result&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;strong&gt;&lt;/strong&gt;&lt;div class=&quot;quantity-check-worked&quot;&gt;&lt;p&gt;Yes. Some trained people are volunteers. Some weekend workers are students. Each sentence describes the same overlap in reverse.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;quantity-check-again&quot;&gt;Edit my answer&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;/section&gt;&lt;/article&gt;
    
  &lt;/div&gt;&lt;/main&gt;
&lt;/div&gt;
&lt;script&gt;
if(new URLSearchParams(location.search).get(&#x27;theme&#x27;)===&#x27;dark&#x27;)document.documentElement.classList.add(&#x27;dark&#x27;);
const slider=document.getElementById(&#x27;quantity-slider&#x27;);
const count=document.getElementById(&#x27;quantity-count&#x27;);
const books=[...document.querySelectorAll(&#x27;.quantity-lab-book&#x27;)];
const rules={some:1,most:5,all:8};
slider.addEventListener(&#x27;input&#x27;,()=&gt;{const value=Number(slider.value);count.textContent=value;books.forEach((book,index)=&gt;{const was=book.classList.contains(&#x27;is-hardcover&#x27;);const now=index&lt;value;book.classList.toggle(&#x27;is-hardcover&#x27;,now);if(now&amp;&amp;!was){book.classList.remove(&#x27;is-new&#x27;);void book.offsetWidth;book.classList.add(&#x27;is-new&#x27;);setTimeout(()=&gt;book.classList.remove(&#x27;is-new&#x27;),700)}});for(const [rule,minimum] of Object.entries(rules)){const pill=document.querySelector(&#x27;[data-rule=&quot;&#x27;+rule+&#x27;&quot;]&#x27;);const was=pill.classList.contains(&#x27;is-true&#x27;);const now=value&gt;=minimum;pill.classList.toggle(&#x27;is-true&#x27;,now);if(now&amp;&amp;!was){pill.classList.remove(&#x27;is-new&#x27;);void pill.offsetWidth;pill.classList.add(&#x27;is-new&#x27;);setTimeout(()=&gt;pill.classList.remove(&#x27;is-new&#x27;),600)}}});
const progress=document.querySelector(&#x27;.quantity-progress&#x27;);let pending=false;
function updateProgress(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.transform=&#x27;scaleX(&#x27;+Math.max(0,Math.min(1,max&gt;0?scrollY/max:0))+&#x27;)&#x27;;pending=false}
addEventListener(&#x27;scroll&#x27;,()=&gt;{if(!pending){requestAnimationFrame(updateProgress);pending=true}},{passive:true});addEventListener(&#x27;resize&#x27;,updateProgress);updateProgress();
const workerArrangements=[[4,5,6,7,8,9],[0,1,2,3,4,5],[2,3,4,5,6,7],[1,3,5,7,8,9]];let arrangement=0;
