<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-labelledby="title desc">
  <title id="title">MOST: more than half</title>
  <desc id="desc">Six chocolate cookies or all ten chocolate cookies both satisfy most cookies are chocolate.</desc>
  <defs><g id="choco"><circle r="21" fill="#9b5630" stroke="#6b351f" stroke-width="2"/><circle cx="-8" cy="-6" r="3" fill="#4c2518"/><circle cx="6" cy="-10" r="3" fill="#4c2518"/><circle cx="10" cy="5" r="3" fill="#4c2518"/><circle cx="-6" cy="10" r="3" fill="#4c2518"/></g><g id="plain"><circle r="21" fill="#f1d9a3" stroke="#997c4d" stroke-width="2"/><circle cx="-7" cy="-6" r="2" fill="#b69363"/><circle cx="8" cy="7" r="2" fill="#b69363"/></g></defs>
  <rect width="900" height="325" rx="24" fill="#f8f5ee"/>
  <text x="42" y="53" fill="#152d36" font-family="Arial,sans-serif" font-size="26" font-weight="700">MOST: more than half</text>
  <text x="42" y="82" fill="#49606a" font-family="Arial,sans-serif" font-size="16">Dark cookies are chocolate. Each row has ten cookies.</text>
  <text x="42" y="149" fill="#152d36" font-family="Arial,sans-serif" font-size="20" font-weight="700">Minimum: 6 of 10</text>
  <use href="#choco" x="326" y="143"/>
  <use href="#choco" x="380" y="143"/>
  <use href="#choco" x="434" y="143"/>
  <use href="#choco" x="488" y="143"/>
  <use href="#choco" x="542" y="143"/>
  <use href="#choco" x="596" y="143"/>
  <use href="#plain" x="650" y="143"/>
  <use href="#plain" x="704" y="143"/>
  <use href="#plain" x="758" y="143"/>
  <use href="#plain" x="812" y="143"/>
  <text x="42" y="254" fill="#152d36" font-family="Arial,sans-serif" font-size="20" font-weight="700">Also possible: 10 of 10</text>
  <use href="#choco" x="326" y="248"/>
  <use href="#choco" x="380" y="248"/>
  <use href="#choco" x="434" y="248"/>
  <use href="#choco" x="488" y="248"/>
  <use href="#choco" x="542" y="248"/>
  <use href="#choco" x="596" y="248"/>
  <use href="#choco" x="650" y="248"/>
  <use href="#choco" x="704" y="248"/>
  <use href="#choco" x="758" y="248"/>
  <use href="#choco" x="812" y="248"/>
</svg>
