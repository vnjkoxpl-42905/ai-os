<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">One known book carries through the all rule</title>
  <desc id="desc">A large library-books circle overlaps a large fiction circle. The smaller mysteries circle is fully inside fiction and overlaps library books. A marked book lies clearly inside all three circles.</desc>
  <rect x="1" y="1" width="718" height="408" rx="18" fill="#f8fbfa" stroke="#c9dddb"/>
  <text x="28" y="40" fill="#173047" font-family="Arial,sans-serif" font-size="19" font-weight="700">Follow the book we already know exists</text>
  <circle cx="480" cy="210" r="142" fill="#ded1ec" fill-opacity=".68" stroke="#7650a3" stroke-width="2.5"/>
  <circle cx="285" cy="210" r="145" fill="#94d8d1" fill-opacity=".65" stroke="#087e83" stroke-width="2.5"/>
  <circle cx="414" cy="207" r="68" fill="#e9bd79" fill-opacity=".78" stroke="#a26a17" stroke-width="2.5"/>
  <text x="162" y="195" fill="#173047" font-family="Arial,sans-serif" font-size="17" font-weight="700">Library books</text>
  <text x="518" y="150" fill="#173047" font-family="Arial,sans-serif" font-size="17" font-weight="700">Fiction</text>
  <text x="393" y="194" fill="#173047" font-family="Arial,sans-serif" font-size="16" font-weight="700">Mysteries</text>
  <circle cx="398" cy="229" r="11" fill="#173047" stroke="#fff" stroke-width="4"/>
  <path d="M402 240 L433 275" stroke="#173047" stroke-width="2" fill="none"/>
  <rect x="433" y="258" width="162" height="36" rx="18" fill="#173047"/>
  <text x="448" y="282" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">This known book</text>
  <text x="28" y="376" fill="#173047" font-family="Arial,sans-serif" font-size="16">The dot is in both library books and mysteries. Since every mystery is fiction,</text>
  <text x="28" y="397" fill="#173047" font-family="Arial,sans-serif" font-size="16">it is also in fiction.</text>
</svg>
