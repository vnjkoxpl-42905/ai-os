<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">A known mystery book stays inside the fiction group</title>
  <desc id="desc">A library-book circle overlaps a mystery circle. The mystery circle sits entirely inside the fiction circle. A marked point in the library-book and mystery overlap is therefore also in fiction.</desc>
  <rect x="1" y="1" width="718" height="318" rx="18" fill="#f8fbfa" stroke="#c9dddb"/>
  <text x="28" y="40" fill="#173047" font-family="Arial,sans-serif" font-size="19" font-weight="700">Follow the book we already know exists</text>
  <circle cx="485" cy="173" r="125" fill="#ded1ec" fill-opacity=".75" stroke="#7650a3" stroke-width="2"/>
  <circle cx="448" cy="179" r="72" fill="#e9bd79" fill-opacity=".82" stroke="#a26a17" stroke-width="2"/>
  <circle cx="282" cy="183" r="125" fill="#94d8d1" fill-opacity=".7" stroke="#087e83" stroke-width="2"/>
  <text x="140" y="214" fill="#173047" font-family="Arial,sans-serif" font-size="17" font-weight="700">Library books</text>
  <text x="411" y="165" fill="#173047" font-family="Arial,sans-serif" font-size="16" font-weight="700">Mysteries</text>
  <text x="524" y="118" fill="#173047" font-family="Arial,sans-serif" font-size="17" font-weight="700">Fiction</text>
  <circle cx="390" cy="183" r="12" fill="#173047" stroke="#fff" stroke-width="4"/>
  <text x="27" y="286" fill="#173047" font-family="Arial,sans-serif" font-size="15">This dot is a library book and a mystery. All mysteries are fiction, so this dot is fiction too.</text>
</svg>
