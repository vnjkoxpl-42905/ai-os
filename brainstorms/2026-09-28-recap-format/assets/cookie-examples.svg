<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" role="img" aria-labelledby="title desc">
  <title id="title">Three valid ways to describe chocolate cookies</title>
  <desc id="desc">Of ten cookies, one chocolate cookie is an example of some, six is an example of most, and ten is all. Some and most may also describe larger amounts.</desc>
  <defs>
    <g id="choco"><circle r="21" fill="#9b5630" stroke="#6b351f" stroke-width="2"/><circle cx="-8" cy="-6" r="3" fill="#4c2518"/><circle cx="6" cy="-10" r="3" fill="#4c2518"/><circle cx="10" cy="5" r="3" fill="#4c2518"/><circle cx="-6" cy="10" r="3" fill="#4c2518"/></g>
    <g id="plain"><circle r="21" fill="#f1d9a3" stroke="#997c4d" stroke-width="2"/><circle cx="-7" cy="-6" r="2" fill="#b69363"/><circle cx="8" cy="7" r="2" fill="#b69363"/></g>
  </defs>
  <rect width="900" height="445" rx="24" fill="#f8f5ee"/>
  <text x="44" y="52" fill="#152d36" font-family="Arial,sans-serif" font-size="26" font-weight="700">One valid example of each</text>
  <text x="44" y="80" fill="#49606a" font-family="Arial,sans-serif" font-size="16">Dark cookies are chocolate. Each row has 10 cookies.</text>
  <line x1="44" y1="202" x2="856" y2="202" stroke="#e0e5e1"/>
  <line x1="44" y1="314" x2="856" y2="314" stroke="#e0e5e1"/>
  <text x="44" y="152" fill="#152d36" font-family="Arial,sans-serif" font-size="23" font-weight="700">SOME</text>
  <text x="44" y="177" fill="#49606a" font-family="Arial,sans-serif" font-size="16">1 of 10 shown</text>
  <text x="44" y="264" fill="#152d36" font-family="Arial,sans-serif" font-size="23" font-weight="700">MOST</text>
  <text x="44" y="289" fill="#49606a" font-family="Arial,sans-serif" font-size="16">6 of 10 shown</text>
  <text x="44" y="376" fill="#152d36" font-family="Arial,sans-serif" font-size="23" font-weight="700">ALL</text>
  <text x="44" y="401" fill="#49606a" font-family="Arial,sans-serif" font-size="16">10 of 10 shown</text>
  <use href="#choco" x="278" y="146"/>
  <use href="#plain" x="335" y="146"/>
  <use href="#plain" x="392" y="146"/>
  <use href="#plain" x="449" y="146"/>
  <use href="#plain" x="506" y="146"/>
  <use href="#plain" x="563" y="146"/>
  <use href="#plain" x="620" y="146"/>
  <use href="#plain" x="677" y="146"/>
  <use href="#plain" x="734" y="146"/>
  <use href="#plain" x="791" y="146"/>
  <use href="#choco" x="278" y="258"/>
  <use href="#choco" x="335" y="258"/>
  <use href="#choco" x="392" y="258"/>
  <use href="#choco" x="449" y="258"/>
  <use href="#choco" x="506" y="258"/>
  <use href="#choco" x="563" y="258"/>
  <use href="#plain" x="620" y="258"/>
  <use href="#plain" x="677" y="258"/>
  <use href="#plain" x="734" y="258"/>
  <use href="#plain" x="791" y="258"/>
  <use href="#choco" x="278" y="370"/>
  <use href="#choco" x="335" y="370"/>
  <use href="#choco" x="392" y="370"/>
  <use href="#choco" x="449" y="370"/>
