<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">The same overlap takes a larger share of the smaller group</title>
  <desc id="desc">An illustrative count: six of ten debate team members are seniors, while six of twenty seniors are on the debate team. The same six-person overlap is a majority of the debate team but a minority of seniors.</desc>
  <rect width="900" height="330" rx="24" fill="#f8f5ee"/>
  <text x="42" y="52" fill="#152d36" font-family="Arial,sans-serif" font-size="25" font-weight="700">Compare the same overlap to each total</text>
  <text x="42" y="81" fill="#49606a" font-family="Arial,sans-serif" font-size="16">These numbers are one example of the two “most” claims.</text>
  <g font-family="Arial,sans-serif" fill="#152d36" font-size="19" font-weight="700">
    <text x="42" y="149">Debate team · 10</text><text x="42" y="244">Seniors · 20</text>
  </g>
  <rect x="260" y="117" width="180" height="48" rx="12" fill="#6d53a5"/>
  <rect x="440" y="117" width="120" height="48" rx="12" fill="#168d82"/>
  <rect x="260" y="212" width="180" height="48" rx="12" fill="#6d53a5"/>
  <rect x="440" y="212" width="420" height="48" rx="12" fill="#c57916"/>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="350" y="147">6 are both</text><text x="500" y="147">4 others</text>
    <text x="350" y="242">6 are both</text><text x="650" y="242">14 are not on the team</text>
  </g>
  <text x="42" y="304" fill="#49606a" font-family="Arial,sans-serif" font-size="16">Six is more than half of ten, but less than half of twenty.</text>
</svg>
