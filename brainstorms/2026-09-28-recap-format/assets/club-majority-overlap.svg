<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
<title id="title">Two majorities must meet</title><desc id="desc">Of ten club members, six study law and six work part time. Members five and six have both traits.</desc>
<rect width="920" height="300" rx="22" fill="#f7f6f1"/>
<text x="38" y="48" fill="#173047" font-family="Arial,sans-serif" font-size="27" font-weight="700">Two majorities must meet</text>
<text x="38" y="80" fill="#526679" font-family="Arial,sans-serif" font-size="17" font-weight="400">Ten club members. Each trait belongs to at least six.</text>
<circle cx="84" cy="161" r="29" fill="#087e83"/>
<text x="84" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">1</text>
<circle cx="167" cy="161" r="29" fill="#087e83"/>
<text x="167" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">2</text>
<circle cx="250" cy="161" r="29" fill="#087e83"/>
<text x="250" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">3</text>
<circle cx="333" cy="161" r="29" fill="#087e83"/>
<text x="333" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">4</text>
<circle cx="416" cy="161" r="29" fill="#7356a8"/>
<text x="416" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">5</text>
<circle cx="499" cy="161" r="29" fill="#7356a8"/>
<text x="499" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">6</text>
<circle cx="582" cy="161" r="29" fill="#c18124"/>
<text x="582" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">7</text>
<circle cx="665" cy="161" r="29" fill="#c18124"/>
<text x="665" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">8</text>
<circle cx="748" cy="161" r="29" fill="#c18124"/>
<text x="748" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">9</text>
<circle cx="831" cy="161" r="29" fill="#c18124"/>
<text x="831" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">10</text>
<line x1="84" y1="211" x2="499" y2="211" stroke="#087e83" stroke-width="5"/>
<line x1="416" y1="234" x2="831" y2="234" stroke="#c18124" stroke-width="5"/>
<text x="232" y="203" fill="#087e83" font-family="Arial,sans-serif" font-size="16" font-weight="700">Study law</text>
<text x="551" y="268" fill="#c18124" font-family="Arial,sans-serif" font-size="16" font-weight="700">Work part time</text>
<text x="392" y="203" fill="#7356a8" font-family="Arial,sans-serif" font-size="16" font-weight="700">Both</text>
</svg>