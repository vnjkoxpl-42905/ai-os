<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" role="img" aria-labelledby="title desc">
  <title id="title">A witness from some or most passes through an all rule</title>
  <desc id="desc">A club member who studies law is highlighted. Since all club members work part time, that same person has both traits.</desc>
  <rect width="760" height="245" rx="18" fill="#f7f5f0"/>
  <text x="34" y="40" fill="#17364c" font-family="Arial,sans-serif" font-size="17" font-weight="700">One person is enough to prove the overlap</text>
  <rect x="34" y="70" width="190" height="112" rx="14" fill="#fff" stroke="#bed1d8" stroke-width="2"/>
  <text x="129" y="100" text-anchor="middle" fill="#17364c" font-family="Arial,sans-serif" font-size="14" font-weight="700">Club member</text>
  <circle cx="129" cy="137" r="18" fill="#008b8f"/>
  <path d="M125 137l4 4 8-10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M234 126h50" stroke="#17364c" stroke-width="3"/>
  <path d="M276 119l10 7-10 7" fill="none" stroke="#17364c" stroke-width="3"/>
  <text x="260" y="109" text-anchor="middle" fill="#506875" font-family="Arial,sans-serif" font-size="12">same person</text>
  <rect x="294" y="70" width="190" height="112" rx="14" fill="#e7f4f2" stroke="#008b8f" stroke-width="2"/>
  <text x="389" y="100" text-anchor="middle" fill="#17364c" font-family="Arial,sans-serif" font-size="14" font-weight="700">Studies law</text>
  <circle cx="389" cy="137" r="18" fill="#008b8f"/>
  <path d="M385 137l4 4 8-10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M494 126h50" stroke="#17364c" stroke-width="3"/>
  <path d="M536 119l10 7-10 7" fill="none" stroke="#17364c" stroke-width="3"/>
  <text x="519" y="109" text-anchor="middle" fill="#506875" font-family="Arial,sans-serif" font-size="12">same person</text>
  <rect x="554" y="70" width="172" height="112" rx="14" fill="#e7f4f2" stroke="#008b8f" stroke-width="2"/>
  <text x="640" y="100" text-anchor="middle" fill="#17364c" font-family="Arial,sans-serif" font-size="14" font-weight="700">Works part time</text>
  <circle cx="640" cy="137" r="18" fill="#008b8f"/>
  <path d="M636 137l4 4 8-10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="217" text-anchor="middle" fill="#17364c" font-family="Arial,sans-serif" font-size="15">The same person makes “some law students work part time” true.</text>
</svg>
