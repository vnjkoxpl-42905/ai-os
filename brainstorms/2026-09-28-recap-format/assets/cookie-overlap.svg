<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Two majorities of the same tray overlap</title>
  <desc id="desc">Of ten cookies, six contain chocolate and six contain nuts. Cookies five and six contain both, showing the minimum overlap of two.</desc>
  <rect width="900" height="340" rx="24" fill="#f8f5ee"/>
  <text x="42" y="53" fill="#152d36" font-family="Arial,sans-serif" font-size="26" font-weight="700">Two majorities must overlap</text>
  <text x="42" y="83" fill="#49606a" font-family="Arial,sans-serif" font-size="17">Ten cookies. Six contain chocolate; six contain nuts.</text>
  <circle cx="157" cy="161" r="26" fill="#9b5630"/><text x="157" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">1</text>
  <circle cx="222" cy="161" r="26" fill="#9b5630"/><text x="222" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">2</text>
  <circle cx="287" cy="161" r="26" fill="#9b5630"/><text x="287" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">3</text>
  <circle cx="352" cy="161" r="26" fill="#9b5630"/><text x="352" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">4</text>
  <circle cx="417" cy="161" r="26" fill="#6d53a5"/><text x="417" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">5</text>
  <circle cx="482" cy="161" r="26" fill="#6d53a5"/><text x="482" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">6</text>
  <circle cx="547" cy="161" r="26" fill="#c57916"/><text x="547" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">7</text>
  <circle cx="612" cy="161" r="26" fill="#c57916"/><text x="612" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">8</text>
  <circle cx="677" cy="161" r="26" fill="#c57916"/><text x="677" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">9</text>
  <circle cx="742" cy="161" r="26" fill="#c57916"/><text x="742" y="169" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">10</text>
  <line x1="157" y1="218" x2="482" y2="218" stroke="#9b5630" stroke-width="5" stroke-linecap="round"/>
  <line x1="417" y1="238" x2="742" y2="238" stroke="#c57916" stroke-width="5" stroke-linecap="round"/>
  <text x="318" y="248" fill="#6b351f" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">Chocolate: 1–6</text>
  <text x="580" y="270" fill="#9b5b0c" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">Nuts: 5–10</text>
  <circle cx="280" cy="306" r="8" fill="#9b5630"/><text x="297" y="312" fill="#49606a" font-family="Arial,sans-serif" font-size="16">Chocolate only</text>
  <circle cx="482" cy="306" r="8" fill="#6d53a5"/><text x="499" y="312" fill="#49606a" font-family="Arial,sans-serif" font-size="16">Both</text>
  <circle cx="610" cy="306" r="8" fill="#c57916"/><text x="627" y="312" fill="#49606a" font-family="Arial,sans-serif" font-size="16">Nuts only</text>
</svg>
