<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title desc">
  <title id="title">Two some claims can use different people</title>
  <desc id="desc">The volunteer and trained circles do not touch. Both overlap the Spanish-speaker circle in different places, with a separate person in each overlap.</desc>
  <rect x="1" y="1" width="718" height="363" rx="18" fill="#f8fbfa" stroke="#c9dddb"/>
  <text x="28" y="41" fill="#173047" font-family="Arial,sans-serif" font-size="19" font-weight="700">The two witnesses can be different people</text>
  <circle cx="355" cy="176" r="110" fill="#dcebe8" stroke="#477e7a" stroke-width="2"/>
  <circle cx="214" cy="184" r="81" fill="#9ad8d2" fill-opacity=".75" stroke="#087e83" stroke-width="2"/>
  <circle cx="496" cy="184" r="81" fill="#dbc5ed" fill-opacity=".75" stroke="#7650a3" stroke-width="2"/>
  <text x="147" y="185" fill="#173047" font-family="Arial,sans-serif" font-size="16" font-weight="700">Volunteers</text>
  <text x="280" y="111" fill="#173047" font-family="Arial,sans-serif" font-size="16" font-weight="700">Spanish speakers</text>
  <text x="492" y="185" fill="#173047" font-family="Arial,sans-serif" font-size="16" font-weight="700">Trained</text>
  <circle cx="282" cy="181" r="11" fill="#173047" stroke="#fff" stroke-width="4"/>
  <circle cx="428" cy="181" r="11" fill="#173047" stroke="#fff" stroke-width="4"/>
  <text x="28" y="324" fill="#173047" font-family="Arial,sans-serif" font-size="16">Both dots speak Spanish. The left one volunteers;</text>
  <text x="28" y="347" fill="#173047" font-family="Arial,sans-serif" font-size="16">the right one is trained. They need not be the same person.</text>
</svg>
